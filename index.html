grams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-53","score":1.0,"pdfChars":274,"mirrorChars":269},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-54":{"id":"2024-54","year":2024,"number":54,"subject":"civil","question":"甲은 자신의 토지를 乙에게 매도하여 인도하였고, 乙은 그 토지를 점유·사용하다가 다시 丙에게 매도하여 인도하였다. 甲과 乙은 모두 대금 전부를 수령하였고, 甲·乙·丙 사이에 중간생략등기의 합의가 있었다. 다음 설명 중 옳은 것은?(다툼이 있으면 판례에 따름)","options":["甲은 丙을 상대로 소유물반환을 청구할 수 있다.","甲은 乙을 상대로 소유물반환을 청구할 수 없다.","丙은 직접 甲을 상대로 소유권이전등기를 청구할 수 없다.","丙은 乙을 대위하여 甲을 상대로 소유권이전등기를 청구할 수 없다.","만약 乙이 인도받은 후 현재 10년이 지났다면, 乙은 甲에 대해 소유권이전등기를 청구할 수 없다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/54","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-54","score":0.9957,"pdfChars":334,"mirrorChars":327},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-55":{"id":"2024-55","year":2024,"number":55,"subject":"civil","question":"부동산 공유에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["공유물의 보존행위는 공유자 각자가 할 수 있다.","공유자는 공유물 전부를 지분의 비율로 사용·수익할 수 있다.","공유자는 다른 공유자의 동의 없이 공유물을 처분하거나 변경하지 못한다.","공유자는 자신의 지분에 관하여 단독으로 제3자의 취득시효를 중단시킬 수 없다.","공유물 무단점유자에 대한 차임 상당 부당이득반환청구권은 특별한 사정이 없는 한 각 공유자에게 지분 비율만큼 귀속된다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/55","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-55","score":0.9973,"pdfChars":263,"mirrorChars":254},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-56":{"id":"2024-56","year":2024,"number":56,"subject":"civil","question":"공유물분할에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 재판상 분할에서 분할을 원하는 공유자의 지분만큼은 현물분할하고, 분할을 원하지 않는 공유자는 계속 공유로 남게 할 수 있다.\nㄴ. 토지의 협의분할은 등기를 마치면 그 등기가 접수된 때 물권변동의 효력이 있다.\nㄷ. 공유자는 다른 공유자가 분할로 인하여 취득한 물건에 대하여 그 지분의 비율로 매도인과 동일한 담보책임이 있다.\nㄹ. 공유자 사이에 이미 분할협의가 성립하였는데 일부 공유자가 분할에 따른 이전등기에 협조하지 않은 경우, 공유물분할소송을 제기할 수 없다.","options":["ㄱ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/56","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-56","score":1.0,"pdfChars":354,"mirrorChars":347},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-57":{"id":"2024-57","year":2024,"number":57,"subject":"civil","question":"甲소유 토지에 乙이 무단으로 건물을 신축한 뒤 丙에게 임대하여 丙이 현재 그 건물을 점유하고 있다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)","options":["甲은 丙을 상대로 건물에서의 퇴거를 청구할 수 없다.","甲은 乙을 상대로 건물의 철거 및 토지의 인도를 청구할 수 있다.","甲은 乙을 상대로 토지의 무단 사용을 이유로 부당이득반환청구권을 행사할 수 있다.","만약 乙이 임대하지 않고 스스로 점유하고 있다면, 甲은 乙을 상대로 건물에서의 퇴거를 청구할 수 없다.","만약 丙이 무단으로 건물을 점유하고 있다면, 乙은 丙을 상대로 건물의 인도를 청구할 수 있다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/57","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-57","score":1.0,"pdfChars":323,"mirrorChars":315},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-58":{"id":"2024-58","year":2024,"number":58,"subject":"civil","question":"분묘기지권에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 분묘기지권은 봉분 등 외부에서 분묘의 존재를 인식할 수 있는 형태를 갖추고 등기하여야 성립한다.\nㄴ. 토지소유자의 승낙을 얻어 분묘를 설치함으로써 분묘기지권을 취득한 경우, 설치할 당시 토지소유자와의 합의에 의하여 정한 지료지급의무의 존부나 범위의 효력은 그 토지의 승계인에게는 미치지 않는다.\nㄷ. 자기 소유 토지에 분묘를 설치한 사람이 그 토지를 양도하면서 분묘를 이장하겠다는 특약을 하지 않음으로써 분묘기지권을 취득한 경우, 분묘기지권자는 특별한 사정이 없는 한 분묘기지권이 성립한 때부터 지료를 지급할 의무가 있다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/58","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-58","score":1.0,"pdfChars":381,"mirrorChars":370},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-59":{"id":"2024-59","year":2024,"number":59,"subject":"civil","question":"지역권에 관한 설명으로 틀린 것은?","options":["지역권은 요역지와 분리하여 양도할 수 없다.","지역권은 표현된 것이 아니더라도 시효취득할 수 있다.","요역지의 소유권이 이전되면 다른 약정이 없는 한 지역권도 이전된다.","요역지의 공유자 1인은 그 토지 지분에 관한 지역권을 소멸시킬 수 없다.","공유자의 1인이 지역권을 취득한 때에는 다른 공유자도 지역권을 취득한다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/59","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-59","score":1.0,"pdfChars":205,"mirrorChars":199},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-60":{"id":"2024-60","year":2024,"number":60,"subject":"civil","question":"전세권에 관한 설명으로 틀린 것은?","options":["전세금의 반환은 전세권말소등기에 필요한 서류를 교부하기 전에 이루어져야 한다.","전세권자는 전세권설정자에 대하여 통상의 수선에 필요한 비용의 상환을 청구할 수 없다.","전전세한 목적물에 불가항력으로 인한 손해가 발생한 경우, 그 손해가 전전세하지 않았으면 면할 수 있는 것이었던 때에는 전세권자는 그 책임을 부담한다.","대지와 건물을 소유한 자가 건물에 대해서만 전세권을 설정한 후 대지를 제3자에게 양도한 경우, 제3자는 전세권설정자에 대하여 대지에 대한 지상권을 설정한 것으로 본다.","타인의 토지에 지상권을 설정한 자가 그 위에 건물을 신축하여 그 건물에 전세권을 설정한 경우, 그 건물소유자는 전세권자의 동의 없이 지상권을 소멸하게 하는 행위를 할 수 없다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/60","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-60","score":1.0,"pdfChars":403,"mirrorChars":393},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-61":{"id":"2024-61","year":2024,"number":61,"subject":"civil","question":"민법상 유치권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["권리금반환청구권은 유치권의 피담보채권이 될 수 없다.","유치권의 행사는 피담보채권 소멸시효의 진행에 영향을 미치지 않는다.","공사대금채권에 기하여 유치권을 행사하는 자가 스스로 유치물인 주택에 거주하며 사용하는 것은 특별한 사정이 없는 한 유치물의 보존에 필요한 사용에 해당한다.","유치권에 의한 경매가 목적부동산 위의 부담을 소멸시키는 법정매각조건으로 실시된 경우, 그 경매에서 유치권자는 일반채권자보다 우선하여 배당을 받을 수 있다.","건물신축공사를 도급받은 수급인이 사회통념상 독립한 건물이 되지 못한 정착물을 토지에 설치한 상태에서 공사가 중단된 경우, 수급인은 그 정착물에 대하여 유치권을 행사할 수 없다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/61","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-61","score":1.0,"pdfChars":395,"mirrorChars":385},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-62":{"id":"2024-62","year":2024,"number":62,"subject":"civil","question":"저당물의 경매로 토지와 건물의 소유자가 달라지는 경우에 성립하는 법정지상권에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 토지에 관한 저당권설정 당시 해당 토지에 일시사용을 위한 가설건축물이 존재하였던 경우, 법정지상권은 성립하지 않는다.\nㄴ. 토지에 관한 저당권설정 당시 존재하였던 건물이 무허가건물인 경우, 법정지상권은 성립하지 않는다.\nㄷ. 지상건물이 없는 토지에 저당권을 설정받으면서 저당권자가 신축 개시 전에 건축을 동의한 경우, 법정지상권은 성립하지 않는다.","options":["ㄴ","ㄷ","ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/62","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-62","score":1.0,"pdfChars":316,"mirrorChars":308},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-63":{"id":"2024-63","year":2024,"number":63,"subject":"civil","question":"甲은 2020. 1. 1. 乙에게 1억원을 대여하면서 변제기 2020. 12. 31., 이율 연 5%, 이자는 매달 말일 지급하기로 약정하였고, 그 담보로 당일 乙소유 토지에 저당권을 취득하였다. 乙이 차용일 이후부터 한 번도 이자를 지급하지 않았고, 甲은 2023. 7. 1. 저당권실행을 위한 경매를 신청하였다. 2023. 12. 31. 배당절차에서 배당재원 3억원으로 배당을 실시하게 되었는데, 甲은 총 1억 2,000만원의 채권신고서를 제출하였다. 甲의 배당금액은?(甲보다 우선하는 채권자는 없으나 2억원의 후순위저당권자가 있고, 공휴일 및 소멸시효와 이자에 대한 지연손해금 등은 고려하지 않음)","options":["1억 500만원","1억 1,000만원","1억 1,500만원","1억 1,750만원","1억 2,000만원"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/63","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-63","score":1.0,"pdfChars":406,"mirrorChars":395},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-64":{"id":"2024-64","year":2024,"number":64,"subject":"civil","question":"근저당권에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 채무자가 아닌 제3자도 근저당권을 설정할 수 있다.\nㄴ. 피담보채무 확정 전에는 채무자를 변경할 수 있다.\nㄷ. 근저당권에 의해 담보될 채권최고액에 채무의 이자는 포함되지 않는다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/64","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-64","score":1.0,"pdfChars":182,"mirrorChars":177},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-65":{"id":"2024-65","year":2024,"number":65,"subject":"civil","question":"민법상 계약에 관한 설명으로 옳은 것은?","options":["매매계약은 요물계약이다.","도급계약은 편무계약이다.","교환계약은 무상계약이다.","증여계약은 요식계약이다.","임대차계약은 유상계약이다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/65","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-65","score":1.0,"pdfChars":103,"mirrorChars":98},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-66":{"id":"2024-66","year":2024,"number":66,"subject":"civil","question":"계약의 성립과 내용에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["격지자간의 계약은 승낙의 통지를 발송한 때에 성립한다.","관습에 의하여 승낙의 통지가 필요하지 않는 경우, 계약은 승낙의 의사표시로 인정되는 사실이 있는 때에 성립한다.","당사자간에 동일한 내용의 청약이 상호교차된 경우, 양 청약이 상대방에게 도달한 때에 계약이 성립한다.","승낙자가 청약에 대하여 변경을 가하여 승낙한 때에는 그 청약의 거절과 동시에 새로 청약한 것으로 본다.","선시공·후분양이 되는 아파트의 경우, 준공 전 그 외형·재질에 관하여 분양광고에만 표현된 내용은 특별한 사정이 없는 한 분양계약의 내용이 된다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/66","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-66","score":0.996,"pdfChars":346,"mirrorChars":337},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-67":{"id":"2024-67","year":2024,"number":67,"subject":"civil","question":"계약체결상의 과실책임에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 계약이 의사의 불합치로 성립하지 않는다는 사실을 알지 못하여 손해를 입은 당사자는 계약체결 당시 그 계약이 불성립될 수 있다는 것을 안 상대방에게 계약체결상의 과실책임을 물을 수 있다.\nㄴ. 부동산 수량지정 매매에서 실제면적이 계약면적에 미달하는 경우, 그 부분의 원시적 불능을 이유로 계약체결상의 과실책임을 물을 수 없다.\nㄷ. 계약체결 전에 이미 매매목적물이 전부 멸실된 사실을 알지 못하여 손해를 입은 계약당사자는 계약체결 당시 그 사실을 안 상대방에게 계약체결상의 과실책임을 물을 수 있다.","options":["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[1,2,3,4,5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/67","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-67","score":1.0,"pdfChars":370,"mirrorChars":362},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"all-answers-accepted","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-68":{"id":"2024-68","year":2024,"number":68,"subject":"civil","question":"동시이행의 항변권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["서로 이행이 완료된 쌍무계약이 무효로 된 경우, 당사자 사이의 반환의무는 동시이행관계에 있다.","구분소유적 공유관계가 해소된 경우, 공유지분권자 상호간의 지분이전등기의무는 동시이행관계에 있다.","동시이행의 항변권이 붙어 있는 채권은 특별한 사정이 없는 한 이를 자동채권으로 하여 상계하지 못한다.","양 채무의 변제기가 도래한 쌍무계약에서 수령지체에 빠진 자는 이후 상대방이 자기 채무의 이행제공 없이 이행을 청구하는 경우, 동시이행의 항변권을 행사할 수 있다.","채무를 담보하기 위해 채권자 명의의 소유권이전등기가 된 경우, 피담보채무의 변제의무와 그 소유권이전등기의 말소의무는 동시이행관계에 있다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/68","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-68","score":1.0,"pdfChars":385,"mirrorChars":378},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-69":{"id":"2024-69","year":2024,"number":69,"subject":"civil","question":"甲은 X건물을 乙에게 매도하고 乙로부터 계약금을 지급받았는데, 그 후 甲과 乙의 귀책사유 없이 X건물이 멸실되었다. 다음 설명 중 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 甲은 乙에게 잔대금의 지급을 청구할 수 있다.\nㄴ. 乙은 甲에게 계약금의 반환을 청구할 수 있다.\nㄷ. 만약 乙의 수령지체 중에 甲과 乙의 귀책사유 없이 X건물이 멸실된 경우, 乙은 甲에게 계약금의 반환을 청구할 수 있다.","options":["ㄴ","ㄷ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ"],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/69","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-69","score":1.0,"pdfChars":263,"mirrorChars":257},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-70":{"id":"2024-70","year":2024,"number":70,"subject":"civil","question":"매도인 甲과 매수인 乙사이에 매매대금을 丙에게 지급하기로 하는 제3자를 위한 계약을 체결하였고, 丙이 乙에게 수익의 의사표시를 하였다. 다음 설명 중 옳은 것은?(다툼이 있으면 판례에 따름)","options":["乙의 대금채무 불이행이 있는 경우, 甲은 丙의 동의 없이 乙과의 계약을 해제할 수 없다.","乙의 기망행위로 甲과 乙의 계약이 체결된 경우, 丙은 사기를 이유로 그 계약을 취소할 수 있다.","甲과 丙의 법률관계가 무효인 경우, 특별한 사정이 없는 한 乙은 丙에게 대금지급을 거절할 수 있다.","乙이 매매대금을 丙에게 지급한 후에 甲과 乙의 계약이 취소된 경우, 乙은 丙에게 부당이득반환을 청구할 수 있다.","甲과 乙이 계약을 체결할 때 丙의 권리를 변경시킬 수 있음을 유보한 경우, 甲과 乙은 丙의 권리를 변경시킬 수 있다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/70","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-70","score":1.0,"pdfChars":407,"mirrorChars":400},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-71":{"id":"2024-71","year":2024,"number":71,"subject":"civil","question":"매도인 甲과 매수인 乙사이의 X주택에 관한 계약이 적법하게 해제된 경우, 해제 전에 이해관계를 맺은 자로서 '계약해제로부터 보호되는 제3자'에 해당하지 않는 자는?(다툼이 있으면 판례에 따름)","options":["乙의 소유권이전등기청구권을 압류한 자","乙의 책임재산이 된 X주택을 가압류한 자","乙명의로 소유권이전등기가 된 X주택에 관하여 저당권을 취득한 자","乙과 매매예약에 따라 소유권이전등기청구권보전을 위한 가등기를 마친 자","乙명의로 소유권이전등기가 된 X주택에 관하여 주택임대차보호법상 대항요건을 갖춘 자"],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/71","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-71","score":1.0,"pdfChars":283,"mirrorChars":277},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-72":{"id":"2024-72","year":2024,"number":72,"subject":"civil","question":"乙은 甲소유 X토지를 매수하고 계약금을 지급한 후 X토지를 인도받아 사용·수익하고 있다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)","options":["계약이 채무불이행으로 해제된 경우, 乙은 甲에게 X토지와 그 사용이익을 반환할 의무가 있다.","계약이 채무불이행으로 해제된 경우, 甲은 乙로부터 받은 계약금에 이자를 가산하여 반환할 의무를 진다.","甲이 乙의 중도금 지급채무 불이행을 이유로 계약을 해제한 이후에도 乙은 착오를 이유로 계약을 취소할 수 있다.","만약 甲의 채권자가 X토지를 가압류하면, 乙은 이를 이유로 계약을 즉시 해제할 수 있다.","만약 乙명의로 소유권이전등기가 된 후 계약이 합의해제되면, X토지의 소유권은 甲에게 당연히 복귀한다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/72","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-72","score":1.0,"pdfChars":370,"mirrorChars":363},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-73":{"id":"2024-73","year":2024,"number":73,"subject":"civil","question":"건물소유를 목적으로 하는 토지임차인의 지상물매수청구권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["지상 건물을 타인에게 양도한 임차인도 매수청구권을 행사할 수 있다.","임차인은 저당권이 설정된 건물에 대해서는 매수청구권을 행사할 수 없다.","토지소유자가 아닌 제3자가 토지를 임대한 경우, 임대인은 특별한 사정이 없는 한 매수청구권의 상대방이 될 수 없다.","임대인이 임차권 소멸 당시에 이미 토지소유권을 상실하였더라도 임차인은 그에게 매수청구권을 행사할 수 있다.","기간의 정함이 없는 임대차에서 임대인의 해지통고에 의하여 임차권이 소멸된 경우, 임차인은 매수청구권을 행사할 수 없다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/73","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-73","score":1.0,"pdfChars":344,"mirrorChars":336},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-74":{"id":"2024-74","year":2024,"number":74,"subject":"civil","question":"甲은 자신의 X주택을 보증금 2억원, 월차임 50만원으로 乙에게 임대하였는데, 乙이 전입신고 후 X주택을 점유·사용하면서 차임을 연체하다가 계약이 종료되었다. 계약 종료 전에 X주택의 소유권이 매매를 원인으로 丙에게 이전되었다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)","options":["특별한 사정이 없는 한 丙이 임대인의 지위를 승계한 것으로 본다.","연체차임에 대한 지연손해금의 발생종기는 특별한 사정이 없는 한 X주택이 반환되는 때이다.","丙은 甲의 차임채권을 양수하지 않았다면 X주택을 반환받을 때 보증금에서 이를 공제할 수 없다.","X주택을 반환할 때까지 잔존하는 甲의 차임채권은 압류가 되었더라도 보증금에서 당연히 공제된다.","X주택을 반환하지 않으면, 특별한 사정이 없는 한 乙은 보증금이 있음을 이유로 연체차임의 지급을 거절할 수 없다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/74","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-74","score":1.0,"pdfChars":430,"mirrorChars":420},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-75":{"id":"2024-75","year":2024,"number":75,"subject":"civil","question":"임차인 乙은 임대인 甲에게 2024. 3. 10.로 기간이 만료되는 X주택의 임대차계약에 대해 주택임대차보호법에 따라 갱신요구 통지를 하여 그 통지가 2024. 1. 5. 甲에게 도달하였고, 甲이 갱신거절 통지를 하지 않아 계약이 갱신되었다. 그 후 乙이 갱신된 계약기간이 개시되기 전인 2024. 1. 29. 갱신된 임대차계약의 해지를 통지하여 2024. 1. 30. 甲에게 도달하였다. 임대차계약의 종료일은?(다툼이 있으면 판례에 따름)","options":["2024. 1. 30.","2024. 3. 10.","2024. 4. 30.","2024. 6. 10.","2026. 3. 10."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/75","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-75","score":1.0,"pdfChars":324,"mirrorChars":316},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-76":{"id":"2024-76","year":2024,"number":76,"subject":"civil","question":"집합건물의 소유 및 관리에 관한 법률상 관리인에 관한 설명으로 틀린 것은?","options":["관리인은 구분소유자여야 한다.","관리인은 공용부분의 보존행위를 할 수 있다.","관리인의 임기는 2년의 범위에서 규약으로 정한다.","관리인은 규약에 달리 정한 바가 없으면 관리위원회의 위원이 될 수 없다.","관리인의 대표권은 제한할 수 있지만, 이를 선의의 제3자에게 대항할 수 없다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/76","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-76","score":1.0,"pdfChars":207,"mirrorChars":201},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&g 3/budongsan/24","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-24","score":1.0,"pdfChars":289,"mirrorChars":279},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-25":{"id":"2023-25","year":2023,"number":25,"subject":"estate","question":"甲은 아래 조건으로 부동산에 10억원을 투자하였다. 이에 관한 투자분석의 산출값으로 틀린 것은?(단, 주어진 조건에 한함)\n\n○ 순영업소득(NOI): 2억원/년\n○ 원리금상환액: 2,000만원/년\n○ 유효총소득승수: 4\n○ 지분투자액: 8억원","options":["유효총소득은 2억5천만원","부채비율은 25%","지분환원율은 25%","순소득승수는 5","종합환원율은 20%"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/budongsan/25","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-25","score":1.0,"pdfChars":200,"mirrorChars":195},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-26":{"id":"2023-26","year":2023,"number":26,"subject":"estate","question":"부동산투자분석에 관한 설명으로 틀린 것은?","options":["내부수익률은 수익성지수를 0으로, 순현재가치를 1로 만드는 할인율이다.","회계적 이익률법은 현금흐름의 시간적 가치를 고려하지 않는다.","내부수익률법에서는 내부수익률과 요구수익률을 비교하여 투자여부를 결정한다.","순현재가치법, 내부수익률법은 할인현금수지분석법에 해당한다.","담보인정비율(LTV)은 부동산가치에 대한 융자액의 비율이다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/budongsan/26","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-26","score":1.0,"pdfChars":217,"mirrorChars":210},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-27":{"id":"2023-27","year":2023,"number":27,"subject":"estate","question":"PF(Project Financing)대출을 유동화하는 자산유동화증권(ABS)과 자산담보부 기업어음(ABCP)에 관한 설명으로 옳은 것은?","options":["ABS는 유치권의 방법으로, ABCP는 근저당의 방법으로 사업부지를 피담보채무의 담보로 확보하여야 한다.","ABS는 금융위원회에 등록한 이전 회차의 유동화계획을 따를 경우, 금융위원회에 등록 없이 금번 회차에도 동일하게 재발행할 수 있다.","ABS는 유동화 도관체(conduit)가 개발업체에 직접 PF대출을 제공한 후 해당 대출채권을 유동화할 수 있다.","공사대금 재원이 필요한 경우, 시행사는 공사대금채권을 담보로 ABCP를 발행하고 이를 통해 조달한 재원을 시공사에 지급한다.","채권형 ABS와 ABCP에서 수령하는 이자에 대하여 모든 개인투자자는 소득세 납부의무를 가진다."],"correct":[1,2,3,4,5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/budongsan/27","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-27","score":1.0,"pdfChars":414,"mirrorChars":403},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"all-answers-accepted","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-28":{"id":"2023-28","year":2023,"number":28,"subject":"estate","question":"A회사는 전년도에 임대면적 750m²의 매장을 비율임대차(percentage lease)방식으로 임차하였다. 계약내용에 따르면, 매출액이 손익분기점 매출액 이하이면 기본임대료만 지급하고, 이를 초과하는 매출액에 대해서는 일정 임대료율을 적용한 추가임대료를 기본임대료에 가산하도록 하였다. 전년도 연임대료로 총 12,000만원을 지급한 경우, 해당 계약내용에 따른 추가임대료율은?(단, 연간 기준이며, 주어진 조건에 한함)\n\n○ 전년도 매출액: 임대면적 m²당 100만원\n○ 손익분기점 매출액: 임대면적 m²당 60만원\n○ 기본임대료: 임대면적 m²당 10만원","options":["15%","20%","25%","30%","35%"],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/budongsan/28","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-28","score":1.0,"pdfChars":351,"mirrorChars":337},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-29":{"id":"2023-29","year":2023,"number":29,"subject":"estate","question":"부동산투자회사법상 '자기관리 부동산투자회사'(REITs, 이하 \"회사\"라 한다)에 관한 설명으로 틀린 것은?","options":["국토교통부장관은 회사가 최저자본금을 준비하였음을 확인한 때에는 지체 없이 주요 출자자(발행주식 총수의 100분의 5를 초과하여 주식을 소유하는 자)의 적격성을 심사하여야 한다.","최저자본금준비기간이 지난 회사의 최저자본금은 70억원 이상이 되어야 한다.","주요 주주는 미공개 자산운용정보를 이용하여 부동산을 매매하거나 타인에게 이용하게 하여서는 아니 된다.","회사는 그 자산을 투자·운용할 때에는 전문성을 높이고 주주를 보호하기 위하여 자산관리회사에 위탁하여야 한다.","주주총회의 특별결의에 따른 경우, 회사는 해당 연도 이익배당한도의 100분의 50 이상 100분의 90 미만으로 이익배당을 정한다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/budongsan/29","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-29","score":0.9984,"pdfChars":405,"mirrorChars":398},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-30":{"id":"2023-30","year":2023,"number":30,"subject":"estate","question":"저당담보부증권(MBS)의 가격변동에 관한 설명으로 옳은 것은?(단, 주어진 조건에 한함)","options":["투자자들이 가까운 시일에 채권시장 수익률의 하락을 예상한다면, 가중평균상환기간(duration)이 긴 저당담보부증권일수록 그 가격이 더 크게 하락한다.","채무불이행위험이 없는 저당담보부증권의 가격은 채권시장 수익률의 변동에 영향을 받지 않는다.","자본시장 내 다른 투자수단들과 경쟁하므로, 동일위험 수준의 다른 투자수단들의 수익률이 상승하면 저당담보부증권의 가격은 상승한다.","채권시장 수익률이 상승할 때 가중평균상환기간이 긴 저당담보부증권일수록 그 가격의 변동 정도가 작다.","고정이자를 지급하는 저당담보부증권은 채권시장 수익률이 상승하면 그 가격이 하락한다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/budongsan/30","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-30","score":1.0,"pdfChars":374,"mirrorChars":365},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-31":{"id":"2023-31","year":2023,"number":31,"subject":"estate","question":"부동산투자의 분석기법 및 위험에 관한 설명으로 옳은 것을 모두 고른 것은?(단, 주어진 조건에 한함)\n\nㄱ. 경기침체로 부동산 수익성 악화가 야기하는 위험은 사업위험(business risk)에 해당한다.\nㄴ. 공실률, 부채서비스액은 유효총소득을 산정하는데 필요한 항목이다.\nㄷ. 위험회피형 투자자의 최적 포트폴리오는 투자자의 무차별곡선과 효율적 프론티어의 접점에서 선택된다.\nㄹ. 포트폴리오를 통해 제거 가능한 체계적인 위험은 부동산의 개별성에 기인한다.\nㅁ. 민감도분석을 통해 투입요소의 변화가 그 투자안의 내부수익률에 미치는 영향을 분석할 수 있다.","options":["ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㅁ","ㄱ, ㄹ, ㅁ","ㄴ, ㄷ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/budongsan/31","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-31","score":1.0,"pdfChars":374,"mirrorChars":364},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-32":{"id":"2023-32","year":2023,"number":32,"subject":"estate","question":"부동산관리방식에 따른 해당 내용을 옳게 묶은 것은?\n\nㄱ. 소유자의 직접적인 통제권이 강화된다.\nㄴ. 관리의 전문성과 효율성을 높일 수 있다.\nㄷ. 기밀 및 보안 유지가 유리하다.\nㄹ. 건물설비의 고도화에 대응할 수 있다.\nㅁ. 대형건물의 관리에 더 유용하다.\nㅂ. 소유와 경영의 분리가 가능하다.","options":["자기관리방식 - ㄱ, ㄴ, ㄷ, ㄹ","자기관리방식 - ㄱ, ㄷ, ㅁ, ㅂ","자기관리방식 - ㄴ, ㄷ, ㄹ, ㅂ","위탁관리방식 - ㄱ, ㄷ, ㄹ, ㅁ","위탁관리방식 - ㄴ, ㄹ, ㅁ, ㅂ"],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/budongsan/32","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-32","score":1.0,"pdfChars":275,"mirrorChars":271},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-33":{"id":"2023-33","year":2023,"number":33,"subject":"estate","question":"부동산마케팅에 관한 설명으로 틀린 것은?","options":["부동산마케팅은 부동산상품을 수요자의 욕구에 맞게 상품을 개발하고 가격을 결정한 후 시장에서 유통, 촉진, 판매를 관리하는 일련의 과정이다.","STP전략은 대상 집단의 시장세분화(segmentation), 표적시장 선정(targeting), 포지셔닝(positioning)으로 구성된다.","시장세분화 전략은 부동산시장에서 마케팅활동을 수행하기 위하여 수요자의 집단을 세분하는 것이다.","표적시장 전략은 세분화된 시장을 통해 선정된 표적 집단을 대상으로 적합한 마케팅활동을 수행하는 것이다.","AIDA원리는 주의(attention), 관심(interest), 욕망(desire), 행동(action)의 단계를 통해 공급자의 욕구를 파악하여 마케팅 효과를 극대화하는 시장점유마케팅 전략의 하나이다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/budongsan/33","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-33","score":1.0,"pdfChars":422,"mirrorChars":411},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-34":{"id":"2023-34","year":2023,"number":34,"subject":"estate","question":"사회기반시설에 대한 민간투자법령상 BOT(build-operate-transfer) 방식에 대한 내용이다. (   )에 들어갈 내용을 <보기>에서 옳게 고른 것은?\n\n사회기반시설의 ( ㄱ )에 일정기간 동안 ( ㄴ )에게 해당 시설의 소유권이 인정되며 그 기간이 만료되면 ( ㄷ )이 ( ㄹ )에 귀속되는 방식이다.\n\n<보기>\na. 착공 후\nb. 준공 후\nc. 사업시행자\nd. 국가 또는 지방자치단체\ne. 시설소유권\nf. 시설관리운영권","options":["ㄱ - a, ㄴ - c, ㄷ - e, ㄹ - d","ㄱ - a, ㄴ - c, ㄷ - e, ㄹ - c","ㄱ - a, ㄴ - d, ㄷ - f, ㄹ - c","ㄱ - b, ㄴ - c, ㄷ - e, ㄹ - d","ㄱ - b, ㄴ - d, ㄷ - f, ㄹ - c"],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/budongsan/34","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-34","score":1.0,"pdfChars":348,"mirrorChars":383},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-35":{"id":"2023-35","year":2023,"number":35,"subject":"estate","question":"다음 자료를 활용하여 공시지가기준법으로 산정한 대상토지의 단위면적당 시산가액은?(단, 주어진 조건에 한함)\n\n○ 대상토지 현황: A시 B구 C동 120번지, 일반상업지역, 상업용\n○ 기준시점: 2023.10.28.\n○ 표준지공시지가(A시 B구 C동, 2023.01.01.기준)\n  - 기호 1: 소재지 C동 110, 용도지역 준주거지역, 이용상황 상업용, 공시지가 6,000,000원/m²\n  - 기호 2: 소재지 C동 130, 용도지역 일반상업지역, 이용상황 상업용, 공시지가 8,000,000원/m²\n○ 지가변동률(A시 B구, 2023.01.01.~2023.10.28.)\n  - 주거지역: 3% 상승\n  - 상업지역: 5% 상승\n○ 지역요인: 표준지와 대상토지는 인근지역에 위치하여 지역요인 동일함\n○ 개별요인: 대상토지는 표준지 기호 1에 비해 개별요인 10% 우세하고, 표준지 기호 2에 비해 개별요인 3% 열세함\n○ 그 밖의 요인 보정: 대상토지 인근지역의 가치형성요인이 유사한 정상적인 거래사례 및 평가사례 등을 고려하여 그 밖의 요인으로 50% 증액 보정함\n○ 상승식으로 계산할 것","options":["6,798,000원/m²","8,148,000원/m²","10,197,000원/m²","12,222,000원/m²","13,860,000원/m²"],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/budongsan/35","paperUrl":"https://gosi24.com/  하나 또는 둘 이상의 표준지의 공시지가를 기준으로 토지가격비준표를 사용하여 지가를 산정하되, 해당 토지의 가격과 표준지공시지가가 균형을 유지하도록 하여야 한다.","표준지로 선정된 토지에 대하여는 개별공시지가를 결정·공시하지 아니할 수 있다. 이 경우 표준지로 선정된 토지에 대하여는 해당 토지의 표준지공시지가를 개별공시지가로 본다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/budongsan/39","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-39","score":0.9941,"pdfChars":558,"mirrorChars":542},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-40":{"id":"2023-40","year":2023,"number":40,"subject":"estate","question":"감정평가 과정상 지역분석 및 개별분석에 관한 설명으로 옳은 것은?","options":["동일수급권(同一需給圈)이란 대상부동산과 대체·경쟁 관계가 성립하고 가치 형성에 서로 영향을 미치는 관계에 있는 다른 부동산이 존재하는 권역(圈域)을 말하며, 인근지역과 유사지역을 포함한다.","지역분석이란 대상부동산이 속해 있는 지역의 지역요인을 분석하여 대상부동산의 최유효이용을 판정하는 것을 말한다.","인근지역이란 대상부동산이 속한 지역으로서 부동산의 이용이 동질적이고 가치형성요인 중 개별요인을 공유하는 지역을 말한다.","개별분석이란 대상부동산의 개별적 요인을 분석하여 해당 지역 내 부동산의 표준적 이용과 가격수준을 판정하는 것을 말한다.","지역분석보다 개별분석을 먼저 실시하는 것이 일반적이다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/budongsan/40","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-40","score":0.9568,"pdfChars":422,"mirrorChars":374},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-41":{"id":"2023-41","year":2023,"number":41,"subject":"civil","question":"다음 중 연결이 잘못된 것은?(다툼이 있으면 판례에 따름)","options":["임차인의 필요비상환청구권 - 형성권","지명채권의 양도 - 준물권행위","부동산 매매에 의한 소유권 취득 - 특정승계","부동산 점유취득시효완성으로 인한 소유권 취득 - 원시취득","무권대리에서 추인 여부에 대한 확답의 최고 - 의사의 통지"],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/41","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-41","score":1.0,"pdfChars":169,"mirrorChars":164},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-42":{"id":"2023-42","year":2023,"number":42,"subject":"civil","question":"甲으로부터 甲 소유 X토지의 매도 대리권을 수여받은 乙은 甲을 대리하여 丙과 X토지에 대한 매매계약을 체결하였다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)","options":["乙은 특별한 사정이 없는 한 매매잔금의 수령 권한을 가진다.","丙의 채무불이행이 있는 경우, 특별한 사정이 없는 한 乙은 매매계약을 해제할 수 없다.","매매계약의 해제로 인한 원상회복의무는 甲과 丙이 부담한다.","丙이 매매계약을 해제한 경우, 丙은 乙에게 채무불이행으로 인한 손해배상을 청구할 수 없다.","乙이 자기의 이익을 위하여 배임적 대리행위를 하였고 丙도 이를 안 경우, 乙의 대리행위는 甲에게 효력을 미친다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/42","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-42","score":1.0,"pdfChars":340,"mirrorChars":329},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-43":{"id":"2023-43","year":2023,"number":43,"subject":"civil","question":"불공정한 법률행위에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["불공정한 법률행위에도 무효행위의 전환에 관한 법리가 적용될 수 있다.","경락대금과 목적물의 시가에 현저한 차이가 있는 경우에도 불공정한 법률행위가 성립할 수 있다.","급부와 반대급부 사이에 현저한 불균형이 있는 경우, 원칙적으로 그 불균형 부분에 한하여 무효가 된다.","대리인에 의한 법률행위에서 궁박과 무경험은 대리인을 기준으로 판단한다.","계약의 피해당사자가 급박한 곤궁 상태에 있었다면 그 상대방에게 폭리행위의 악의가 없었더라도 불공정한 법률행위는 성립한다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/43","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-43","score":1.0,"pdfChars":310,"mirrorChars":302},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-44":{"id":"2023-44","year":2023,"number":44,"subject":"civil","question":"복대리에 관한 설명으로 틀린 것은?(특별한 사정은 없으며, 다툼이 있으면 판례에 따름)","options":["복대리인은 행위능력자임을 요하지 않는다.","복대리인은 본인에 대하여 대리인과 동일한 권리의무가 있다.","법정대리인은 그 책임으로 복대리인을 선임할 수 있다.","대리인의 능력에 따라 사업의 성공여부가 결정되는 사무에 대해 대리권을 수여받은 자는 본인의 묵시적 승낙으로도 복대리인을 선임할 수 있다.","대리인이 대리권 소멸 후 선임한 복대리인과 상대방 사이의 법률행위에도 민법 제129조의 표현대리가 성립할 수 있다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/44","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-44","score":1.0,"pdfChars":289,"mirrorChars":281},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-45":{"id":"2023-45","year":2023,"number":45,"subject":"civil","question":"통정허위표시를 기초로 새로운 법률상 이해관계를 맺은 제3자에 해당하는 자를 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 파산선고를 받은 가장채권자의 파산관재인\nㄴ. 가장채무를 보증하고 그 보증채무를 이행하여 구상권을 취득한 보증인\nㄷ. 차주와 통정하여 가장소비대차계약을 체결한 금융기관으로부터 그 계약을 인수한 자","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/45","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-45","score":1.0,"pdfChars":212,"mirrorChars":207},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-46":{"id":"2023-46","year":2023,"number":46,"subject":"civil","question":"무권대리인 乙이 甲을 대리하여 甲 소유의 X토지를 丙에게 매도하는 계약을 체결하였다. 다음 설명 중 옳은 것은?(다툼이 있으면 판례에 따름)","options":["위 매매계약이 체결된 후에 甲이 X토지를 丁에게 매도하고 소유권이전등기를 마쳤다면, 甲이 乙의 대리행위를 추인하더라도 丁은 유효하게 그 소유권을 취득한다.","乙이 甲을 단독상속한 경우, 특별한 사정이 없는 한 乙은 본인의 지위에서 추인을 거절할 수 있다.","甲의 단독상속인 戊는 丙에 대해 위 매매계약을 추인할 수 없다.","丙은 乙과 매매계약을 체결할 당시 乙에게 대리권이 없음을 안 경우에도 甲의 추인이 있을 때까지 그 매매계약을 철회할 수 있다.","甲이 乙의 대리행위에 대하여 추인을 거절하면, 乙이 미성년자라도 丙은 乙에 대해 손해배상을 청구할 수 있다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/46","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-46","score":1.0,"pdfChars":404,"mirrorChars":393},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-47":{"id":"2023-47","year":2023,"number":47,"subject":"civil","question":"반사회질서의 법률행위에 해당하지 않는 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 2023년 체결된 형사사건에 관한 성공보수약정\nㄴ. 반사회적 행위에 의해 조성된 비자금을 소극적으로 은닉하기 위해 체결한 임치약정\nㄷ. 산모가 우연한 사고로 인한 태아의 상해에 대비하기 위해 자신을 보험수익자로, 태아를 피보험자로 하여 체결한 상해보험계약","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/47","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-47","score":1.0,"pdfChars":230,"mirrorChars":223},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-48":{"id":"2023-48","year":2023,"number":48,"subject":"civil","question":"甲은 허가받을 것을 전제로 토지거래허가구역 내 자신의 토지에 대해 乙과 매매계약을 체결하였다. 다음 설명 중 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 甲은 특별한 사정이 없는 한 乙의 매매대금 이행제공이 있을 때까지 허가신청절차 협력의무의 이행을 거절할 수 있다.\nㄴ. 乙이 계약금 전액을 지급한 후, 당사자의 일방이 이행에 착수하기 전이라면 특별한 사정이 없는 한 甲은 계약금의 배액을 상환하고 계약을 해제할 수 있다.\nㄷ. 일정기간 내 허가를 받기로 약정한 경우, 특별한 사정이 없는 한 그 허가를 받지 못하고 약정기간이 경과하였다는 사정만으로도 매매계약은 확정적 무효가 된다.","options":["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/48","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-48","score":1.0,"pdfChars":376,"mirrorChars":365},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-49":{"id":"2023-49","year":2023,"number":49,"subject":"civil","question":"법률행위의 부관에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["조건이 선량한 풍속 기타 사회질서에 위반한 경우, 그 조건만 무효이고 법률행위는 유효하다.","법률행위에 조건이 붙어 있는지 여부는 조건의 존재를 주장하는 자에게 증명책임이 있다.","기한은 특별한 사정이 없는 한 채무자의 이익을 위한 것으로 추정한다.","조건부 법률행위에서 기성조건이 해제조건이면 그 법률행위는 무효이다.","종기(終期) 있는 법률행위는 기한이 도래한 때로부터 그 효력을 잃는다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/49","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-49","score":1.0,"pdfChars":268,"mirrorChars":261},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-50":{"id":"2023-50","year":2023,"number":50,"subject":"civil","question":"법률행위의 무효와 추인에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 무효인 법률행위의 추인은 무효원인이 소멸된 후 본인이 무효임을 알고 추인해야 그 효력이 인정된다.\nㄴ. 무권리자의 처분이 계약으로 이루어진 경우, 권리자가 추인하면 원칙적으로 계약의 효과는 계약체결시에 소급하여 권리자에게 귀속된다.\nㄷ. 양도금지특약에 위반하여 무효인 채권양도에 대해 양도대상이 된 채권의 채무자가 승낙하면 다른 약정이 없는 한 양도의 효과는 승낙시부터 발생한다.","options":["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/50","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-50","score":1.0,"pdfChars":303,"mirrorChars":297},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-51":{"id":"2023-51","year":2023,"number":51,"subject":"civil","question":"점유자와 회복자의 관계에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["점유물이 점유자의 책임 있는 사유로 멸실된 경우, 선의의 타주점유자는 이익이 현존하는 한도에서 배상해야 한다.","악의의 점유자는 특별한 사정이 없는 한 통상의 필요비를 청구할 수 있다.","점유자의 필요비상환청구에 대해 법원은 회복자의 청구에 의해 상당한 상환기간을 허여할 수 있다.","이행지체로 인해 매매계약이 해제된 경우, 선의의 점유자인 매수인에게 과실취득권이 인정된다.","은비(隱秘)에 의한 점유자는 점유물의 과실을 취득한다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/51","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-51","score":1.0,"pdfChars":296,"mirrorChars":287},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-52":{"id":"2023-52","year":2023,"number":52,"subject":"civil","question":"민법상 합유에 관한 설명으로 틀린 것은?(특약은 없으며, 다툼이 있으면 판례에 따름)","options":["합유자의 권리는 합유물 전부에 미친다.","합유자는 합유물의 분할을 청구하지 못한다.","합유자 중 1인이 사망하면 그의 상속인이 합유자의 지위를 승계한다.","합유물의 보존행위는 합유자 각자가 할 수 있다.","합유자는 그 전원의 동의 없이 합유지분을 처분하지 못한다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/52","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-52","score":1.0,"pdfChars":204,"mirrorChars":196},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-53":{"id":"2023-53","year":2023,"number":53,"subject":"civil","question":"부동산 소유권이전등기청구권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["교환으로 인한 이전등기청구권은 물권적 청구권이다.","점유취득시효 완성으로 인한 이전등기청구권의 양도는 특별한 사정이 없는 한 양도인의 채무자에 대한 통지만으로는 대항력이 생기지 않는다.","매수인이 부동산을 인도받아 사용·수익하고 있는 이상 매수인의 이전등기청구권은 시효로 소멸하지 않는다.","점유취득시효 완성으로 인한 이전등기청구권은 점유가 계속되더라도 시효로 소멸한다.","매매로 인한 이전등기청구권의 양도는 특별한 사정이 없는 한 양도인의 채무자에 대한 통지만으로 대항력이 생긴다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/53","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-53","score":1.0,"pdfChars":324,"mirrorChars":318},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-54":{"id":"2023-54","year":2023,"number":54,"subject":"civil","question":"물권적 청구권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["저당권자는 목적물에서 임의로 분리, 반출된 물건을 자신에게 반환할 것을 청구할 수 있다.","진정명의회복을 원인으로 한 소유권이전등기청구권의 법적 성질은 소유권에 기한 방해배제청구권이다.","소유자는 소유권을 방해하는 자에 대해 민법 제214조에 기해 방해배제비용을 청구할 수 없다.","미등기 무허가건물의 양수인은 소유권에 기한 방해배제청구권을 행사할 수 없다.","소유권에 기한 방해배제청구권은 현재 계속되고 있는 방해원인의 제거를 내용으로 한다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/54","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-54","score":1.0,"pdfChars":296,"mirrorChars":289},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-55":{"id":"2023-55","year":2023,"number":55,"subject":"civil","question":"부동산 점유취득시효에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["국유재산 중 일반재산이 시효완성 후 행정재산으로 되더라도 시효완성을 원인으로 한 소유권이전등기를 청구할 수 있다.","시효완성 당시의 소유권보존등기가 무효라면 그 등기명의인은 원칙적으로 시효완성을 원인으로 한 소유권이전등기청구의 상대방이 될 수 없다.","시효완성 후 점유자 명의로 소유권이전등기가 경료되기 전에 부동산 소유명의자는 점유자에 대해 점유로 인한 부당이득반환청구를 할 수 있다.","미등기부동산에 대한 시효가 완성된 경우, 점유자는 등기 없이도 소유권을 취득한다.","시효완성 전에 부동산이 압류되면 시효는 중단된다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/55","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-55","score":1.0,"pdfChars":347,"mirrorChars":336},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-56":{"id":"2023-56","year":2023,"number":56,"subject":"civil","question":"민법 제187조(등기를 요하지 아니하는 부동산물권취득)에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["상속인은 상속 부동산의 소유권을 등기 없이 취득한다.","민법 제187조 소정의 판결은 형성판결을 의미한다.","부동산 강제경매에서 매수인이 매각 목적인 권리를 취득하는 시기는 매각대금 완납시이다.","부동산소유권이전을 내용으로 하는 화해조서에 기한 소유권취득에는 등기를 요하지 않는다.","신축에 의한 건물소유권취득에는 소유권보존등기를 요하지 않는다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/56","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-56","score":1.0,"pdfChars":267,"mirrorChars":257},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-57":{"id":"2023-57","year":2023,"number":57,"subject":"civil","question":"물권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["물건 이외의 재산권은 물권의 객체가 될 수 없다.","물권은 「부동산등기규칙」에 의해 창설될 수 있다.","구분소유의 목적이 되는 건물의 등기부상 표시에서 전유부분의 면적 표시가 잘못된 경우, 그 잘못 표시된 면적만큼의 소유권보존등기를 말소할 수 없다.","1필의 토지의 일부를 객체로 하여 지상권을 설정할 수 없다.","기술적인 착오로 지적도의 경계선이 실제 경계선과 다르게 작성된 경우, 토지의 경계는 지적도의 경계선에 의해 확정된다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/57","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-57","score":1.0,"pdfChars":285,"mirrorChars":277},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-58":{"id":"2023-58","year":2023,"number":58,"subject":"civil","question":"전세권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["전세권설정자의 목적물 인도는 전세권의 성립요건이다.","타인의 토지에 있는 건물에 전세권을 설정한 경우, 전세권의 효력은 그 건물의 소유를 목적으로 한 지상권에 미친다.","전세권의 사용·수익 권능을 배제하고 채권담보만을 위해 전세권을 설정하는 것은 허용된다.","전세권설정자는 특별한 사정이 없는 한 목적물의 현상을 유지하고 그 통상의 관리에 속한 수선을 해야 한다.","건물전세권이 법정갱신된 경우, 전세권자는 이를 등기해야 제3자에게 대항할 수 있다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/58","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-58","score":1.0,"pdfChars":297,"mirrorChars":288},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-59":{"id":"2023-59","year":2023,"number":59,"subject":"civil","question":"乙은 甲과의 지상권설정계약으로 甲 소유의 X토지에 지상권을 취득한 후, 그 지상에 Y건물을 완성하여 소유권을 취득하였다. 다음 설명 중 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 乙은 지상권을 유보한 채 Y건물 소유권만을 제3자에게 양도할 수 있다.\nㄴ. 乙은 Y건물 소유권을 유보한 채 지상권만을 제3자에게 양도할 수 있다.\nㄷ. 지료지급약정이 있음에도 乙이 3년분의 지료를 미지급한 경우, 甲은 지상권 소멸을 청구할 수 있다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/59","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-59","score":1.0,"pdfChars":285,"mirrorChars":279},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-60":{"id":"2023-60","year":2023,"number":60,"subject":"civil","question":"지역권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["지역권은 요역지와 분리하여 양도할 수 없다.","공유자 중 1인이 지역권을 취득한 때에는 다른 공유자도 이를 취득한다.","통행지역권을 주장하는 자는 통행으로 편익을 얻는 요역지가 있음을 주장·증명해야 한다.","요역지의 불법점유자도 통행지역권을 시효취득할 수 있다.","지역권은 계속되고 표현된 것에 한하여 시효취득할 수 있다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/60","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-60","score":1.0,"pdfChars":224,"mirrorChars":217},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-61":{"id":"2023-61","year":2023,"number":61,"subject":"civil","question":"甲은 乙에게 1억원을 대여하면서 乙 소유의 Y건물에 저당권을 취득하였다. 다음 설명 중 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 乙이 甲에게 피담보채권 전부를 변제한 경우, 甲의 저당권은 말소등기를 하지 않아도 소멸한다.\nㄴ. 甲은 Y건물의 소실로 인하여 乙이 취득한 화재보험금청구권에 대하여 물상대위권을 행사할 수 있다.\nㄷ. 甲은 저당권을 피담보채권과 분리하여 제3자에게 양도하지 못한다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/61","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-61","score":1.0,"pdfChars":267,"mirrorChars":259},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-62":{"id":"2023-62","year":2023,"number":62,"subject":"civil","question":"근저당권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["채권최고액에는 피담보채무의 이자가 산입된다.","피담보채무 확정 전에는 채무자를 변경할 수 있다.","근저당권자가 피담보채무의 불이행을 이유로 경매신청을 한 경우, 특별한 사정이 없는 한 피담보채무액은 그 신청시에 확정된다.","물상보증인은 채권최고액을 초과하는 부분의 채권액까지 변제할 의무를 부담한다.","특별한 사정이 없는 한, 존속기간이 있는 근저당권은 그 기간이 만료한 때 피담보채무가 확정된다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/62","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-62","score":1.0,"pdfChars":268,"mirrorChars":260},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-63":{"id":"2023-63","year":2023,"number":63,"subject":"civil","question":"민법상 유치권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["유치권자는 유치물에 대한 경매권이 있다.","유치권 발생을 배제하는 특약은 무효이다.","건물신축공사를 도급받은 수급인이 사회통념상 독립한 건물이 되지 못한 정착물을 토지에 설치한 상태에서 공사가 중단된 경우, 그 토지에 대해 유치권을 행사할 수 없다.","유치권은 피담보채권의 변제기가 도래하지 않으면 성립할 수 없다.","유치권자는 선량한 관리자의 주의로 유치물을 점유해야 한다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/63","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-63","score":1.0,"pdfChars":258,"mirrorChars":251},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-64":{"id":"2023-64","year":2023,"number":64,"subject":"civil","question":"저당권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["전세권은 저당권의 객체가 될 수 없다.","저당권 설정은 권리의 이전적 승계에 해당한다.","민법 제365조에 따라 토지와 건물의 일괄경매를 청구한 토지 저당권자는 그 건물의 경매대가에서 우선변제를 받을 수 있다.","건물 건축 개시 전의 나대지에 저당권이 설정될 당시 저당권자가 그 토지 소유자의 건물 건축에 동의한 경우, 저당토지의 임의경매로 인한 법정지상권은 성립하지 않는다.","저당물의 소유권을 취득한 제3자는 그 저당물의 보존을 위해 필요비를 지출하더라도 특별한 사정이 없는 한 그 저당물의 경매대가에서 우선상환을 받을 수 없다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/64","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-64","score":1.0,"pdfChars":342,"mirrorChars":335},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-65":{"id":"2023-65","year":2023,"number":65,"subject":"civil","question":"민법상 환매에 관한 설명으로 틀린 것은?","options":["환매권은 양도할 수 없는 일신전속권이다.","매매계약이 무효이면 환매특약도 무효이다.","환매기간을 정한 경우에는 그 기간을 다시 연장하지 못한다.","환매특약등기는 매수인의 권리취득의 등기에 부기하는 방식으로 한다.","환매특약은 매매계약과 동시에 해야 한다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/65","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-65","score":1.0,"pdfChars":171,"mirrorChars":166},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-66":{"id":"2023-66","year":2023,"number":66,"subject":"civil","question":"甲은 그 소유의 토지를 乙에게 매도하면서 甲의 丙에 대한 채무변제를 위해 乙이 그 대금 전액을 丙에게 지급하기로 하는 제3자를 위한 계약을 乙과 체결하였고, 丙도 乙에 대해 수익의 의사표시를 하였다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)","options":["乙은 甲과 丙 사이의 채무부존재의 항변으로 丙에게 대항할 수 없다.","丙은 乙의 채무불이행을 이유로 甲과 乙 사이의 계약을 해제할 수 없다.","乙이 甲의 채무불이행을 이유로 계약을 해제한 경우, 특별한 사정이 없는 한 乙은 이미 이행한 급부의 반환을 丙에게 청구할 수 있다.","甲이 乙의 채무불이행을 이유로 계약을 해제하면, 丙은 乙에게 채무불이행으로 인해 자신이 입은 손해의 배상을 청구할 수 있다.","甲은 丙의 동의 없이도 乙의 채무불이행을 이유로 계약을 해제할 수 있다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/66","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-66","score":1.0,"pdfChars":420,"mirrorChars":410},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-67":{"id":"2023-67","year":2023,"number":67,"subject":"civil","question":"甲과 乙은 甲 소유의 X토지에 대하여 매매계약을 체결하였으나 그 후 甲의 채무인 소유권이전등기의무의 이행이 불가능하게 되었다. 다음 설명 중 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 甲의 채무가 쌍방의 귀책사유 없이 불능이 된 경우, 이미 대금을 지급한 乙은 그 대금을 부당이득법리에 따라 반환청구할 수 있다.\nㄴ. 甲의 채무가 乙의 귀책사유로 불능이 된 경우, 특별한 사정이 없는 한 甲은 乙에게 대금지급을 청구할 수 있다.\nㄷ. 乙의 수령지체 중에 쌍방의 귀책사유 없이 甲의 채무가 불능이 된 경우, 甲은 乙에게 대금지급을 청구할 수 없다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/67","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-67","score":1.0,"pdfChars":355,"mirrorChars":344},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-68":{"id":"2023-68","year":2023,"number":68,"subject":"civil","question":"매매에서 과실의 귀속과 대금의 이자 등에 관한 설명으로 옳은 것을 모두 고른 것은?(대금지급과 목적물인도는 동시이행관계에 있고, 다툼이 있으면 판례에 따름)\n\nㄱ. 매매계약 후 목적물이 인도되지 않더라도 매수인이 대금을 완제한 때에는 그 시점 이후 목적물로부터 생긴 과실은 매수인에게 귀속된다.\nㄴ. 매수인이 대금지급을 거절할 정당한 사유가 있는 경우, 매수인은 목적물을 미리 인도받더라도 대금 이자의 지급의무가 없다.\nㄷ. 매매계약이 취소된 경우, 선의의 점유자인 매수인의 과실취득권이 인정되는 이상 선의의 매도인도 지급받은 대금의 운용이익 내지 법정이자를 반환할 의무가 없다.","options":["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/68","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-68","score":1.0,"pdfChars":363,"mirrorChars":351},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-69":{"id":"2023-69","year":2023,"number":69,"subject":"civil","question":"매매의 일방예약에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["일방예약이 성립하려면 본계약인 매매계약의 요소가 되는 내용이 확정되어 있거나 확정할 수 있어야 한다.","예약완결권의 행사기간 도과 전에 예약완결권자가 예약 목적물인 부동산을 인도받은 경우, 그 기간이 도과되더라도 예약완결권은 소멸되지 않는다.","예약완결권은 당사자 사이에 행사기간을 약정한 때에는 그 기간 내에 행사해야 한다.","상가에 관하여 매매예약이 성립한 이후 법령상의 제한에 의해 일시적으로 분양이 금지되었다가 다시 허용된 경우, 그 예약완결권 행사는 이행불능이라 할 수 없다.","예약완결권 행사의 의사표시를 담은 소장 부본의 송달로써 예약완결권을 재판상 행사하는 경우, 그 행사가 유효하기 위해서는 그 소장 부본이 제척기간 내에 상대방에게 송달되어야 한다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/69","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-69","score":1.0,"pdfChars":425,"mirrorChars":414},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-70":{"id":"2023-70","year":2023,"number":70,"subject":"civil","question":"민법상 매매계약에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["매매계약은 낙성·불요식계약이다.","타인의 권리도 매매의 목적이 될 수 있다.","매도인의 담보책임 규정은 그 성질이 허용되는 한 교환계약에도 준용된다.","매매계약에 관한 비용은 특약이 없는 한 매수인이 전부 부담한다.","경매목적물에 하자가 있는 경우, 매도인은 물건의 하자로 인한 담보책임을 지지 않는다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/70","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-70","score":0.9968,"pdfChars":219,"mirrorChars":211},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-71":{"id":"2023-71","year":2023,"number":71,"subject":"civil","question":"甲은 2023. 9. 30. 乙에게 자신 소유의 X부동산을 3억원에 매도하되, 계약금 2천만원은 계약 당일, 중도금 2억원은 2023. 10. 30., 잔금 8천만원은 2023. 11. 30.에 지급받기로 하는 매매계약을 체결하고, 乙로부터 계약 당일 계약금 전액을 지급받았다. 다음 설명 중 옳은 것을 모두 고른 것은?(특별한 사정은 없으며, 다툼이 있으면 판례에 따름)\n\nㄱ. 乙이 2023. 10. 25. 중도금 2억원을 甲에게 지급한 경우, 乙은 2023. 10. 27. 계약금을 포기하더라도 계약을 해제할 수 없다.\nㄴ. 乙이 2023. 10. 25. 중도금 2억원을 甲에게 지급한 경우, 甲은 2023. 10. 27. 계약금의 배액을 상환하더라도 계약을 해제할 수 없다.\nㄷ. 乙이 계약 당시 중도금 중 1억원의 지급에 갈음하여 자신의 丙에 대한 대여금채권을 甲에게 양도하기로 약정하고 그 자리에 丙도 참석하였다면, 甲은 2023. 10. 27. 계약금의 배액을 상환하더라도 계약을 해제할 수 없다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/71","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-71","score":1.0,"pdfChars":551,"mirrorChars":536},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-72":{"id":"2023-72","year":2023,"number":72,"subject":"civil","question":"민법상 임대차계약에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["임대인이 목적물을 임대할 권한이 없어도 임대차계약은 유효하게 성립한다.","임차기간을 영구로 정한 임대차약정은 특별한 사정이 없는 한 허용된다.","임차인은 특별한 사정이 없는 한 자신이 지출한 임차물의 보존에 관한 필요비 금액의 한도에서 차임의 지급을 거절할 수 있다.","임대차가 묵시의 갱신이 된 경우, 전임대차에 대해 제3자가 제공한 담보는 원칙적으로 소멸하지 않는다.","임대차 종료로 인한 임차인의 원상회복의무에는 임대인이 임대 당시의 부동산 용도에 맞게 다시 사용할 수 있도록 협력할 의무까지 포함된다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/72","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-72","score":1.0,"pdfChars":337,"mirrorChars":327},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-73":{"id":"2023-73","year":2023,"number":73,"subject":"civil","question":"甲은 건물 소유를 목적으로 乙 소유의 X토지를 임차한 후, 그 지상에 Y건물을 신축하여 소유하고 있다. 위 임대차계약이 종료된 후, 甲이 乙에게 Y건물에 관하여 지상물매수청구권을 행사하는 경우에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["특별한 사정이 없는 한 Y건물이 미등기 무허가건물이라도 매수청구권의 대상이 될 수 있다.","임대차기간이 만료되면 甲이 Y건물을 철거하기로 한 약정은 특별한 사정이 없는 한 무효이다.","Y건물이 X토지와 제3자 소유의 토지 위에 걸쳐서 건립되었다면, 甲은 Y건물 전체에 대하여 매수청구를 할 수 있다.","甲의 차임연체를 이유로 임대차계약이 해지된 경우, 甲은 매수청구권을 행사할 수 없다.","甲이 적법하게 매수청구권을 행사한 후에도 Y건물의 점유·사용을 통하여 X토지를 계속하여 점유·사용하였다면, 甲은 乙에게 X토지 임료 상당액의 부당이득반환의무를 진다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/73","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-73","score":1.0,"pdfChars":462,"mirrorChars":451},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-74":{"id":"2023-74","year":2023,"number":74,"subject":"civil","question":"매매계약의 법정해제에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 일방 당사자의 계약위반을 이유로 한 상대방의 계약해제 의사표시에 의해 계약이 해제되었음에도 상대방이 계약이 존속함을 전제로 계약상 의무의 이행을 구하는 경우, 특별한 사정이 없는 한 계약을 위반한 당사자도 당해 계약이 상대방의 해제로 소멸되었음을 들어 그 이행을 거절할 수 있다.\nㄴ. 계약해제로 인한 원상회복의 대상에는 매매대금은 물론 이와 관련하여 그 계약의 존속을 전제로 수령한 지연손해금도 포함된다.\nㄷ. 과실상계는 계약해제로 인한 원상회복의무의 이행으로서 이미 지급한 급부의 반환을 구하는 경우에는 적용되지 않는다.","options":["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유  경우"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/76","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-76","score":1.0,"pdfChars":325,"mirrorChars":316},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-77":{"id":"2023-77","year":2023,"number":77,"subject":"civil","question":"부동산 명의신탁약정과 그에 따른 등기의 무효로 대항할 수 없는 제3자(부동산 실권리자명의 등기에 관한 법률 제4조 제3항)에 해당하는 자를 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 명의수탁자의 상속인\nㄴ. 명의신탁된 부동산을 가압류한 명의수탁자의 채권자\nㄷ. 명의신탁자와 명의신탁된 부동산소유권을 취득하기 위한 계약을 맺고 등기명의만을 명의수탁자로부터 경료받은 것과 같은 외관을 갖춘 자\nㄹ. 학교법인이 명의수탁자로서 기본재산에 관한 등기를 마친 경우, 기본재산 처분에 관하여 허가권을 갖는 관할청","options":["ㄴ","ㄱ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2023/minbeop/77","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2023-exam-2996-e8775dd8b058.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2023-77","score":1.0,"pdfChars":329,"mirrorChars":318},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5212459&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":34,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2023-78":{"id":"2023-78","year":2023,"number":78,"subject":"civil","question":"甲은 2023. 1. 5. 乙로부터 그 소유의 X주택을 보증금 2억원, 월 임료 50만원, 기간은 계약일로부터 1년으로 정하여 임차하는 내용의 계약을 체결하고, 당일 乙에게 보증금을 지급함과 동시에 X주택을 인도받아 주민등록을 마치고 확정일자를 받았다. 다음 중 주택임대차보호법의 적용에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["甲은 2023. 1. 6. 오전 영시부터 대항력을 취득한다.","제3자에 의해 2023. 5.  ㄴ: 10 증가","ㄱ: 10 상승, ㄴ: 15 증가","ㄱ: 15 상승, ㄴ: 15 증가"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/budongsan/8","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-8","score":0.9066,"pdfChars":351,"mirrorChars":340},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-9":{"id":"2022-9","year":2022,"number":9,"subject":"estate","question":"부동산시장에 관한 설명으로 틀린 것은?(단, 다른 조건은 동일함)","options":["부동산시장에서는 정보의 비대칭성으로 인해 부동산가격의 왜곡현상이 나타나기도 한다.","부동산시장은 장기보다 단기에서 공급의 가격탄력성이 크므로 단기 수급조절이 용이하다.","부동산시장은 규모, 유형, 품질 등에 따라 세분화 되고, 지역별로 구분되는 특성이 있다.","부동산시장에서는 일반적으로 매수인의 제안가격과 매도인의 요구가격 사이에서 가격이 형성된다.","부동산시장은 불완전하더라도 할당효율적일 수 있다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/budongsan/9","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-9","score":1.0,"pdfChars":271,"mirrorChars":263},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-10":{"id":"2022-10","year":2022,"number":10,"subject":"estate","question":"허프(D. Huff)모형에 관한 설명으로 옳은 것을 모두 고른 것은?(단, 다른 조건은 동일함)\n\nㄱ. 어떤 매장이 고객에게 주는 효용이 클수록 그 매장이 고객들에게 선택될 확률이 더 높아진다는 공리에 바탕을 두고 있다.\nㄴ. 해당 매장을 방문하는 고객의 행동력은 방문하고자 하는 매장의 크기에 비례하고, 매장까지의 거리에 반비례한다.\nㄷ. 공간(거리)마찰계수는 시장의 교통조건과 매장 물건의 특성에 따라 달라지는 값이며, 교통조건이 나빠지면 더 커진다.\nㄹ. 일반적으로 소비자는 가장 가까운 곳에서 상품을 선택하려는 경향이 있다.\nㅁ. 고정된 상권을 놓고 경쟁함으로써 제로섬(zero-sum)게임이 된다는 한계가 있다.","options":["ㄱ, ㄴ","ㄴ, ㄷ, ㄹ","ㄷ, ㄹ, ㅁ","ㄱ, ㄴ, ㄷ, ㅁ","ㄱ, ㄴ, ㄷ, ㄹ, ㅁ"],"correct":[1,2,3,4,5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/budongsan/10","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-10","score":1.0,"pdfChars":407,"mirrorChars":398},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"all-answers-accepted","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-11":{"id":"2022-11","year":2022,"number":11,"subject":"estate","question":"다음 설명에 모두 해당하는 입지이론은?\n\n○ 인간정주체계의 분포원리와 상업입지의 계층체계를 설명하고 있다.\n○ 재화의 도달거리와 최소요구치와의 관계를 설명하는 것으로 최소요구치가 재화의 도달범위 내에 있을 때 판매자의 존속을 위한 최소한의 상권범위가 된다.\n○ 고객의 다목적 구매행동, 고객의 지역 간 문화적 차이를 반영하지 않았다는 비판이 있다.","options":["애플바움(W. Applebaum)의 소비자분포기법","레일리(W. Reilly)의 소매중력모형","버제스(E. Burgess)의 동심원이론","컨버스(P. Converse)의 분기점 모형","크리스탈러(W. Christaller)의 중심지이론"],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/budongsan/11","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-11","score":1.0,"pdfChars":334,"mirrorChars":327},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-12":{"id":"2022-12","year":2022,"number":12,"subject":"estate","question":"대형마트가 개발된다는 다음과 같은 정보가 있을 때 합리적인 투자자가 최대한 지불할 수 있는 이 정보의 현재가치는?(단, 주어진 조 . Reilly)의 소매중력모형에 따라 C신도시의 소비자가 A도시와 B도시에서 소비하는 월 추정소비액은 각각 얼마인가?(단, C신도시의 인구는 모두 소비자이고, A, B도시에서만 소비하는 것으로 가정함)\n\n○ A도시 인구: 50,000명, B도시 인구: 32,000명\n○ C신도시: A도시와 B도시 사이에 위치\n○ A도시와 C신도시 간의 거리: 5km\n○ B도시와 C신도시 간의 거리: 2km\n○ C신도시 소비자의 잠재 월 추정소비액: 10억원","options":["A도시: 1억원, B도시: 9억원","A도시: 1억 5천만원, B도시: 8억 5천만원","A도시: 2억원, B도시: 8억원","A도시: 2억 5천만원, B도시: 7억 5천만원","A도시: 3억원, B도시: 7억원"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/budongsan/14","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-14","score":1.0,"pdfChars":377,"mirrorChars":369},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-15":{"id":"2022-15","year":2022,"number":15,"subject":"estate","question":"다음 입지 및 도시공간구조 이론에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 베버(A. Weber)의 최소비용이론은 산업입지의 영향요소를 운송비, 노동비, 집적이익으로 구분하고, 이 요소들을 고려하여 비용이 최소화 되는 지점이 공장의 최적입지가 된다는 것이다.\nㄴ. 뢰시(A. Lösch)의 최대수요이론은 장소에 따라 수요가 차별적이라는 전제하에 수요측면에서 경제활동의 공간조직과 상권조직을 파악한 것이다.\nㄷ. 넬슨(R. Nelson)의 소매입지이론은 특정 점포가 최대 이익을 얻을 수 있는 매출액을 확보하기 위해서는 어떤 장소에 입지하여야 하는가에 대한 원칙을 제시한 것이다.\nㄹ. 해리스(C. Harris)와 울만(E. Ullman)의 다핵심이론은 단일의 중심업무지구를 핵으로 하여 발달하는 것이 아니라, 몇 개의 분리된 핵이 점진적으로 통합됨에 따라 전체적인 도시구조가 형성된다는 것이다.","options":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/budongsan/15","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-15","score":1.0,"pdfChars":499,"mirrorChars":491},"visualReview
