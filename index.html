  {id:'e2',s:'estate',t:'토지의 인문적 특성',topic:'부동산의 특성',fact:'용도의 다양성·병합·분할의 가능성·사회적 및 경제적 위치의 가변성 등은 인문적 특성이다.',recall:'개발·용도전환을 가능하게 하는 대표 인문적 특성은?',answer:'용도의 다양성',trap:'부증성은 자연적 특성; 경제적 공급과 물리적 공급을 구분한다.'},
  {id:'e3',s:'estate',t:'부동산의 부동성',topic:'부동산의 특성',fact:'위치를 이동할 수 없어 지역시장과 외부효과가 중요하며 임장활동이 필요하다.',recall:'부동성에서 파생되는 활동 하나는?',answer:'지역시장 형성 또는 임장활동 필요',trap:'부동성은 외부효과가 없다는 뜻이 아니다.'},
  {id:'e4',s:'estate',t:'부증성과 공급',topic:'부동산의 특성',fact:'토지의 총 물리적 공급량은 원칙적으로 고정되나 경제적 이용가능 면적은 개발·전환으로 달라질 수 있다.',recall:'물리적 공급과 경제적 공급의 차이는?',answer:'물리적 공급은 고정적, 경제적 공급은 이용방식에 따라 변화 가능',trap:'매립 등 예외 상황과 일반 이론의 구분이 필요하다.'},
  {id:'e5',s:'estate',t:'후보지와 이행지',topic:'부동산의 특성',fact:'후보지는 택지·농지·임지 등 대분류 지역 간 전환, 이행지는 같은 대분류 내부의 세부 용도 전환이다.',recall:'농지 → 택지와 주거 → 상업, 각각 무엇인가?',answer:'농지→택지: 후보지 / 주거→상업: 이행지',trap:'‘지역 간’과 ‘지역 안’의 차이를 먼저 읽는다.'},
  {id:'e6',s:'estate',t:'수요 vs 수요량',topic:'수요·공급·탄력성',fact:'자기 가격 변동은 수요곡선 위의 이동(수요량 변화), 소득·선호·대체재 가격 등은 수요곡선 자체의 이동(수요 변화) 요인이다.',recall:'부동산 자체 가격이 내리면 무엇이 변하는가?',answer:'다른 조건 동일 시 수요량(곡선상의 이동)',trap:'‘수요가 증가했다’와 ‘수요량이 증가했다’를 혼동하지 않는다.'},
  {id:'e7',s:'estate',t:'정상재와 소득',topic:'수요·공급·탄력성',fact:'정상재는 소득 증가 시 수요곡선이 오른쪽으로 이동한다. 열등재는 반대의 소득효과가 나타날 수 있다.',recall:'정상재에서 소득 증가 시 수요곡선은?',answer:'우측 이동',trap:'자기 가격 하락의 이동과 구분한다.'},
  {id:'e8',s:'estate',t:'수요의 가격탄력성',topic:'수요·공급·탄력성',fact:'가격탄력성의 크기(절댓값) = 수요량 변화율 ÷ 가격 변화율. 1보다 크면 탄력적, 1보다 작으면 비탄력적이다.',recall:'가격 10% 상승, 수요량 5% 감소 → 탄력성은?',answer:'0.5(비탄력적)',trap:'수요량과 가격 변화 방향이 반대이므로 통상 절댓값을 쓴다.'},
  {id:'e9',s:'estate',t:'교차탄력성과 관계',topic:'수요·공급·탄력성',fact:'교차탄력성이 양수이면 통상 대체재, 음수이면 보완재 관계로 본다.',recall:'대체재 관계인 두 재화의 교차탄력성 부호는?',answer:'양수(+)',trap:'소득탄력성·자기가격탄력성과 구분한다.'},
  {id:'e10',s:'estate',t:'균형가격 판단',topic:'수요·공급·탄력성',fact:'수요 증가만 있을 때 일반적으로 균형가격과 균형거래량이 함께 오른다. 공급 증가만 있을 때 가격은 내리고 거래량은 오른다.',recall:'수요 증가+공급 불변, 가격과 수량 방향은?',answer:'가격 상승, 거래량 증가',trap:'수요와 공급이 동시에 움직이면 크기에 따라 한쪽 결과가 불확정일 수 있다.'},
  {id:'e11',s:'estate',t:'거미집모형',topic:'시장·입지·도시',fact:'공급자가 전기 가격을 기준으로 공급량을 결정하고 수요자는 현 가격에 반응하는 시차모형이다.',recall:'거미집모형에서 생산자의 공급 결정은 어느 가격에 반응하나?',answer:'전기(과거) 가격',trap:'기울기 비교와 탄력성 비교는 축 정의를 반드시 확인한다.'},
  {id:'e12',s:'estate',t:'저량과 유량',topic:'시장·입지·도시',fact:'저량(stock)은 특정 시점에 측정하고, 유량(flow)은 일정 기간에 걸쳐 측정한다.',recall:'주택재고와 신규주택 공급량 중 저량은?',answer:'주택재고',trap:'재산·자본총량은 저량, 소득·거래량은 유량이다.'},
  {id:'e13',s:'estate',t:'리카도 차액지대설',topic:'시장·입지·도시',fact:'토지 비옥도의 차이와 한계지의 무지대 개념을 중점으로 본다.',recall:'리카도의 차액지대설에서 최열등지의 지대는?',answer:'한계지에서는 지대가 발생하지 않는다(이론상 무지대)',trap:'마르크스 절대지대설과 혼동하지 않는다.'},
  {id:'e14',s:'estate',t:'허프모형',topic:'시장·입지·도시',fact:'소비자 선택확률은 점포의 유인력(대개 규모)과 거리마찰에 의해 결정된다고 본다.',recall:'허프모형에서 일반적으로 거리가 멀어지면 선택확률은?',answer:'다른 조건 동일 시 낮아진다',trap:'확률의 분모는 경쟁점포 전체의 유인력 합이다.'},
  {id:'e15',s:'estate',t:'부동산 정책의 직접개입',topic:'정책·투자·금융',fact:'공영개발, 공공임대주택 공급, 토지은행 등은 시장에 직접 참여하는 유형이다.',recall:'공영개발사업은 직접개입인가 간접개입인가?',answer:'직접개입',trap:'조세·금융규제는 대표적인 간접개입 수단이다.'},
  {id:'e16',s:'estate',t:'현재가치 PV',topic:'정책·투자·금융',fact:'1년 후 금액의 현재가치 = 미래금액 ÷ (1+할인율). 할인율이 높을수록 현재가치는 낮아진다.',recall:'1년 후 110만 원을 할인율 10%로 할인하면 PV는?',answer:'100만 원',trap:'단위와 할인기간을 확인한다.'},
  {id:'e17',s:'estate',t:'순현재가치 NPV',topic:'정책·투자·금융',fact:'NPV = 현금유입 현재가치 합계 − 현금유출 현재가치 합계. 독립 투자안의 NPV가 양수이면 일반적으로 채택 가능하다.',recall:'현금유입 PV 120, 투자비 PV 100 → NPV는?',answer:'+20',trap:'내부수익률(IRR)과 혼동하지 않는다.'},
  {id:'e18',s:'estate',t:'LTV와 DTI',topic:'정책·투자·금융',fact:'LTV는 담보가치 대비 대출 비율, DTI는 소득 대비 연간 원리금 상환부담 비율의 개념이다.',recall:'LTV의 분모는 무엇인가?',answer:'담보가치',trap:'DSR·DTI·LTV는 분모와 포함 채무 범위가 서로 다르다.'},
  {id:'e19',s:'estate',t:'감정평가 3방식',topic:'감정평가',fact:'원가방식의 원가법, 비교방식의 거래사례비교법, 수익방식의 수익환원법을 구분한다.',recall:'수익성을 기준으로 가치를 추정하는 대표 방법은?',answer:'수익환원법',trap:'평가 3방식과 각각의 세부 기법을 혼동하지 않는다.'},
  {id:'e20',s:'estate',t:'환원율과 수익가격',topic:'감정평가',fact:'직접환원법의 단순형: 수익가격 = 순영업소득(NOI) ÷ 환원율.',recall:'NOI 1,000만 원, 환원율 5% → 가치는?',answer:'2억 원',trap:'총임대수입과 순영업소득을 혼동하지 않는다.'},
  {id:'c1',s:'civil',t:'법률행위와 의사표시',topic:'법률행위·의사표시',fact:'법률행위는 일정한 법률효과를 발생시키려는 의사표시를 필수요소로 한다.',recall:'법률행위의 필수 구성요소는?',answer:'의사표시',trap:'사실행위와 법률행위를 구분한다.'},
  {id:'c2',s:'civil',t:'비진의 의사표시',topic:'법률행위·의사표시',fact:'원칙적으로 표시한 대로 효력이 있으나, 상대방이 진의 아님을 알았거나 알 수 있었을 때 무효가 된다(민법 제107조).',recall:'비진의표시가 원칙적으로 유효한가?',answer:'원칙적으로 유효하다',trap:'상대방의 악의·과실과 선의의 제3자 보호를 구분한다.'},
  {id:'c3',s:'civil',t:'통정허위표시',topic:'법률행위·의사표시',fact:'상대방과 통정한 허위 의사표시는 무효. 이 무효로 선의의 제3자에게 대항하지 못한다(민법 제108조).',recall:'통정허위표시의 당사자 사이 효력은?',answer:'무효',trap:'제3자의 보호에서 선의인지가 중요하다.'},
  {id:'c4',s:'civil',t:'착오로 인한 의사표시',topic:'법률행위·의사표시',fact:'법률행위 내용의 중요부분에 착오가 있는 경우 원칙적으로 취소할 수 있다. 표의자에게 중대한 과실이 있으면 제한된다(민법 제109조).',recall:'중요부분의 착오가 있으면 원칙적으로 무효인가 취소인가?',answer:'취소할 수 있다',trap:'동기의 착오·중과실·상대방 사정을 별도로 검토한다.'},
  {id:'c5',s:'civil',t:'사기·강박 의사표시',topic:'법률행위·의사표시',fact:'사기나 강박에 의한 의사표시는 취소할 수 있다(민법 제110조).',recall:'사기에 의한 계약은 처음부터 당연무효인가?',answer:'아니다. 원칙적으로 취소할 수 있는 법률행위다.',trap:'제3자에 의한 사기와 강박의 요건은 다르다.'},
  {id:'c6',s:'civil',t:'무효 vs 취소',topic:'대리·무효·취소',fact:'무효는 처음부터 효력이 없는 것이고, 취소할 수 있는 행위는 취소 전까지 유효하게 취급되나 취소 시 소급하여 무효로 본다(민법 제141조).',recall:'취소된 법률행위는 언제부터 무효인 것으로 보는가?',answer:'처음부터',trap:'무효행위의 추인과 취소할 수 있는 행위의 추인은 구분한다.'},
  {id:'c7',s:'civil',t:'대리의 효과',topic:'대리·무효·취소',fact:'적법한 대리인이 권한 내에서 본인을 위한 것임을 표시하고 한 의사표시는 원칙적으로 직접 본인에게 효력이 생긴다(민법 제114조).',recall:'적법한 대리행위의 효과는 누구에게 귀속되는가?',answer:'본인',trap:'현명주의 예외와 무권대리를 구분한다.'},
  {id:'c8',s:'civil',t:'무권대리와 추인',topic:'대리·무효·취소',fact:'대리권 없이 체결한 계약은 본인의 추인이 없으면 본인에 대해 효력이 생기지 않는다(민법 제130조).',recall:'무권대리 계약을 본인에게 귀속시키는 행위는?',answer:'본인의 추인',trap:'표현대리와 무권대리인의 책임은 별개이다.'},
  {id:'c9',s:'civil',t:'소유권 vs 점유권',topic:'물권·등기·점유',fact:'소유권은 사용·수익·처분 권능을 가진 물권, 점유권은 물건을 사실상 지배하는 상태에 기초한 권리다.',recall:'물건을 직접 지배하지만 소유자는 아닌 상태에 해당하는 것은?',answer:'점유',trap:'점유자라고 항상 소유자가 되는 것은 아니다.'},
  {id:'c10',s:'civil',t:'부동산 물권변동과 등기',topic:'물권·등기·점유',fact:'법률행위로 인한 부동산 물권변동은 원칙적으로 등기해야 효력이 생긴다(민법 제186조).',recall:'매매로 소유권을 취득하려면 원칙적으로 필요한 공시는?',answer:'등기',trap:'상속 등 법률규정에 의한 물권취득은 별도로 본다(민법 제187조).'},
  {id:'c11',s:'civil',t:'상속에 의한 물권취득',topic:'물권·등기·점유',fact:'상속 등 법률규정에 의한 부동산 물권취득은 등기 없이도 효력이 생길 수 있지만, 처분을 위해 등기가 필요하다(민법 제187조).',recall:'상속으로 부동산을 취득할 때 등기 없으면 효력이 없는가?',answer:'취득 자체는 등기 없이 가능(처분에는 등기 필요)',trap:'법률행위에 의한 취득과 혼동하지 않는다.'},
  {id:'c12',s:'civil',t:'물권적 청구권',topic:'물권·등기·점유',fact:'소유자는 소유물반환청구, 방해제거 및 방해예방청구 등으로 권리를 보호할 수 있다(민법 제213·214조).',recall:'소유권을 방해하는 상태의 제거를 구하는 권리는?',answer:'소유물방해제거청구권',trap:'손해배상청구권과 물권적 청구권은 요건이 다르다.'},
  {id:'c13',s:'civil',t:'계약의 성립',topic:'계약·매매·임대차',fact:'계약은 원칙적으로 서로 대응하는 청약과 승낙의 합치로 성립한다.',recall:'계약 성립에 기본적으로 필요한 두 의사표시는?',answer:'청약과 승낙',trap:'청약의 유인과 청약을 구분한다.'},

/* Local import for OCR-extracted TXT. This is deliberately NOT an OCR engine. */
let OCR_PREVIEW=null;
function parseNumberedExamText(text,year,subjectId){
 const [start,end]=subjectId==='estate'?[1,40]:[41,80];
 const cleaned=String(text||'').replace(/\r\n?/g,'\n').replace(/\uFEFF/g,'');
 const re=/^\s*(?:문제\s*)?([1-9]\d?)[.．)]\s*(.*)$/gm;
 const blocks=[...cleaned.matchAll(re)];
 const result=[],seen=new Set();
 for(let i=0;i<blocks.length;i++){
  const m=blocks[i],num=Number(m[1]);if(num<start||num>end||seen.has(num))continue;
  const section=cleaned.slice(m.index+m[0].length,i+1<blocks.length?blocks[i+1].index:cleaned.length).trim();
  const body=[m[2],section].filter(Boolean).join('\n').trim();
  if(body.length<12)continue;
  seen.add(num);result.push({number:num,text:body.slice(0,3500)});
 }
 return {year,subjectId,items:result.sort((a,b)=>a.number-b.number),detected:blocks.filter(m=>Number(m[1])>=start&&Number(m[1])<=end).length};
}
function showOCRPreview(){const target=OCR_PREVIEW;if(!target||target.year!==rs().year||target.subjectId!==state.subject)return '';
 const count=target.items.length;const existing=target.items.filter(x=>!!state.officialLinks[`${target.year}-${x.number}`]?.text).length;
 return `<div class="reverse-ocr-preview"><strong>문항 인식 후보 ${count}개 / ${target.detected}개 번호 탐지</strong><p>기존 입력 지문 ${existing}개와 번호가 겹칩니다. 자동 분리 결과를 반드시 직접 확인하세요. 연도·과목·문항 번호가 잘못 인식될 수 있습니다.</p>${target.items.slice(0,3).map(x=>`<div class="reverse-ocr-sample"><strong>${x.number}번</strong><span>${esc(shortPhrase(x.text,180))}</span></div>`).join('')}${count?'<button class="btn" data-action="r-ocr-save">확인한 번호별 지문 저장</button>':''}</div>`;
}
function readOCRInput(file){if(!file){toast('TXT 파일을 선택하세요.');return;}
 if(!/\.(txt|md)$/i.test(file.name)){toast('OCR 후 내보낸 TXT 또는 MD 파일만 지원합니다.');return;}
 if(file.size>1024*1024*2){toast('한 과목 입력은 2MB 이하만 허용합니다.');return;}
 const requestedYear=rs().year,requestedSubject=state.subject;
 const reader=new FileReader();reader.onerror=()=>toast('텍스트 파일을 읽지 못했습니다.');reader.onload=()=>{
  if(rs().year!==requestedYear||state.subject!==requestedSubject){toast('과목·연도가 변경되어 가져오기를 취소했습니다. 다시 선택하세요.');return;}
  OCR_PREVIEW=parseNumberedExamText(reader.result,requestedYear,requestedSubject);
  render();toast(`${OCR_PREVIEW.items.length}개 번호별 문항 후보를 찾았습니다. 미리보기를 확인하세요.`);
 };reader.readAsText(file,'utf-8');
}
function saveOCRImport(){const batch=OCR_PREVIEW;if(!batch||batch.year!==rs().year||batch.subjectId!==state.subject){toast('이 연도·과목에서 미리보기를 먼저 해주세요.');return;}
 if(!batch.items.length){toast('가져올 문항이 없습니다.');return;}
 const overlaps=batch.items.filter(x=>state.officialLinks[`${batch.year}-${x.number}`]?.text).length;
 if(overlaps&&!confirm(`${overlaps}개 문항의 기존 지문을 덮어쓸 수 있습니다. OCR 번호와 지문을 확인했나요?`))return;
 for(const q of batch.items){const key=`${batch.year}-${q.number}`;state.officialLinks[key]={...state.officialLinks[key],text:q.text,sourceText:'ocr-text-import',updated:Date.now()};}
 OCR_PREVIEW=null;save();render();toast(`${batch.items.length}개 문항 텍스트를 로컬에 저장했습니다. 개념 연결은 검토 후 지정해주세요.`);
}

function reverseTheoryCard(c,visible=true){const v=REVERSE_COMPARE[c.id];return `<div class="reverse-concept"><div class="flex flex-between"><strong>${esc(c.t)}</strong><span class="pill green">${esc(c.topic)}</span></div>${visible?`<p>${esc(c.fact)}</p><div class="reverse-danger"><strong>선지 함정</strong> · ${esc(c.trap)}</div>`:`<p class="reverse-recall">${esc(c.recall)}</p>`}${v?`<button class="panel-link" data-r-venn="${v}">공통점·차이점 보기 ↗</button>`:''}</div>`;}

 <div class="reverse-steps">${['01 문제 먼저','02 이론·함정 해부','03 가리고 떠올리기','04 전이 문제','05 원문제 다시'].map((name,i)=>`<div class="reverse-step ${rs().step>=([0,1,2,4,5][i])?'done':''}"><span>${i+1}</span><strong>${name}</strong></div>`).join('')}</div><hr class="rule"/><div class="panel-head"><h3>문제 목록</h3><span class="small muted">오답은 반복 우선</span></div><div class="concept-list reverse-queue">${availablePractice().map((item,i)=>{const rp=tracked(item);return `<button class="concept-item ${item.id===q.id?'active':''}" data-r-select="${item.id}"><span>${i+1}. ${esc(shortPhrase(item.q,35))}</span><small>${rp.complete?'✓ 재도전 통과':reverseDue(item)?'⏰ 복습':rp.attempts?'↻ 진행':'미학습'}</small></button>`;}).join('')}</div><p class="tiny muted" style="margin-top:12px">연습문제 30개는 학습용 창작 문항입니다. 실제 시험 문항으로 표시하지 않습니다.</p></section>`;}
function reverseResultLine(q,num){return `<div class="reverse-result ${num===q.ok?'yes':'no'}"><strong>${num===q.ok?'✓ 정답':'↻ 오답'} · 정답 ${q.ok}번</strong><p>${esc(q.why)}</p></div>`;}
function renderPracticeReverse(){const q=reverseQuestion();if(!q)return `<div class="empty">학습 문항이 없습니다.</div>`;
 const c=linkedConcepts(q),step=Math.min(6,Math.max(0,Number(rs().step)||0));const transfer=relatedTransfer(q),p=tracked(q);

 if(step===1){body=`<div class="reverse-kicker">02 · 답의 근거와 함정을 짧게 해부</div><h2 class="question">${esc(q.q)}</h2>${reverseResultLine(q,rs().firstChoice)}${renderOptionBreakdown(q,rs().firstChoice)}<div class="reverse-summary"><strong>이 문제에서 꺼낸 판단 규칙</strong><p>${esc(c[0]?.answer||q.why)}</p></div><h3>정답을 고르는 데 필요한 이론만</h3><div class="stack">${c.map(x=>reverseTheoryCard(x,true)).join('')}</div><div class="reverse-actions"><button class="btn" data-action="r-start-recall">핵심만 가리고 외우기 →</button></div>`;}
 if(step===2){body=`<div class="reverse-kicker">03 · 책을 가리고 머릿속으로 대답</div><h2>이 문제에 필요한 ${c.length}개 핵심만 떠올려 보세요.</h2><p class="muted">정답을 스스로 말한 뒤 확인하세요. 다시 읽기보다 꺼내 보는 연습입니다.</p><div class="stack">${c.map((x,i)=>`<div class="reverse-recall-card"><span class="pill green">RECALL ${i+1}</span><h3>${esc(x.recall)}</h3><p class="muted small">${esc(x.t)}</p></div>`).join('')}</div><div class="reverse-actions"><button class="btn" data-action="r-reveal">답 펼치기 →</button></div>`;}
 if(step===3){body=`<div class="reverse-kicker">03 · 정답 확인과 기억 수준 평가</div><div class="stack">${c.map(x=>`<div class="reverse-concept"><h3>${esc(x.recall)}</h3><p class="reverse-answer">${esc(x.answer)}</p><p class="small muted">${esc(x.trap)}</p></div>`).join('')}</div><div class="reverse-actions"><button class="btn danger" data-action="r-rate" data-r-rating="0">아예 기억 안 남 · 15분 후</button><button class="btn secondary" data-action="r-rate" data-r-rating="1">부분 기억 · 내일</button><button class="btn" data-action="r-rate" data-r-rating="2">설명 가능 · 3일 후</button></div><p class="tiny muted">복습 간격은 시험 직전용 경험적 기본값입니다. 기억력 향상을 보장하는 점수는 아닙니다.</p>`;}
 if(step===4){body=`<div class="reverse-kicker">04 · 같은 개념을 다른 상황에서 적용</div><h2 class="question">${esc(transfer.q)}</h2><p class="small muted">연결 개념: ${esc(transfer.topic)} · 같은 핵심규칙의 창작 전이문제 (공식 기출 아님)</p>${reverseOptionList(transfer,'transfer')}${rs().transferChoice?`${reverseResultLine(transfer,rs().transferChoice)}<div class="reverse-actions"><button class="btn" data-action="r-to-retry">처음 문제 다시 풀기 →</button></div>`:`<p class="small muted">이론을 읽지 않고 풀어보세요. 틀렸다면 왜 다른지 다시 말해보세요.</p>`}`;}
 if(step===5){body=`<div class="reverse-kicker">05 · 해설 없이 원래 문제 다시 풀기</div><h2 class="question">${esc(q.q)}</h2>${reverseOptionList(q,'retry')}${rs().retryChoice?`${reverseResultLine(q,rs().retryChoice)}<div class="reverse-actions"><button class="btn" data-action="r-finish">결과 기록하기 →</button></div>`:''}`;}

function reverseModeTabs(){return `<div class="subject-tabs reverse-mode-tabs"><button class="subject-tab ${rs().mode==='practice'?'active':''}" data-r-mode="practice">✦ 문제 → 이론 초압축</button><button class="subject-tab ${rs().mode==='official'?'active':''}" data-r-mode="official">▤ 공식 10개년 기출 연결</button></div>`;}
function officialId(){return `${rs().year}-${rs().number}`;}
function officialNote(){return state.officialLinks[officialId()]||{};}
function officialSuggested(text){const input=String(text||'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ');if(input.length<4)return [];
 return allTheory().map(c=>{
  const keys=CONCEPT_KEYWORDS[c.id]||[];
  const matches=[...new Set(keys.filter(k=>input.includes(k.toLowerCase())))];
  const score=matches.reduce((n,k)=>n+(k.length>=4?3:1),0);
  return {id:c.id,t:c.t,score,matches};
 }).filter(x=>x.score>=2).sort((a,b)=>b.score-a.score).slice(0,4);
}
function officialCoverage(){
 const [start,end]=examRange();let allText=0,allLinked=0,allMarked=0;
 const rows=EXAMS.map(e=>{let t=0,l=0,m=0;
  for(let n=start;n<=end;n++){const entry=state.officialLinks[`${e.year}-${n}`];if(entry?.text?.trim())t++;if(entry?.conceptId&&conceptById(entry.conceptId)?.s===state.subject)l++;if([1,2,3,4,5].includes(state.answers[`${e.year}-${n}`]))m++;}
  allText+=t;allLinked+=l;allMarked+=m;return {year:e.year,t,l,m};
 });return {allText,allLinked,allMarked,rows};
}
function nextUnlinkedOfficial(){const [start,end]=examRange(),length=end-start+1,base=rs().number;
 for(let i=1;i<=length;i++){const n=start+(base-start+i)%length;const entry=state.officialLinks[`${rs().year}-${n}`];
  if(entry?.text?.trim()&&!entry?.conceptId)return n;
 }
 return base<end?base+1:start;
}

function reverseRate(rating){const q=reverseQuestion(),p=tracked(q);const intervals=[15*60000,DAY,3*DAY];let due=Date.now()+intervals[rating];
 const examAt=new Date('2026-10-31T08:00:00+09:00').getTime();if(Date.now()<examAt)due=Math.min(due,examAt);
 for(const c of linkedConcepts(q)){state.reviews[c.id]=new Date(due).toISOString();state.flashVisits[c.id]={correct:rating===2,at:Date.now(),via:'reverse',rating};}
 state.reverseProgress[q.id]={...p,recallRating:rating,due,updated:Date.now()};rs().recallRating=rating;rs().step=4;save();render();}
function reverseMarkFirst(choice){const q=reverseQuestion(),p=tracked(q);rs().firstChoice=choice;rs().step=1;
 state.reverseProgress[q.id]={...p,attempts:(Number(p.attempts)||0)+1,firstWrong:choice!==q.ok,lastFirst:choice,updated:Date.now()};

function reverseFinish(){const q=reverseQuestion(),p=tracked(q);const good=rs().retryChoice===q.ok;const id='quiz-'+q.id;
 state.reverseProgress[q.id]={...p,complete:good,lastCorrect:good,retries:(p.retries||0)+1,updated:Date.now(),due:!good?Date.now()+15*60000:p.due};
 if(good){if(state.mistakes[id])state.mistakes[id].resolved=true;}
 else{state.mistakes[id]={id,type:'quiz',s:q.s,label:q.q,topic:q.topic,answer:rs().retryChoice,correct:String(q.ok),why:q.why,updated:Date.now(),resolved:false};}

 if(what==='r-official-next-unlinked'){rs().number=nextUnlinkedOfficial();rs().showOfficialKey=false;save();render();return true;}
 if(what==='r-open-omr'){state.year=rs().year;state.examQuestion=rs().number;state.view='exam';save();render();return true;}
 if(what==='r-exam-analyze'){rs().year=state.year;rs().number=state.examQuestion;rs().mode='official';rs().showOfficialKey=false;state.view='reverse';save();render();return true;}

 return false;

 const official=t.closest('[data-r-official-id]');if(official){const [y,n]=official.dataset.rOfficialId.split('-').map(Number);if(EXAMS.some(e=>e.year===y)&&Number.isInteger(n)){const s=n<=40?'estate':'civil';if(s!==state.subject)setSubject(s);rs().year=y;rs().number=n;rs().mode='official';rs().showOfficialKey=false;save();render();}return true;}

 return false;

let calcIndex=0,calcAnswer=0,calcHint=false;
function renderCalc(){const c=CALC_BANK[calcIndex];return `${titleBlock('계산문제만 바로 풀기','숫자키 1~5로 선택 · 공식 보기 → 숫자 대입 → 조건 확인','CALCULATION / STEP 1')}<div class="tag-row" style="margin-bottom:18px">${CALC_BANK.map((x,i)=>`<button class="btn ${i===calcIndex?'':'secondary'}" data-calc-index="${i}">${esc(x.t)}</button>`).join('')}</div><section class="panel"><span class="pill">직접 제작한 연습 · ${calcIndex+1}/${CALC_BANK.length}</span><h2 class="question">${esc(c.q)}</h2><p class="small muted">키보드 위쪽 숫자키와 숫자패드 1~5 모두 사용 가능합니다.</p><div class="choices">${c.a.map((a,i)=>`<button class="choice ${calcAnswer===i+1?(calcAnswer===c.ok?'correct':'wrong'):''}" data-calc-choice="${i+1}" ${calcAnswer?'disabled':''}><span class="option-index">${i+1}</span>${esc(a)}</button>`).join('')}</div><div class="quiz-nav"><button class="btn secondary" data-calc-hint>짧은 공식 ${calcHint?'접기':'보기'}</button><button class="btn" data-calc-next>다음 유형 →</button></div>${calcHint||calcAnswer?`<div class="callout"><strong>한 줄 공식</strong><p>${esc(c.f)}</p></div>`:''}${calcAnswer?`<div class="explanation" role="status"><strong>${calcAnswer===c.ok?'정답':'다시 기억하기'} · ${c.ok}번</strong><p>${esc(c.fast)}</p><p>${esc(c.guard)}</p><button class="btn secondary" data-calc-retry>다시 풀기</button></div>`:''}<p class="small muted">기출 출제개념을 연습하는 창작 문항입니다. 시중 교재 전체의 풀이속도를 비교·검증한 결과는 아닙니다.</p></section>`;}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-calc-index],[data-calc-choice],[data-calc-next],[data-calc-hint],[data-calc-retry]');if(!t)return;
 if(t.hasAttribute('data-calc-index')){calcIndex=Number(t.dataset.calcIndex);calcAnswer=0;calcHint=false;}
 else if(t.hasAttribute('data-calc-choice')){if(calcAnswer)return;calcAnswer=Number(t.dataset.calcChoice);}
 else if(t.hasAttribute('data-calc-next')){calcIndex=(calcIndex+1)%CALC_BANK.length;calcAnswer=0;calcHint=false;}
 else if(t.hasAttribute('data-calc-retry')){calcAnswer=0;calcHint=false;}
 else calcHint=!calcHint;
 render();
});

function chalkReconcile(oldText,newText,oldColors,color){let a=0;while(a<oldText.length&&a<newText.length&&oldText[a]===newText[a])a++;let b=0;while(b<oldText.length-a&&b<newText.length-a&&oldText[oldText.length-1-b]===newText[newText.length-1-b])b++;return [...oldColors.slice(0,a),...Array(newText.length-a-b).fill(color),...(b?oldColors.slice(oldText.length-b):[])];}

function ttsSettings(){if(!state.tts||typeof state.tts!=='object')state.tts={};const t=state.tts;t.rate=Math.min(2,Math.max(.75,Number(t.rate)||1.5));if(typeof t.voice!=='string')t.voice='';return t;}

function ttsChosenVoice(){const settings=ttsSettings(),ko=ttsVoices.filter(v=>/^ko(?:-|_)/i.test(v.lang)||v.lang==='ko');return ko.find(v=>v.voiceURI===settings.voice)||ko.find(v=>/sunhi|heami|yuna|sora|서연|유나|소라|여성/i.test(v.name))||ko[0];}
function ttsPlay(items){ttsStop(false);if(!('speechSynthesis' in window)||!window.SpeechSynthesisUtterance){toast('이 브라우저는 음성 읽기를 지원하지 않습니다.');return;}ttsVoices=window.speechSynthesis.getVoices();const voice=ttsChosenVoice();if(!voice){toast('한국어 TTS 음성을 기기 설정에서 설치한 후 다시 열어주세요.');return;}ttsQueue=speechSegments(items);const token=ttsToken;ttsPosition=0;
 const next=()=>{if(token!==ttsToken)return;if(ttsPosition>=ttsQueue.length){ttsStop(false);const el=document.getElementById('listen-status');if(el)el.textContent='재생 완료';return;}const text=ttsQueue[ttsPosition++],u=new SpeechSynthesisUtterance(text);ttsUtterance=u;u.voice=voice;u.lang='ko-KR';u.rate=ttsSettings().rate;u.pitch=1;u.onend=next;u.onerror=e=>{if(token!==ttsToken)return;ttsStop(false);toast('음성 재생 실패: '+e.error);};const bar=document.getElementById('listen-bar');bar.hidden=false;document.getElementById('listen-now').textContent=`${ttsPosition}/${ttsQueue.length} · ${text.slice(0,55)}`;bar.querySelector('[data-tts-pause]').textContent='일시정지';window.speechSynthesis.speak(u);};next();}
function ttsVoiceOptions(){const voice=ttsChosenVoice();return ttsVoices.filter(v=>/^ko(?:-|_)/i.test(v.lang)||v.lang==='ko').map(v=>`<option value="${esc(v.voiceURI)}" ${v.voiceURI===voice?.voiceURI?'selected':''}>${esc(v.name)}${v.localService?' · 기기 음성':' · 온라인 음성'}</option>`).join('')||'<option value="">한국어 음성 준비 중 / 미설치</option>';}
function renderListen(){const r=spokenRecord(),t=ttsSettings();return `${titleBlock('문제를 듣고, 정답 문장만 기억하기','오답 지문과 해설은 읽지 않습니다. 기본 1.5배속 · 음색은 미리 듣고 선택하세요.','LISTEN / QUESTION + CORRECT ANSWER')}${tabs()}<div class="listen-grid"><section class="panel listen-form"><h2>목소리와 속도</h2><label for="tts-voice">한국어 음성</label><select class="field" id="tts-voice">${ttsVoiceOptions()}</select><p class="small muted">제공되는 음성은 기기마다 다릅니다. 원하는 여성 음색을 미리듣기로 골라주세요.</p><label for="tts-rate">읽기 속도 <output id="tts-rate-label">${t.rate}배</output></label><input id="tts-rate" type="range" min="0.75" max="2" step="0.05" value="${t.rate}" style="width:100%"><div class="listen-controls"><button class="btn secondary" data-tts-preview>목소리 미리듣기</button><button class="btn secondary" data-tts-stop>정지</button></div><hr class="rule"><h3>바로 듣는 창작 연습</h3><p class="small muted">현재 과목의 문제 → 정답 지문 순서로 재생합니다.</p><div class="listen-controls"><button class="btn" data-tts-practice>현재 연습문제 듣기</button><button class="btn secondary" data-tts-practice-all>과목 연습 전체 듣기</button></div><div class="listen-status" id="listen-status" role="status"></div><div class="callout">모바일에서 첫 재생은 버튼을 눌러 시작하세요. 화면 잠금·백그라운드에서는 기기 정책에 따라 멈출 수 있습니다.</div></section><section class="panel listen-form"><h2>10개년 공식 기출 듣기</h2><div class="flex"><select class="field" id="tts-year" style="width:auto" aria-label="기출 연도">${EXAMS.map(y=>`<option value="${y.year}" ${y.year===state.year?'selected':''}>${y.year}년</option>`).join('')}</select><select class="field" id="tts-number" style="width:auto" aria-label="문제 번호">${Array.from({length:40},(_,i)=>examRange()[0]+i).map(n=>`<option value="${n}" ${n===state.examQuestion?'selected':''}>${n}번</option>`).join('')}</select></div><p class="small muted">PDF의 실제 문장과 ①~⑤ 지문을 등록하세요. 정답은 해당 연도의 최종답안표로 선택합니다. PDF 파일만으로는 아직 모든 문장을 자동으로 읽을 수 없습니다.</p><label for="tts-source">①~⑤가 포함된 문항 붙여넣기</label><textarea class="field" id="tts-source" placeholder="문제 문장
① 첫 번째 지문

⑤ 다섯 번째 지문"></textarea><button class="btn secondary" data-tts-parse>문제·선지 나누기</button><label for="tts-question">문제 문장</label><textarea id="tts-question" class="field">${esc(r.question)}</textarea>${[0,1,2,3,4].map(i=>`<label for="tts-option-${i}">${i+1}번 지문</label><textarea class="field" id="tts-option-${i}" rows="2">${esc(r.options?.[i]||'')}</textarea>`).join('')}<label><input type="checkbox" id="tts-verified" ${r.verified?'checked':''}> A형 원문과 문제·5개 지문을 대조했습니다</label><div class="listen-controls"><button class="btn secondary" data-tts-save>이 문항 저장</button><button class="btn" data-tts-official>문제 → 정답 지문 듣기</button><button class="btn secondary" data-tts-official-all>이 연도 등록 문항 이어듣기</button></div><p class="small muted">등록 문장은 로컬에 저장되며 학습기록 백업에 포함됩니다. 모든 정답 처리 문항은 건너뜁니다.</p></section></div><div class="install-note"><button class="chalk-plain-btn" data-install>휴대폰 웹앱 설치 안내</button>Android: 브라우저 메뉴 → 앱 설치 / 홈 화면 추가 · iPhone: Safari 공유 → 홈 화면에 추가<br>PC HTML 파일·휴대폰·웹주소의 학습기록은 각각의 브라우저에 저장됩니다. 다른 기기로 옮길 때 내 데이터에서 백업·불러오기를 사용하세요.</div>`;}
function ttsParse(text){const matches=[...text.matchAll(/[①②③④⑤]/g)];if(matches.length!==5||matches.map(x=>x[0]).join('')!=='①②③④⑤')throw Error('①②③④⑤ 순서의 지문 5개가 필요합니다. 직접 입력도 가능합니다.');return {question:text.slice(0,matches[0].index).trim(),options:matches.map((m,i)=>text.slice(m.index+1,matches[i+1]?.index??text.length).trim())};}

function setSubject(s){if(!CONTENT.subjects[s])return;state.subject=s;state.topicFilter='all';state.theoryIndex=0;state.flashShown=false;state.quizIndex=0;state.examQuestion=s==='estate'?1:41;state.compare=venns()[0].id;rs().id='';rs().number=s==='estate'?1:41;rs().step=0;rs().firstChoice=0;rs().retryChoice=0;rs().transferChoice=0;save();render();}
function markTheory(pass){const cs=filteredTheory();const c=cs[state.theoryIndex];if(!c)return;state.flashVisits[c.id]={correct:pass,at:Date.now()};state.reviews[c.id]=new Date(Date.now()+(pass?2*DAY:DAY)).toISOString();state.flashShown=false;if(state.theoryIndex<cs.length-1)state.theoryIndex++;save();render();toast(pass?'기억 완료 · 이틀 뒤 복습':'복습 예약 · 내일 다시 떠올리기');}
function markQuiz(val){const q=quizzes()[state.quizIndex];state.quizAnswers[q.id]=val;const id='quiz-'+q.id;if(val===q.ok){if(state.mistakes[id])state.mistakes[id].resolved=true;}else{state.mistakes[id]={id,type:'quiz',s:state.subject,label:q.q,topic:q.topic,answer:val,correct:String(q.ok),why:q.why,updated:Date.now(),resolved:false};}save();render();}
function gradeExam(){const ks=keyList(),yr=state.year;if(!ks){toast('최종정답을 먼저 등록해야 합니다.');return;}const [a,b]=examRange();for(let n=a;n<=b;n++){const ans=state.answers[`${yr}-${n}`],k=normalKey(ks[n-1]);const id=`exam-${yr}-${n}`;if(ans!=null&&!k.includes(Number(ans))){state.mistakes[id]={id,type:'exam',s:state.subject,year:yr,number:n,label:`${yr}년 제${yr-1989}회 ${n}번`,answer:ans,correct:k.join(' 또는 '),why:'공식 PDF의 '+n+'번 지문을 다시 확인하고 선택지 판단 근거를 메모하세요.',updated:Date.now(),resolved:false};}else if(state.mistakes[id])state.mistakes[id].resolved=true;}
state.graded[`${yr}-${state.subject}`]=true;save();render();const score=examScore(yr,state.subject);toast(`채점 완료 · ${score.correct}/40정답 · ${score.score}점 (미응답 포함)`);}

function importKeys(text){let toks=text.replace(/[,;|]+(?=\s)/g,' ').trim().split(/\s+/).filter(Boolean);if(toks.length===1&&/^[1-5]{80}$/.test(toks[0]))toks=toks[0].split('');if(toks.length!==80)throw new Error('정답은 80개여야 합니다. 현재 '+toks.length+'개입니다.');const vals=toks.map(x=>{if(!/^[1-5]([/,][1-5])*$/.test(x))throw new Error('정답 형식은 1~5 또는 2/4입니다. 잘못된 입력: '+x);return x.split(/[/,]/).map(Number);});state.importedKeys[state.year]=vals;state.graded[`${state.year}-${state.subject}`]=false;save();render();toast('80개 정답을 로컬에 저장했습니다. A형인지 확인하세요.');}
function download(name,mime,body){const b=new Blob([body],{type:mime});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),6000);}
function importBackup(file){if(!file)return;if(file.size>8*1024*1024){toast('백업 파일이 너무 큽니다.');return;}const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||typeof data!=='object'||!['estate','civil'].includes(data.subject)||!data.answers||!data.quizAnswers||!data.flashVisits)throw new Error('백업 형식이 올바르지 않습니다.');if(!confirm('현재 브라우저의 학습기록을 백업 파일 내용으로 교체하시겠습니까?'))return;const sanitized={...defaults};for(const k in defaults)if(Object.prototype.hasOwnProperty.call(data,k))sanitized[k]=data[k];state=sanitized;save();render();toast('학습기록을 불러왔습니다.');}catch(e){toast('가져오기 실패: '+e.message);}};reader.readAsText(file);}

if(what==='menu'){$('.sidebar').classList.toggle('open');return;}
if(what==='day-done'){const k=`${todayISO()}-${state.subject}`;state.studySubject[k]=!state.studySubject[k];save();render();toast(state.studySubject[k]?'오늘 과목 완료 표시':'완료 표시 해제');return;}
if(what==='flash-show'){state.flashShown=true;save();render();return;}
if(what==='flash-pass'||what==='flash-fail'){markTheory(what==='flash-pass');return;}
if(what==='flash-prev'||what==='flash-next'){state.theoryIndex=Math.max(0,Math.min(filteredTheory().length-1,state.theoryIndex+(what==='flash-prev'?-1:1)));state.flashShown=false;save();render();return;}
if(what==='quiz-prev'||what==='quiz-next'){state.quizIndex=Math.max(0,Math.min(quizzes().length-1,state.quizIndex+(what==='quiz-prev'?-1:1)));save();render();return;}
if(what==='quiz-clear'){if(confirm('이 과목의 연습문제 답안을 초기화할까요? 오답 메모는 유지됩니다.')){for(const q of quizzes())delete state.quizAnswers[q.id];state.quizIndex=0;save();render();}return;}
if(what==='pdf-toggle'){state.showPdf=!state.showPdf;save();render();return;}
if(what==='exam-prev'||what==='exam-next'){const [start,end]=examRange();state.examQuestion=Math.max(start,Math.min(end,state.examQuestion+(what==='exam-prev'?-1:1)));save();render();return;}
if(what==='exam-grade'){gradeExam();return;}
if(what==='exam-clear'){if(confirm(`${state.year}년 ${subject().short} 40문항의 마킹을 모두 지울까요?`)){const [a,b]=examRange();for(let n=a;n<=b;n++)delete state.answers[examMarkKey(n)];state.graded[`${state.year}-${state.subject}`]=false;save();render();}return;}
if(what==='key-import'){try{importKeys($('#key-import').value);}catch(e){toast(e.message);}return;}
if(what==='note-save'){const id=action.dataset.id;state.notes[id]=document.getElementById('note-'+id)?.value||'';save();toast('오답 메모가 저장되었습니다.');return;}
if(what==='wrong-resolve'){const id=action.dataset.id;if(state.mistakes[id]){state.mistakes[id].resolved=true;state.mistakes[id].updated=Date.now();save();render();toast('복습 완료 표시');}return;}
if(what==='review-concept'){const id=action.dataset.conceptId;state.view='theory';state.topicFilter='all';state.theoryIndex=theory().findIndex(x=>x.id===id);state.flashShown=false;save();render();window.scrollTo(0,0);return;}
if(what==='timer-toggle'){if(state.timerRunning){state.timerRemaining=timerLeft();state.timerRunning=false;state.timerEnd=0;}else{if(!timerLeft())state.timerRemaining=1500;state.timerEnd=Date.now()+state.timerRemaining*1000;state.timerRunning=true;}save();render();return;}
if(what==='timer-reset'){state.timerRemaining=1500;state.timerRunning=false;state.timerEnd=0;save();render();return;}
if(what==='backup'){download('ConceptKnot_학습기록_'+todayISO()+'.json','application/json;charset=utf-8',JSON.stringify(state,null,2));toast('학습기록 백업 파일을 생성했습니다.');return;}
if(what==='all-reset'){if(confirm('정말 전체 학습기록을 삭제하시겠습니까? 답안과 메모를 되돌릴 수 없습니다.')){state={...defaults,answers:{},graded:{},importedKeys:{},quizAnswers:{},flashVisits:{},reviews:{},mistakes:{},notes:{},dailyTotals:{},studySubject:{}};save();render();toast('이 브라우저의 학습기록이 초기화되었습니다.');}return;}
}
document.addEventListener('click',e=>doClick(e.target));
document.addEventListener('change',e=>{const t=e.target;if(t.id==='topic-select'){state.topicFilter=t.value;state.theoryIndex=0;state.flashShown=false;save();render();}else if(t.id==='pdf-upload'&&t.files?.[0]){const file=t.files[0];if(file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name)){toast('PDF 파일을 선택하세요.');return;}if(localPdfUrl)URL.revokeObjectURL(localPdfUrl);localPdfUrl=URL.createObjectURL(file);lastPdfYear=state.year;state.showPdf=true;render();toast('선택한 PDF를 이 브라우저에서 열었습니다.');}else if(t.id==='backup-file'&&t.files?.[0])importBackup(t.files[0]);});
document.addEventListener('keydown',e=>{
 const target=e.target;
 if(e.defaultPrevented||e.repeat||e.isComposing||e.keyCode===229||e.ctrlKey||e.metaKey||e.altKey||e.shiftKey||target?.closest?.('input,textarea,select,[contenteditable]:not([contenteditable="false"]),[role="textbox"]'))return;
 if(/^[1-5]$/.test(e.key)){
  const n=Number(e.key);
  const selectors={quiz:`[data-choice="${n}"]`,calc:`[data-calc-choice="${n}"]`,exam:`[data-exam-mark="${n}"]`,reverse:rs().mode==='official'?`[data-r-official-mark="${n}"]`:`[data-r-choice][data-r-val="${n}"]`};
  const button=selectors[state.view]&&[...document.querySelectorAll('#main '+selectors[state.view])].find(b=>!b.disabled&&b.getClientRects().length);
  if(button){e.preventDefault();button.click();}
 }else if(state.view==='exam'&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){
  e.preventDefault();document.querySelector(`[data-action="exam-${e.key==='ArrowLeft'?'prev':'next'}"]:not(:disabled)`)?.click();
 }
});
window.addEventListener('beforeunload',()=>{if(localPdfUrl)URL.revokeObjectURL(localPdfUrl);});
render();setInterval(timerTick,500);
})();

</script>
</body>
</html>
