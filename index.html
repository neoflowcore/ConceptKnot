  {id:'e10',s:'estate',t:'균형가격 판단',topic:'수요·공급·탄력성',fact:'수요 증가만 있을 때 일반적으로 균형가격과 균형거래량이 함께 오른다. 공급 증가만 있을 때 가격은 내리고 거래량은 오른다.',recall:'수요 증가+공급 불변, 가격과 수량 방향은?',answer:'가격 상승, 거래량 증가',trap:'수요와 공급이 동시에 움직이면 크기에 따라 한쪽 결과가 불확정일 수 있다.'},

  {id:'e12',s:'estate',t:'저량과 유량',topic:'시장·입지·도시',fact:'저량(stock)은 특정 시점에 측정하고, 유량(flow)은 일정 기간에 걸쳐 측정한다.',recall:'주택재고와 신규주택 공급량 중 저량은?',answer:'주택재고',trap:'재산·자본총량은 저량, 소득·거래량은 유량이다.'},
  {id:'e13',s:'estate',t:'리카도 차액지대설',topic:'시장·입지·도시',fact:'토지 비옥도의 차이와 한계지의 무지대 개념을 중점으로 본다.',recall:'리카도의 차액지대설에서 최열등지의 지대는?',answer:'한계지에서는 지대가 발생하지 않는다(이론상 무지대)',trap:'마르크스 절대지대설과 혼동하지 않는다.'},
  {id:'e14',s:'estate',t:'허프모형',topic:'시장·입지·도시',fact:'소비자 선택확률은 점포의 유인력(대개 규모)과 거리마찰에 의해 결정된다고 본다.',recall:'허프모형에서 일반적으로 거리가 멀어지면 선택확률은?',answer:'다른 조건 동일 시 낮아진다',trap:'확률의 분모는 경쟁점포 전체의 유인력 합이다.'},
  {id:'e15',s:'estate',t:'부동산 정책의 직접개입',topic:'정책·투자·금융',fact:'공영개발, 공공임대주택 공급, 토지은행 등은 시장에 직접 참여하는 유형이다.',recall:'공영개발사업은 직접개입인가 간접개입인가?',answer:'직접개입',trap:'조세·금융규제는 대표적인 간접개입 수단이다.'},
  {id:'e16',s:'estate',t:'현재가치 PV',topic:'정책·투자·금융',fact:'1년 후 금액의 현재가치 = 미래금액 ÷ (1+할인율). 할인율이 높을수록 현재가치는 낮아진다.',recall:'1년 후 110만 원을 할인율 10%로 할인하면 PV는?',answer:'100만 원',trap:'단위와 할인기간을 확인한다.'},
  {id:'e17',s:'estate',t:'순현재가치 NPV',topic:'정책·투자·금융',fact:'NPV = 현금유입 현재가치 합계 − 현금유출 현재가치 합계. 독립 투자안의 NPV가 양수이면 일반적으로 채택 가능하다.',recall:'현금유입 PV 120, 투자비 PV 100 → NPV는?',answer:'+20',trap:'내부수익률(IRR)과 혼동하지 않는다.'},
  {id:'e18',s:'estate',t:'LTV와 DTI',topic:'정책·투자·금융',fact:'LTV는 담보가치 대비 대출 비율, DTI는 소득 대비 연간 원리금 상환부담 비율의 개념이다.',recall:'LTV의 분모는 무엇인가?',answer:'담보가치',trap:'DSR·DTI·LTV는 분모와 포함 채무 범위가 서로 다르다.'},
  {id:'e19',s:'estate',t:'감정평가 3방식',topic:'감정평가',fact:'원가방식의 원가법, 비교방식의 거래사례비교법, 수익방식의 수익환원법을 구분한다.',recall:'수익성을 기준으로 가치를 추정하는 대표 방법은?',answer:'수익환원법',trap:'평가 3방식과 각각의 세부 기법을 혼동하지 않는다.'},
  {id:'e20',s:'estate',t:'환원율과 수익가격',topic:'감정평가',fact:'직접환원법의 단순형: 수익가격 = 순영업소득(NOI) ÷ 환원율.',recall:'NOI 1,000만 원, 환원율 5% → 가치는?',answer:'2억 원',trap:'총임대수입과 순영업소득을 혼동하지 않는다.'},
  {id:'c1',s:'civil',t:'법률행위와 의사표시',topic:'법률행위·의사표시',fact:'법률행위는 일정한 법률효과를 발생시키려는 의사표시를 필수요소로 한다.',recall:'법률행위의 필수 구성요소는?',answer:'의사표시',trap:'사실행위와 법률행위를 구분한다.'},
  {id:'c2',s:'civil',t:'비진의 의사표시',topic:'법률행위·의사표시',fact:'원칙적으로 표시한 대로 효력이 있으나, 상대방이 진의 아님을 알았거나 알 수 있었을 때 무효가 된다(민법 제107조).',recall:'비진의표시가 원칙적으로 유효한가?',answer:'원칙적으로 유효하다',trap:'상대방의 악의·과실과 선의의 제3자 보호를 구분한다.'},
  {id:'c3',s:'civil',t:'통정허위표시',topic:'법률행위·의사표시',fact:'상대방과 통정한 허위 의사표시는 무효. 이 무효로 선의의 제3자에게 대항하지 못한다(민법 제108조).',recall:'통정허위표시의 당사자 사이 효력은?',answer:'무효',trap:'제3자의 보호에서 선의인지가 중요하다.'},
  {id:'c4',s:'civil',t:'착오로 인한 의사표시',topic:'법률행위·의사표시',fact:'법률행위 내용의 중요부분에 착오가 있는 경우 원칙적으로 취소할 수 있다. 표의자에게 중대한 과실이 있으면 제한된다(민법 제109조).',recall:'중요부분의 착오가 있으면 원칙적으로 무효인가 취소인가?',answer:'취소할 수 있다',trap:'동기의 착오·중과실·상대방 사정을 별도로 검토한다.'},
  {id:'c5',s:'civil',t:'사기·강박 의사표시',topic:'법률행위·의사표시',fact:'사기나 강박에 의한 의사표시는 취소할 수 있다(민법 제110조).',recall:'사기에 의한 계약은 처음부터 당연무효인가?',answer:'아니다. 원칙적으로 취소할 수 있는 법률행위다.',trap:'제3자에 의한 사기와 강박의 요건은 다르다.'},
  {id:'c6',s:'civil',t:'무효 vs 취소',topic:'대리·무효·취소',fact:'무효는 처음부터 효력이 없는 것이고, 취소할 수 있는 행위는 취소 전까지 유효하게 취급되나 취소 시 소급하여 무효로 본다(민법 제141조).',recall:'취소된 법률행위는 언제부터 무효인 것으로 보는가?',answer:'처음부터',trap:'무효행위의 추인과 취소할 수 있는 행위의 추인은 구분한다.'},
  {id:'c7',s:'civil',t:'대리의 효과',topic:'대리·무효·취소',fact:'적법한 대리인이 권한 내에서 본인을 위한 것임을 표시하고 한 의사표시는 원칙적으로 직접 본인에게 효력이 생긴다(민법 제114조).',recall:'적법한 대리행위의 효과는 누구에게 귀속되는가?',answer:'본인',trap:'현명주의 예외와 무권대리를 구분한다.'},
  {id:'c8',s:'civil',t:'무권대리와 추인',topic:'대리·무효·취소',fact:'대리권 없이 체결한 계약은 본인의 추인이 없으면 본인에 대해 효력이 생기지 않는다(민법 제130조).',recall:'무권대리 계약을 본인에게 귀속시키는 행위는?',answer:'본인의 추인',trap:'표현대리와 무권대리인의 책임은 별개이다.'},
  {id:'c9',s:'civil',t:'소유권 vs 점유권',topic:'물권·등기·점유',fact:'소유권은 사용·수익·처분 권능을 가진 물권, 점유권은 물건을 사실상 지배하는 상태에 기초한 권리다.',recall:'물건을 직접 지배하지만 소유자는 아닌 상태에 해당하는 것은?',answer:'점유',trap:'점유자라고 항상 소유자가 되는 것은 아니다.'},
  {id:'c10',s:'civil',t:'부동산 물권변동과 등기',topic:'물권·등기·점유',fact:'법률행위로 인한 부동산 물권변동은 원칙적으로 등기해야 효력이 생긴다(민법 제186조).',recall:'매매로 소유권을 취득하려면 원칙적으로 필요한 공시는?',answer:'등기',trap:'상속 등 법률규정에 의한 물권취득은 별도로 본다(민법 제187조).'},
  {id:'c11',s:'civil',t:'상속에 의한 물권취득',topic:'물권·등기·점유',fact:'상속 등 법률규정에 의한 부동산 물권취득은 등기 없이도 효력이 생길 수 있지만, 처분을 위해 등기가 필요하다(민법 제187조).',recall:'상속으로 부동산을 취득할 때 등기 없으면 효력이 없는가?',answer:'취득 자체는 등기 없이 가능(처분에는 등기 필요)',trap:'법률행위에 의한 취득과 혼동하지 않는다.'},
  {id:'c12',s:'civil',t:'물권적 청구권',topic:'물권·등기·점유',fact:'소유자는 소유물반환청구, 방해제거 및 방해예방청구 등으로 권리를 보호할 수 있다(민법 제213·214조).',recall:'소유권을 방해하는 상태의 제거를 구하는 권리는?',answer:'소유물방해제거청구권',trap:'손해배상청구권과 물권적 청구권은 요건이 다르다.'},
  {id:'c13',s:'civil',t:'계약의 성립',topic:'계약·매매·임대차',fact:'계약은 원칙적으로 서로 대응하는 청약과 승낙의 합치로 성립한다.',recall:'계약 성립에 기본적으로 필요한 두 의사표시는?',answer:'청약과 승낙',trap:'청약의 유인과 청약을 구분한다.'},
  {id:'c14',s:'civil',t:'계약금 해제',topic:'계약·매매·임대차',fact:'별도 약정이 없고 일방이 이행에 착수하기 전에는 교부자는 계약금을 포기하고 수령자는 배액을 상환하여 해제할 수 있다(민법 제565조).',recall:'계약금 해제에서 계약금을 받은 사람이 하는 것은?',answer:'계약금 배액의 상환',trap:'손해배상 예정과 계약금 해제는 다르다.'},
  {id:'c15',s:'civil',t:'동시이행의 항변권',topic:'계약·매매·임대차',fact:'쌍무계약에서 상대방이 이행을 제공할 때까지 자기 채무 이행을 거절할 수 있는 권리(민법 제536조).',recall:'매매대금 지급과 소유권 이전이 맞물리는 항변권은?',answer:'동시이행의 항변권',trap:'상대방의 채무가 변제기에 있지 않다면 단순 적용할 수 없다.'},

  {id:'c17',s:'civil',t:'임대차의 기본 구조',topic:'계약·매매·임대차',fact:'임대인은 목적물을 사용·수익하게 할 의무가 있고 임차인은 차임 지급의무가 있다(민법 제618조).',recall:'임대차에서 임차인의 대표 의무는?',answer:'차임 지급',trap:'전세권(물권)과 임대차(채권)를 구분한다.'},
  {id:'c18',s:'civil',t:'전세권과 임대차',topic:'민사특별법',fact:'전세권은 물권으로 등기가 공시수단이며, 임대차는 채권계약이다. 주택임대차보호법은 일정 요건에 대항력을 부여한다.',recall:'전세권과 임대차 중 물권은?',answer:'전세권',trap:'보증금 있는 임대차를 모두 전세권이라고 부르지 않는다.'},
  {id:'c19',s:'civil',t:'주택임대차의 대항력',topic:'민사특별법',fact:'주택의 인도와 주민등록을 마친 때 그 다음 날부터 제3자에 대하여 효력이 생긴다(주택임대차보호법 제3조).',recall:'주택임차인의 대항력 취득의 기본 요건 두 가지는?',answer:'주택 인도와 주민등록',trap:'우선변제권에는 확정일자 등 별도 요건이 있다.'},
  {id:'c20',s:'civil',t:'가등기담보와 명의신탁',topic:'민사특별법',fact:'가등기담보법과 부동산실명법은 민사특별법 학습에서 별개 법률로 정리한다.',recall:'담보가등기와 부동산 명의신탁에 주로 적용되는 법률은 같은가?',answer:'다르다. 가등기담보법 / 부동산실명법',trap:'법률별 요건·제재·예외를 섞어 기억하지 않는다.'}

<div class="bubble-grid">${Array.from({length:40},(_,i)=>start+i).map(i=>`<button class="bubble ${state.examQuestion===i?'current':''} ${state.answers[`${yr}-${i}`]!=null?'marked':''} ${graded&&key&&state.answers[`${yr}-${i}`]!=null?(isCorrect(i,state.answers[`${yr}-${i}`])?'correct':'incorrect'):''}" data-exam-question="${i}" title="${i}번">${i}</button>`).join('')}</div>
<div class="answer-box"><div class="flex flex-between"><div class="answer-large">${n}번 문제</div><span class="muted small">${answer!=null?'선택 '+answer+'번':'아직 미선택'}</span></div><p class="small muted">왼쪽 문제지의 <strong>${n}번</strong>을 읽고 답을 선택하세요.</p><div class="bubble-options">${[1,2,3,4,5].map(i=>`<button class="bubble-opt ${answer===i?'picked':''}" data-exam-mark="${i}" aria-label="${i}번 선택">${i}</button>`).join('')}</div><div class="exam-nav"><button class="btn secondary" data-action="exam-prev" ${n===start?'disabled':''}>← 이전</button><span class="muted small">${n-start+1} / 40</span><button class="btn secondary" data-action="exam-next" ${n===end?'disabled':''}>다음 →</button></div></div>
${result?`<div class="score-result ${result.score<60?'red':''}"><div class="small muted">${yr} ${subject().short} 점수 (${done}/40 응답)</div><div class="score-number">${result.score.toFixed(1)}점</div><div class="detail">정답 ${result.correct}/40 · 오답/미응답 ${40-result.correct}개${done<40?' · 미완료 상태':' · 40문항 완료'}</div></div>`:''}
<div class="separator"></div><div class="flex" style="gap:7px;flex-wrap:wrap"><button class="btn" data-action="exam-grade" ${!key?'disabled title="해당 회차 정답을 먼저 등록해주세요"':''}>${key?'답안 채점하기':'정답 등록 후 채점'}</button><button class="btn secondary" data-action="exam-clear">마킹 초기화</button></div>
${graded&&key?`<div class="small muted" style="margin-top:13px">${n}번 최종정답: <strong>${normalKey(key[n-1]).join(' 또는 ')}번</strong> · ${answer!=null?(isCorrect(n,answer)?'맞았습니다':'틀렸습니다'):'미응답'}</div>`:''}
${!key?`<div class="callout warn" style="margin-top:13px">${yr}년도 정답은 아직 앱에 입력되지 않았습니다. 공식 정답 PDF를 확인한 뒤 아래에 정답을 등록하면 자동 채점할 수 있습니다. 없는 정답을 추측하지 않습니다.</div><details style="margin-top:13px"><summary class="bold" style="cursor:pointer">정답 80개 직접 등록</summary><p class="small muted">1~80번 순서로 숫자 80개를 공백으로 구분해 입력하세요. 복수정답은 해당 칸에서 2/4처럼 표시할 수 있습니다.</p><textarea id="key-import" class="field" rows="4" placeholder="예: 3 2 5 4 1 ... (총 80개)"></textarea><button class="btn" data-action="key-import" style="margin-top:9px">입력한 80개 정답 저장</button></details>`:''}</section></div>
<div class="callout warn" style="margin-top:18px"><strong>중요:</strong> 정답은 A형 기준입니다. PDF가 A·B형을 동시에 포함하거나 번호가 다르면 A형 문항에 맞춰 마킹하세요. 2020~2025년만 앱에서 검토한 최종정답으로 자동 채점합니다. 만점 기준 40문항 × 2.5점.</div>${navSource()}`;}
function examScore(y,s){const [a,b]=s==='estate'?[1,40]:[41,80];const keys=state.importedKeys[y]||KEYS[y];let correct=0;for(let i=a;i<=b;i++)if(state.answers[`${y}-${i}`]!=null&&normalKey(keys[i-1]).includes(Number(state.answers[`${y}-${i}`])))correct++;return {correct,score:correct*2.5};}
function renderVenn(){const c=venns().find(x=>x.id===state.compare)||venns()[0];if(c.s!==state.subject){state.compare=venns()[0].id;return renderVenn();}const li=(arr)=>arr.map(x=>`<li>${esc(x)}</li>`).join('');return `${titleBlock('헷갈리는 개념 한눈에 비교','같은 점과 다른 점을 분리해서 보면 선택지의 함정을 더 빨리 구별할 수 있습니다.','VISUAL MEMORY / VENN')}${tabs()}
<div class="year-row">${venns().map(v=>`<button class="year-tab ${c.id===v.id?'active':''}" data-compare="${v.id}">${esc(v.title)}</button>`).join('')}</div><div class="venn-box"><div class="flex flex-between"><h2>${esc(c.title)}</h2><span class="pill purple">차이 + 공통점</span></div><div class="venn-stage" role="img" aria-label="${esc(c.leftTitle)}와 ${esc(c.rightTitle)}의 공통점 및 차이"><div class="venn-circle left"><div class="venn-inner"><h4>${esc(c.leftTitle)}</h4>${c.left.slice(0,2).map(x=>`<div>${esc(x)}</div>`).join('')}</div></div><div class="venn-circle right"><div class="venn-inner"><h4>${esc(c.rightTitle)}</h4>${c.right.slice(0,2).map(x=>`<div>${esc(x)}</div>`).join('')}</div></div><div class="venn-center">공통 영역<br>${esc(c.mid[0])}<br>${esc(c.mid[1]||'')}</div></div><div class="venn-info-grid"><div class="venn-info"><strong>${esc(c.leftTitle)}</strong><ul>${li(c.left)}</ul></div><div class="venn-info"><strong>공통점</strong><ul>${li(c.mid)}</ul></div><div class="venn-info"><strong>${esc(c.rightTitle)}</strong><ul>${li(c.right)}</ul></div></div></div><div class="callout" style="margin-top:17px">학습 방법: 두 개념의 이름을 가리고 차이점을 2개씩 떠올리세요. 다음에 공통점을 1개 설명하세요. 읽기만 하는 것보다 스스로 설명하는 연습을 권합니다.</div><div style="margin-top:17px">${btn('연습문제로 확인하기 →','quiz','btn')}</div>${navSource()}`;}
function renderWrong(){const all=Object.values(state.mistakes).filter(Boolean);const filtered=all.filter(x=>x.s===state.subject);const due=theory().filter(x=>state.reviews[x.id]&&new Date(state.reviews[x.id]).getTime()<=Date.now());const existing=filtered.filter(x=>!x.resolved);return `${titleBlock('오답 노트 · 약점만 다시 보기','정답을 맞힌 횟수보다 왜 틀렸는지 설명할 수 있는지가 중요합니다.','ERROR ANALYSIS / RETRIEVAL')}${tabs()}<div class="compact-grid"><div class="panel">${stat(existing.length,'미해결 오답 · 현재 과목')}<p class="small muted">실전 기출 채점 오답과 자체 연습 오답을 합산합니다.</p></div><div class="panel">${stat(due.length,'복습 시점이 된 개념')}<p class="small muted">능동회상에서 ‘다시 외우기’로 등록한 카드입니다.</p></div></div>
<div class="section-heading"><h2>틀린 문제와 메모</h2></div>${existing.length?`<div class="stack">${existing.sort((a,b)=>(b.updated||0)-(a.updated||0)).map((x)=>`<div class="mistake-item"><div class="badge-line"><span class="pill ${x.type==='exam'?'orange':'purple'}">${x.type==='exam'?'실제 기출 OMR':'기출형 연습'}</span><span class="muted tiny">${x.type==='exam'?`${x.year}년 ${x.number}번`:esc(x.topic||'핵심개념')}</span></div><h3>${esc(x.label)}</h3><p>내 답: ${x.answer||'-'}번 · 정답: ${esc(x.correct)}</p>${x.why?`<div class="small">${esc(x.why)}</div>`:''}<label class="field-label" for="note-${esc(x.id)}">오답 원인 / 다시 외울 핵심</label><textarea class="note-area" id="note-${esc(x.id)}" data-note="${esc(x.id)}" rows="2" placeholder="예: 문제의 '아닌 것은'을 놓침">${esc(state.notes[x.id]||'')}</textarea><div class="flex flex-between" style="gap:9px;flex-wrap:wrap"><button class="btn secondary" data-action="note-save" data-id="${esc(x.id)}">메모 저장</button><button class="btn" data-action="wrong-resolve" data-id="${esc(x.id)}">✓ 복습 완료</button></div></div>`).join('')}</div>`:`<div class="empty">아직 등록된 미해결 오답이 없습니다. 기출 OMR을 채점하거나 연습문제를 풀어보세요.<div style="margin-top:18px">${btn('연습문제 풀기','quiz','btn')}</div></div>`}
<div class="section-heading"><h2>오늘 복습할 개념 ${due.length}개</h2></div>${due.length?`<div class="stack">${due.map(x=>`<div class="note-item"><strong>${esc(x.t)}</strong><p>${esc(x.recall)}</p><div class="flex flex-between"><span class="small muted">오늘 복습</span><button class="panel-link" data-action="review-concept" data-concept-id="${x.id}">카드에서 확인 →</button></div></div>`).join('')}</div>`:`<div class="callout">복습 기한이 지난 이론 카드가 없습니다. '핵심이론' 메뉴의 회상 테스트를 이어가세요.</div>`}${navSource()}`;}
function renderPlan(){const plan=[['10.27','오늘','준비 + 약점 파악','각 과목 개념 미리보기, 한 과목 선택'],['10.28','수요일','부동산학개론 집중','핵심 20개 → 기출 40문항 → 오답'],['10.29','목요일','민법 및 민사특별법 집중','핵심 20개 → 기출 40문항 → 오답'],['10.30','금요일','실전 반복 / 약점 재학습','오답, 2025·2024 기출, 두 과목 점수 보완'],['10.31','토요일','시험 당일','새 이론 최소화, 실수 포인트만 확인']];return `${titleBlock('시험일까지 4일 압축 플랜','10월 28일부터 하루 한 과목씩 집중하고, 마지막 날은 오답과 실전 모의로 마무리합니다.','FOUR-DAY FOCUS')}${tabs()}
<div class="calendar-grid">${plan.map((p,i)=>`<div class="day-card ${i===0?'today':''} ${i===4?'exam-day':''}"><div class="small">${p[0]} · ${p[1]}</div><div class="day-num">${i===0?'D-4':i===4?'D-DAY':`D-${4-i}`}</div><strong>${p[2]}</strong><p class="small" style="margin-top:7px">${p[3]}</p></div>`).join('')}</div>
<div class="section-heading"><h2>하루 한 과목 시간표</h2></div><div class="dashboard-grid"><section class="panel">${[['0~35분','핵심이론 20개 능동회상','기억이 안 나면 바로 답을 보지 말고 10초 더 떠올려보기'],['35~50분','비교 다이어그램','공통점·차이점 설명하기'],['50~100분','공식 기출 40문항','한 과목 실전 속도로 문제지 읽고 OMR 체크'],['100~120분','오답 분류','틀린 이유 1문장, 다시 복습할 개념 표시']].map(([a,b,c])=>`<div class="study-row"><span class="step-round" style="font-size:10px">${a.split('~')[0]}</span><div><strong>${b}</strong><div class="detail muted">${c}</div></div><span class="pill">${a}</span></div>`).join('')}</section><section class="panel"><h3>최저점 방어 전략</h3><p>1차는 두 과목 모두 <strong>40점 이상</strong>이면서 평균 <strong>60점 이상</strong>이어야 합니다. 한 과목에만 시간을 몰아주지 마세요.</p><div class="callout warn">학습 시간을 짧게 잡아도 10개년 모두 무작정 풀기보다 최근 2개년부터 풀고, 약점 유형이 확인되면 해당 연도 문제를 추가하세요.</div><h3 style="margin-top:20px">우선 실행 순서</h3><div class="stack">${btn('부동산학개론 시작','theory','btn')}${btn('민법 기출 답안지','exam','btn secondary')}${btn('오답 복습 열기','wrong','btn secondary')}</div></section></div>${navSource()}`;}
function renderSettings(){const byteSize=new Blob([JSON.stringify(state)]).size;return `${titleBlock('내 학습기록 관리','로그인과 서버 없이 이 브라우저에 저장됩니다. 시험 전 백업을 권장합니다.','DATA / PRIVACY')}
<div class="settings-grid"><section class="panel"><h3>학습기록 백업</h3><p class="muted small">이론 기억상태, 연습 답안, 기출 OMR, 오답메모와 타이머 설정이 JSON 한 파일로 저장됩니다.</p><div class="callout">현재 브라우저 기록 약 ${(byteSize/1024).toFixed(1)}KB · 오프라인 학습 가능 (기출 원문 외부 PDF는 인터넷 필요).</div><div class="stack" style="margin-top:14px"><button class="btn" data-action="backup">내 학습 데이터 다운로드</button><label class="field-label" for="backup-file">백업 불러오기 (같은 형식 JSON)</label><input class="field" id="backup-file" type="file" accept="application/json,.json"></div></section><section class="panel"><h3>기출 출처와 이용 주의</h3><p class="small">공식 기출은 Q-Net 자료 링크와 제3자 공개 PDF로 열며, 문제 원문을 자체 데이터로 복제하지 않았습니다. 연습문제 30개는 학습용 창작 문제입니다.</p><p class="small">2020~2025년 A형 정답 480개 채점 지원 · 2016~2019년은 원문 열람/마킹 및 정답 직접 입력 기능.</p><p class="small">변경될 수 있는 법령·판례는 최신 출제기준과 공식 법령에서 재확인해야 합니다. 데이터가 서버로 업로드되지 않습니다.</p><div class="callout warn">브라우저 사이트 데이터를 지우면 저장한 답안도 사라집니다. 시험 전 백업 파일을 내려받으세요.</div></section></div><div class="panel" style="margin-top:17px"><h3>기록 초기화</h3><p class="muted small">모든 학습 답안과 진도·오답 메모가 이 브라우저에서 삭제됩니다. 이 작업은 되돌릴 수 없습니다.</p><button class="btn danger" data-action="all-reset">모든 로컬 학습기록 삭제</button></div>${navSource()}`;}
function render(){renderNav();const renderers={home:renderHome,theory:renderTheory,quiz:renderQuiz,exam:renderExam,venn:renderVenn,wrong:renderWrong,plan:renderPlan,settings:renderSettings};$('#main').innerHTML=renderers[state.view]();refreshTimerDisplay();}
function setSubject(s){if(!CONTENT.subjects[s])return;state.subject=s;state.topicFilter='all';state.theoryIndex=0;state.flashShown=false;state.quizIndex=0;state.examQuestion=s==='estate'?1:41;state.compare=venns()[0].id;save();render();}
function markTheory(pass){const cs=filteredTheory();const c=cs[state.theoryIndex];if(!c)return;state.flashVisits[c.id]={correct:pass,at:Date.now()};state.reviews[c.id]=new Date(Date.now()+(pass?2*DAY:DAY)).toISOString();state.flashShown=false;if(state.theoryIndex<cs.length-1)state.theoryIndex++;save();render();toast(pass?'기억 완료 · 이틀 뒤 복습':'복습 예약 · 내일 다시 떠올리기');}
function markQuiz(val){const q=quizzes()[state.quizIndex];state.quizAnswers[q.id]=val;const id='quiz-'+q.id;if(val===q.ok){if(state.mistakes[id])state.mistakes[id].resolved=true;}else{state.mistakes[id]={id,type:'quiz',s:state.subject,label:q.q,topic:q.topic,answer:val,correct:String(q.ok),why:q.why,updated:Date.now(),resolved:false};}save();render();}
function gradeExam(){const ks=keyList(),yr=state.year;if(!ks){toast('최종정답을 먼저 등록해야 합니다.');return;}const [a,b]=examRange();for(let n=a;n<=b;n++){const ans=state.answers[`${yr}-${n}`],k=normalKey(ks[n-1]);const id=`exam-${yr}-${n}`;if(ans!=null&&!k.includes(Number(ans))){state.mistakes[id]={id,type:'exam',s:state.subject,year:yr,number:n,label:`${yr}년 제${yr-1989}회 ${n}번`,answer:ans,correct:k.join(' 또는 '),why:'공식 PDF의 '+n+'번 지문을 다시 확인하고 선택지 판단 근거를 메모하세요.',updated:Date.now(),resolved:false};}else if(state.mistakes[id])state.mistakes[id].resolved=true;}
state.graded[`${yr}-${state.subject}`]=true;save();render();const score=examScore(yr,state.subject);toast(`채점 완료 · ${score.correct}/40정답 · ${score.score}점 (미응답 포함)`);}
function timerLeft(){return state.timerRunning?Math.max(0,Math.ceil((state.timerEnd-Date.now())/1000)):Math.max(0,Number(state.timerRemaining)||0);}
function clock(s){s=Math.max(0,s);return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;}
function refreshTimerDisplay(){const t=$('#timer-display');if(t)t.textContent=clock(timerLeft());}
function timerTick(){if(!state.timerRunning)return;refreshTimerDisplay();if(timerLeft()<=0){state.timerRunning=false;state.timerRemaining=1500;state.timerEnd=0;state.pomodoros++;state.dailyTotals[todayISO()]=(state.dailyTotals[todayISO()]||0)+1;save();render();toast('집중 세션 완료! 다음엔 기억 테스트를 풀어보세요.');}}
function importKeys(text){let toks=text.replace(/[,;|]+(?=\s)/g,' ').trim().split(/\s+/).filter(Boolean);if(toks.length===1&&/^[1-5]{80}$/.test(toks[0]))toks=toks[0].split('');if(toks.length!==80)throw new Error('정답은 80개여야 합니다. 현재 '+toks.length+'개입니다.');const vals=toks.map(x=>{if(!/^[1-5]([/,][1-5])*$/.test(x))throw new Error('정답 형식은 1~5 또는 2/4입니다. 잘못된 입력: '+x);return x.split(/[/,]/).map(Number);});state.importedKeys[state.year]=vals;state.graded[`${state.year}-${state.subject}`]=false;save();render();toast('80개 정답을 로컬에 저장했습니다. A형인지 확인하세요.');}
function download(name,mime,body){const b=new Blob([body],{type:mime});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),6000);}
function importBackup(file){if(!file)return;if(file.size>8*1024*1024){toast('백업 파일이 너무 큽니다.');return;}const reader=new FileReader();reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data||typeof data!=='object'||!['estate','civil'].includes(data.subject)||!data.answers||!data.quizAnswers||!data.flashVisits)throw new Error('백업 형식이 올바르지 않습니다.');if(!confirm('현재 브라우저의 학습기록을 백업 파일 내용으로 교체하시겠습니까?'))return;const sanitized={...defaults};for(const k in defaults)if(Object.prototype.hasOwnProperty.call(data,k))sanitized[k]=data[k];state=sanitized;save();render();toast('학습기록을 불러왔습니다.');}catch(e){toast('가져오기 실패: '+e.message);}};reader.readAsText(file);}
function doClick(t){const go=t.closest('[data-go]');if(go){changeView(go.dataset.go);return;}const subj=t.closest('[data-subject]');if(subj){setSubject(subj.dataset.subject);return;}const yr=t.closest('[data-year]');if(yr){const y=Number(yr.dataset.year);state.year=y;state.examQuestion=state.subject==='estate'?1:41;if(localPdfUrl){URL.revokeObjectURL(localPdfUrl);localPdfUrl=null;}state.showPdf=true;save();render();return;}
const comp=t.closest('[data-compare]');if(comp){state.compare=comp.dataset.compare;save();render();return;}
const concept=t.closest('[data-concept]');if(concept){state.theoryIndex=Number(concept.dataset.concept);state.flashShown=false;save();render();return;}
const qbtn=t.closest('[data-quiz]');if(qbtn){state.quizIndex=Number(qbtn.dataset.quiz);save();render();return;}
const ch=t.closest('[data-choice]');if(ch){markQuiz(Number(ch.dataset.choice));return;}
const q=t.closest('[data-exam-question]');if(q){state.examQuestion=Number(q.dataset.examQuestion);save();render();return;}
const opt=t.closest('[data-exam-mark]');if(opt){state.answers[examMarkKey(state.examQuestion)]=Number(opt.dataset.examMark);state.graded[`${state.year}-${state.subject}`]=false;const [start,end]=examRange();if(state.examQuestion<end)state.examQuestion++;save();render();return;}
const minutes=t.closest('[data-minutes]');if(minutes){state.timerRemaining=Number(minutes.dataset.minutes)*60;state.timerRunning=false;state.timerEnd=0;save();render();return;}
const action=t.closest('[data-action]');if(!action)return;const what=action.dataset.action;
if(what==='menu'){$('.sidebar').classList.toggle('open');return;}
if(what==='day-done'){const k=`${todayISO()}-${state.subject}`;state.studySubject[k]=!state.studySubject[k];save();render();toast(state.studySubject[k]?'오늘 과목 완료 표시':'완료 표시 해제');return;}
if(what==='flash-show'){state.flashShown=true;save();render();return;}
if(what==='flash-pass'||what==='flash-fail'){markTheory(what==='flash-pass');return;}
if(what==='flash-prev'||what==='flash-next'){state.theoryIndex=Math.max(0,Math.min(filteredTheory().length-1,state.theoryIndex+(what==='flash-prev'?-1:1)));state.flashShown=false;save();render();return;}
if(what==='quiz-prev'||what==='quiz-next'){state.quizIndex=Math.max(0,Math.min(quizzes().length-1,state.quizIndex+(what==='quiz-prev'?-1:1)));save();render();return;}
if(what==='quiz-clear'){if(confirm('이 과목의 연습문제 답안을 초기화할까요? 오답 메모는 유지됩니다.')){for(const q of quizzes())delete state.quizAnswers[q.id];state.quizIndex=0;save();render();}return;}
if(what==='pdf-toggle'){state.showPdf=!state.showPdf;save();render();return;}
if(what==='exam-prev'||what==='exam-next'){const [start,end]=examRange();state.examQuestion=Math.max(start,Math.min(end,state.examQuestion+(what==='exam-prev'?-1:1)));save();render();return;}
if(what==='exam-grade'){gradeExam();return;}
if(what==='exam-clear'){if(confirm(`${state.year}년 ${subject().short} 40문항의 마킹을 모두 지울까요?`)){const [a,b]=examRange();for(let n=a;n<=b;n++)delete state.answers[examMarkKey(n)];state.graded[`${state.year}-${state.subject}`]=false;save();render();}return;}
if(what==='key-import'){try{importKeys($('#key-import').value);}catch(e){toast(e.message);}return;}
if(what==='note-save'){const id=action.dataset.id;state.notes[id]=document.getElementById('note-'+id)?.value||'';save();toast('오답 메모가 저장되었습니다.');return;}
if(what==='wrong-resolve'){const id=action.dataset.id;if(state.mistakes[id]){state.mistakes[id].resolved=true;state.mistakes[id].updated=Date.now();save();render();toast('복습 완료 표시');}return;}
if(what==='review-concept'){const id=action.dataset.conceptId;state.view='theory';state.topicFilter='all';state.theoryIndex=theory().findIndex(x=>x.id===id);state.flashShown=false;save();render();window.scrollTo(0,0);return;}
if(what==='timer-toggle'){if(state.timerRunning){state.timerRemaining=timerLeft();state.timerRunning=false;state.timerEnd=0;}else{if(!timerLeft())state.timerRemaining=1500;state.timerEnd=Date.now()+state.timerRemaining*1000;state.timerRunning=true;}save();render();return;}
if(what==='timer-reset'){state.timerRemaining=1500;state.timerRunning=false;state.timerEnd=0;save();render();return;}
if(what==='backup'){download('RECALLGRAPH_학습기록_'+todayISO()+'.json','application/json;charset=utf-8',JSON.stringify(state,null,2));toast('학습기록 백업 파일을 생성했습니다.');return;}
if(what==='all-reset'){if(confirm('정말 전체 학습기록을 삭제하시겠습니까? 답안과 메모를 되돌릴 수 없습니다.')){state={...defaults,answers:{},graded:{},importedKeys:{},quizAnswers:{},flashVisits:{},reviews:{},mistakes:{},notes:{},dailyTotals:{},studySubject:{}};save();render();toast('이 브라우저의 학습기록이 초기화되었습니다.');}return;}
}
document.addEventListener('click',e=>doClick(e.target));
document.addEventListener('change',e=>{const t=e.target;if(t.id==='topic-select'){state.topicFilter=t.value;state.theoryIndex=0;state.flashShown=false;save();render();}else if(t.id==='pdf-upload'&&t.files?.[0]){const file=t.files[0];if(file.type!=='application/pdf'&&!/\.pdf$/i.test(file.name)){toast('PDF 파일을 선택하세요.');return;}if(localPdfUrl)URL.revokeObjectURL(localPdfUrl);localPdfUrl=URL.createObjectURL(file);lastPdfYear=state.year;state.showPdf=true;render();toast('선택한 PDF를 이 브라우저에서 열었습니다.');}else if(t.id==='backup-file'&&t.files?.[0])importBackup(t.files[0]);});
document.addEventListener('keydown',e=>{if(state.view!=='exam'||e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(/^[1-5]$/.test(e.key)){state.answers[examMarkKey(state.examQuestion)]=Number(e.key);state.graded[`${state.year}-${state.subject}`]=false;const [a,b]=examRange();if(state.examQuestion<b)state.examQuestion++;save();render();}else if(e.key==='ArrowLeft'||e.key==='ArrowRight'){const [a,b]=examRange();state.examQuestion=Math.max(a,Math.min(b,state.examQuestion+(e.key==='ArrowLeft'?-1:1)));save();render();}});
window.addEventListener('beforeunload',()=>{if(localPdfUrl)URL.revokeObjectURL(localPdfUrl);});
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
render();setInterval(timerTick,500);
})();

</script>
</body>
</html>
