 열세하고, 다른 조건은 동일함(상승식으로 계산할 것)\n○ 그 밖의 요인 보정치: 1.50","options":["9,240,000","11,340,000","13,860,000","17,010,000","20,790,000"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/40","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-40","score":0.9577,"pdfChars":459,"mirrorChars":415},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-41":{"id":"2021-41","year":2021,"number":41,"subject":"civil","question":"상대방 있는 단독행위에 해당하지 않는 것은?(다툼이 있으면 판례에 따름)","options":["공유지분의 포기","무권대리행위의 추인","상계의 의사표시","취득시효 이익의 포기","재단법인의 설립행위"],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/41","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-41","score":1.0,"pdfChars":102,"mirrorChars":97},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-42":{"id":"2021-42","year":2021,"number":42,"subject":"civil","question":"甲은 자기 소유 X토지를 매도하기 위해 乙에게 대리권을 수여하였다. 이후 乙은 丙을 복대리인으로 선임하였고, 丙은 甲을 대리하여 X토지를 매도하였다. 이에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["丙은 甲의 대리인임과 동시에 乙의 대리인이다.","X토지의 매매계약이 갖는 성질상 乙에 의한 처리가 필요하지 않다면, 특별한 사정이 없는 한 丙의 선임에 관하여 묵시적 승낙이 있는 것으로 보는 것이 타당하다.","乙이 甲의 승낙을 얻어 丙을 선임한 경우 乙은 甲에 대하여 그 선임감독에 관한 책임이 없다.","丙을 적법하게 선임한 후 X토지 매매계약 전에 甲이 사망한 경우, 특별한 사정이 없다면 丙의 대리권은 소멸하지 않는다.","만일 대리권이 소멸된 乙이 丙을 선임하였다면, X토지 매매에 대하여 민법 제129조에 의한 표현대리의 법리가 적용될 여지가 없다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/42","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-42","score":1.0,"pdfChars":441,"mirrorChars":429},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-43":{"id":"2021-43","year":2021,"number":43,"subject":"civil","question":"행위능력자 乙은 대리권 없이 甲을 대리하여 甲이 보유하고 있던 매수인의 지위를 丙에게 양도하기로 약정하고, 이에 丙은 乙에게 계약금을 지급하였다. 乙은 그 계약금을 유흥비로 탕진하였다. 이에 관한 설명으로 틀린 것은?(단, 표현대리는 성립하지 않으며, 다툼이 있으면 판례에 따름)","options":["매수인의 지위 양도계약 체결 당시 乙의 무권대리를 모른 丙은 甲의 추인이 있을 때까지 계약을 철회할 수 있다.","丙이 계약을 유효하게 철회하면, 무권대리행위는 확정적으로 무효가 된다.","丙이 계약을 유효하게 철회하면, 丙은 甲을 상대로 계약금 상당의 부당이득반환을 청구할 수 있다.","丙이 계약을 철회한 경우, 甲이 그 철회의 유효를 다투기 위해서는 乙에게 대리권이 없음을 丙이 알았다는 것에 대해 증명해야 한다.","丙의 계약 철회 전 甲이 사망하고 乙이 단독상속인이 된 경우, 乙이 선의·무과실인 丙에게 추인을 거절하는 것은 신의칙에 반한다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/43","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-43","score":1.0,"pdfChars":472,"mirrorChars":462},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-44":{"id":"2021-44","year":2021,"number":44,"subject":"civil","question":"의사와 표시가 불일치하는 경우에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["통정허위표시의 무효로 대항할 수 없는 제3자에 해당하는지를 판단할 때, 파산관재인은 파산채권자 일부가 선의라면 선의로 다루어진다.","비진의 의사표시는 상대방이 표의자의 진의 아님을 알 수 있었을 경우 취소할 수 있다.","비진의 의사표시는 상대방과 통정이 없었다는 점에서 착오와 구분된다.","통정허위표시의 무효에 대항하려는 제3자는 자신이 선의라는 것을 증명하여야 한다.","매수인의 채무불이행을 이유로 매도인이 계약을 적법하게 해제했다면, 착오를 이유로 한 매수인의 취소권은 소멸한다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/44","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-44","score":1.0,"pdfChars":328,"mirrorChars":320},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-45":{"id":"2021-45","year":2021,"number":45,"subject":"civil","question":"효력규정이 아닌 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 「부동산등기 특별조치법」상 중간생략등기를 금지하는 규정\nㄴ. 「공인중개사법」상 개업공인중개사가 중개의뢰인과 직접 거래를 하는 행위를 금지하는 규정\nㄷ. 「공인중개사법」상 개업공인중개사가 법령에 규정된 중개보수 등을 초과하여 금품을 받는 행위를 금지하는 규정","options":["ㄱ","ㄴ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ"],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/45","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-45","score":1.0,"pdfChars":214,"mirrorChars":206},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-46":{"id":"2021-46","year":2021,"number":46,"subject":"civil","question":"부동산이중매매에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["반사회적 법률행위에 해당하는 제2매매계약에 기초하여 제2매수인으로부터 그 부동산을 매수하여 등기한 선의의 제3자는 제2매매계약의 유효를 주장할 수 있다.","제2매수인이 이중매매사실을 알았다는 사정만으로 제2매매계약을 반사회적 법률행위에 해당한다고 볼 수 없다.","특별한 사정이 없는 한, 먼저 등기한 매수인이 목적 부동산의 소유권을 취득한다.","반사회적 법률행위에 해당하는 이중매매의 경우, 제1매수인은 제2매수인에 대하여 직접 소유권이전등기말소를 청구할 수 없다.","부동산이중매매의 법리는 이중으로 부동산임대차계약이 체결되는 경우에도 적용될 수 있다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/46","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-46","score":1.0,"pdfChars":359,"mirrorChars":350},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-47":{"id":"2021-47","year":2021,"number":47,"subject":"civil","question":"법률행위의 취소에 관한 설명으로 틀린 것은?","options":["취소권은 추인할 수 있는 날로부터 3년내에 법률행위를 한 날로부터 10년내에 행사해야 한다.","취소할 수 있는 법률행위에 관하여 법정추인이 되려면 취소권자가 취소권의 존재를 인식해야 한다.","취소된 법률행위는 처음부터 무효인 것으로 본다.","취소권의 법적성질은 형성권이다.","취소할 수 있는 법률행위의 상대방이 확정된 경우, 그 취소는 그 상대방에 대한 의사표시로 하여야 한다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/47","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-47","score":1.0,"pdfChars":242,"mirrorChars":237},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-48":{"id":"2021-48","year":2021,"number":48,"subject":"civil","question":"표현대리에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["본인이 타인에게 대리권을 수여하지 않았지만 수여하였다고 상대방에게 통보한 경우, 그 타인이 통보받은 상대방 외의 자와 본인을 대리하여 행위를 한 때는 민법 제125조의 표현대리가 적용된다.","표현대리가 성립하는 경우, 과실상계의 법리를 유추적용하여 본인의 책임을 경감할 수 있다.","민법 제129조의 표현대리를 기본대리권으로 하는 민법 제126조의 표현대리는 성립될 수 없다.","대리행위가 강행법규에 위반하여 무효인 경우에는 표현대리의 법리가 적용되지 않는다.","유권대리의 주장 속에는 표현대리의 주장이 포함되어 있다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/48","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-48","score":1.0,"pdfChars":337,"mirrorChars":328},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-49":{"id":"2021-49","year":2021,"number":49,"subject":"civil","question":"법률행위의 조건과 기한에 관한 설명으로 틀린 것은?","options":["법정조건은 법률행위의 부관으로서의 조건이 아니다.","조건이 선량한 풍속 기타 사회질서에 위반한 것이면 그 법률행위는 무효이다.","조건부 법률행위는 조건이 성취되었을 때에 비로소 그 법률행위가 성립한다.","조건부 법률행위에서 불능조건이 정지조건이면 그 법률행위는 무효이다.","과거의 사실은 법률행위의 부관으로서의 조건으로 되지 못한다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/49","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-49","score":1.0,"pdfChars":222,"mirrorChars":216},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-50":{"id":"2021-50","year":2021,"number":50,"subject":"civil","question":"법률행위의 무효에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["무효인 법률행위의 추인은 그 무효의 원인이 소멸한 후에 하여야 그 효력이 인정된다.","무효인 법률행위는 무효임을 안 날로부터 3년이 지나면 추인할 수 없다.","법률행위의 일부분이 무효일 때, 그 나머지 부분의 유효성을 판단함에 있어 나머지 부분을 유효로 하려는 당사자의 가정적 의사는 고려되지 않는다.","무효인 법률행위의 추인은 묵시적인 방법으로 할 수는 없다.","강행법규 위반으로 무효인 법률행위를 추인한 때에는 다른 정함이 없으면 그 법률행위는 처음부터 유효한 법률행위가 된다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/50","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-50","score":1.0,"pdfChars":320,"mirrorChars":311},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-51":{"id":"2021-51","year":2021,"number":51,"subject":"civil","question":"물권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["민법 제185조에서의 '법률'은 국회가 제정한 형식적 의미의 법률을 의미한다.","사용·수익 권능을 대세적·영구적으로 포기한 소유권도 존재한다.","처분권능이 없는 소유권은 인정되지 않는다.","근린공원을 자유롭게 이용한 사정만으로 공원이용권이라는 배타적 권리를 취득하였다고 볼 수는 없다.","온천에 관한 권리를 관습법상의 물권이라고 볼 수는 없다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/51","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-51","score":0.9942,"pdfChars":235,"mirrorChars":228},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-52":{"id":"2021-52","year":2021,"number":52,"subject":"civil","question":"물권적 청구권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["소유권을 양도한 전소유자가 물권적 청구권만을 분리, 유보하여 불법점유자에 대해 그 물권적 청구권에 의한 방해배제를 할 수 있다.","물권적 청구권을 행사하기 위해서는 그 상대방에게 귀책사유가 있어야 한다.","소유권에 기한 방해배제청구권에 있어서 방해에는 과거에 이미 종결된 손해가 포함된다.","소유권에 기한 물권적 청구권은 그 소유권과 분리하여 별도의 소멸시효의 대상이 된다.","소유권에 기한 물권적 청구권은 그 소유자가 소유권을 상실하면 더 이상 인정되지 않는다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/52","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-52","score":1.0,"pdfChars":305,"mirrorChars":300},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-53":{"id":"2021-53","year":2021,"number":53,"subject":"civil","question":"등기청구권에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 등기청구권이란 등기권리자와 등기의무자가 함께 국가에 등기를 신청하는 공법상의 권리이다.\nㄴ. 부동산 매수인이 그 목적물을 인도받아 이를 사용수익하고 있는 이상 그 매수인의 등기청구권은 시효로 소멸하지 않는다.\nㄷ. 취득시효완성으로 인한 소유권이전등기청구권은 시효완성 당시의 등기명의인이 동의해야만 양도할 수 있다.","options":["ㄱ","ㄴ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/53","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-53","score":1.0,"pdfChars":254,"mirrorChars":247},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-54":{"id":"2021-54","year":2021,"number":54,"subject":"civil","question":"청구권보전을 위한 가등기에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["가등기된 소유권이전청구권은 가등기에 대한 부기등기의 방법으로 타인에게 양도될 수 있다.","정지조건부 청구권을 보전하기 위한 가등기도 허용된다.","가등기에 기한 본등기 절차에 의하지 않고 별도의 본등기를 경료받은 경우, 제3자 명의로 중간처분의 등기가 있어도 가등기에 기한 본등기 절차의 이행을 구할 수 없다.","가등기는 물권적 청구권을 보전하기 위해서는 할 수 없다.","소유권이전청구권을 보전하기 위한 가등기에 기한 본등기를 청구하는 경우, 가등기 후 소유자가 변경되더라도 가등기 당시의 등기명의인을 상대로 하여야 한다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/54","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-54","score":1.0,"pdfChars":347,"mirrorChars":338},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-55":{"id":"2021-55","year":2021,"number":55,"subject":"civil","question":"甲, 乙, 丙은 X토지를 각 1/2, 1/4, 1/4의 지분으로 공유하고 있다. 이에 관한 설명으로 옳은 것은?(단, 구분소유적 공유관계는 아니며, 다툼이 있으면 판례에 따름)","options":["乙이 X토지에 대한 자신의 지분을 포기한 경우, 乙의 지분은 甲, 丙에게 균등한 비율로 귀속된다.","당사자간의 특약이 없는 경우, 甲은 단독으로 X토지를 제3자에게 임대할 수 있다.","甲, 乙은 X토지에 대한 관리방법으로 X토지에 건물을 신축할 수 있다.","甲, 乙, 丙이 X토지의 관리에 관한 특약을 한 경우, 그 특약은 특별한 사정이 없는 한 그들의 특정승계인에게도 효력이 미친다.","丙이 甲, 乙과의 협의없이 X토지를 배타적·독점적으로 점유하고 있는 경우, 乙은 공유물에 대한 보존행위로 X토지의 인도를 청구할 수 있다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/55","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-55","score":0.9982,"pdfChars":403,"mirrorChars":394},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-56":{"id":"2021-56","year":2021,"number":56,"subject":"civil","question":"소유권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["기술적 착오로 지적도상의 경계선이 진실한 경계선과 다르게 작성된 경우, 그 토지의 경계는 실제의 경계에 따른다.","토지가 포락되어 원상복구가 불가능한 경우, 그 토지에 대한 종전 소유권은 소멸한다.","타인의 토지를 통과하지 않으면 필요한 수도를 설치할 수 없는 토지의 소유자는 그 타인의 승낙 없이도 수도를 시설할 수 있다.","포위된 토지가 공로에 접하게 되어 주위토지통행권을 인정할 필요성이 없어진 경우에도 그 통행권은 존속한다.","증축된 부분이 기존의 건물과 구조상·이용상 독립성이 없는 경우, 그 부분은 기존의 건물에 부합한다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/56","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-56","score":0.998,"pdfChars":342,"mirrorChars":335},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-57":{"id":"2021-57","year":2021,"number":57,"subject":"civil","question":"부동산의 점유취득시효에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["성명불상자(姓名不詳者)의 소유물에 대하여 시효취득을 인정할 수 있다.","국유재산도 취득시효기간 동안 계속하여 일반재산인 경우 취득시효의 대상이 된다.","점유자가 자주점유의 권원을 주장하였으나 이것이 인정되지 않는 경우, 특별한 사정이 없는 한 자주점유의 추정은 번복된다.","점유의 승계가 있는 경우 시효이익을 받으려는 자는 자기 또는 전(前)점유자의 점유개시일 중 임의로 점유기산점을 선택할 수 있다.","취득시효완성 후 소유권이전등기를 마치지 않은 시효완성자는 소유자에 대하여 취득시효 기간 중의 점유로 발생한 부당이득의 반환의무가 없다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/57","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-57","score":1.0,"pdfChars":359,"mirrorChars":346},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-58":{"id":"2021-58","year":2021,"number":58,"subject":"civil","question":"점유권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["특별한 사정이 없는 한, 건물의 부지가 된 토지는 그 건물의 소유자가 점유하는 것으로 보아야 한다.","전후 양 시점의 점유자가 다른 경우 점유승계가 증명되면 점유계속은 추정된다.","적법하게 과실을 취득한 선의의 점유자는 회복자에게 통상의 필요비의 상환을 청구하지 못한다.","점유자가 상대방의 사기에 의해 물건을 인도한 경우 점유침탈을 이유로 한 점유물반환청구권은 발생하지 않는다.","선의의 점유자가 본권의 소에서 패소하면 패소 확정시부터 악의의 점유자로 본다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/58","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-58","score":1.0,"pdfChars":302,"mirrorChars":294},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-59":{"id":"2021-59","year":2021,"number":59,"subject":"civil","question":"지상권에 관한 설명으로 틀린 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 담보목적의 지상권이 설정된 경우 피담보채권이 변제로 소멸하면 그 지상권도 소멸한다.\nㄴ. 지상권자의 지료지급 연체가 토지소유권의 양도 전후에 걸쳐 이루어진 경우, 토지양수인은 자신에 대한 연체기간이 2년 미만이더라도 지상권의 소멸을 청구할 수 있다.\nㄷ. 분묘기지권을 시효취득한 자는 토지소유자가 지료를 청구한 날부터의 지료를 지급할 의무가 있다.","options":["ㄱ","ㄴ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/59","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-59","score":1.0,"pdfChars":273,"mirrorChars":264},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-60":{"id":"2021-60","year":2021,"number":60,"subject":"civil","question":"지역권에 관한 설명으로 틀린 것은?","options":["지역권은 요역지와 분리하여 따로 양도하거나 다른 권리의 목적으로 하지 못한다.","1필의 토지의 일부에는 지역권을 설정할 수 없다.","요역지의 공유자 중 1인이 지역권을 취득한 경우, 요역지의 다른 공유자도 지역권을 취득한다.","지역권에 기한 승역지 반환청구권은 인정되지 않는다.","계속되고 표현된 지역권은 시효취득의 대상이 될 수 있다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/60","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-60","score":1.0,"pdfChars":216,"mirrorChars":209},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-61":{"id":"2021-61","year":2021,"number":61,"subject":"civil","question":"전세권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["전세금의 지급은 전세권 성립의 요소이다.","당사자가 주로 채권담보의 목적을 갖는 전세권을 설정하였더라도 장차 전세권자의 목적물에 대한 사용수익권을 완전히 배제하는 것이 아니라면 그 효력은 인정된다.","건물전세권이 법정갱신된 경우 전세권자는 전세권갱신에 관한 등기없이도 제3자에게 전세권을 주장할 수 있다.","전세권의 존속기간 중 전세목적물의 소유권이 양도되면, 그 양수인이 전세권설정자의 지위를 승계한다.","건물의 일부에 대한 전세에서 전세권설정자가 전세금의 반환을 지체하는 경우, 전세권자는 전세권에 기하여 건물 전부에 대해서 경매청구할 수 있다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/61","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-61","score":1.0,"pdfChars":353,"mirrorChars":344},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-62":{"id":"2021-62","year":2021,"number":62,"subject":"civil","question":"저당부동산의 제3취득자에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 저당부동산에 대한 후순위저당권자는 저당부동산의 피담보채권을 변제하고 그 저당권의 소멸을 청구할 수 있는 제3취득자에 해당하지 않는다.\nㄴ. 저당부동산의 제3취득자는 부동산의 보존·개량을 위해 지출한 비용을 그 부동산의 경매대가에서 우선상환을 받을 수 없다.\nㄷ. 저당부동산의 제3취득자는 저당권을 실행하는 경매에 참가하여 매수인이 될 수 있다.\nㄹ. 피담보채권을 변제하고 저당권의 소멸을 청구할 수 있는 제3취득자에는 경매신청 후에 소유권, 지상권 또는 전세권을 취득한 자도 포함된다.","options":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/62","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-62","score":1.0,"pdfChars":375,"mirrorChars":365},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-63":{"id":"2021-63","year":2021,"number":63,"subject":"civil","question":"저당권의 효력이 미치는 목적물의 범위에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["당사자는 설정계약으로 저당권의 효력이 종물에 미치지 않는 것으로 정할 수 있다.","저당권의 목적토지가 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」에 따라 협의취득된 경우, 저당권자는 그 보상금청구권에 대해 물상대위권을 행사할 수 없다.","건물 소유를 목적으로 토지를 임차한 자가 그 토지 위에 소유하는 건물에 저당권을 설정한 경우 건물 소유를 목적으로 한 토지 임차권에도 저당권의 효력이 미친다.","저당목적물의 변형물인 금전에 대해 이미 제3자가 압류한 경우 저당권자는 물상대위권을 행사할 수 없다.","저당부동산에 대한 압류 이후의 저당권설정자의 저당부동산에 관한 차임채권에도 저당권의 효력이 미친다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/63","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-63","score":1.0,"pdfChars":407,"mirrorChars":397},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-64":{"id":"2021-64","year":2021,"number":64,"subject":"civil","question":"유치권 성립을 위한 견련관계가 인정되는 경우를 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 임대인과 임차인 사이에 건물명도시 권리금을 반환하기로 약정을 한 때, 권리금반환청구권을 가지고 건물에 대한 유치권을 주장하는 경우\nㄴ. 건물의 임대차에서 임차인의 임차보증금반환청구권으로써 임차인이 그 건물에 유치권을 주장하는 경우\nㄷ. 가축이 타인의 농작물을 먹어 발생한 손해에 관한 배상청구권에 기해 그 타인이 그 가축에 대한 유치권을 주장하는 경우","options":["ㄱ","ㄴ","ㄷ","ㄱ, ㄷ","ㄴ, ㄷ"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/64","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-64","score":1.0,"pdfChars":279,"mirrorChars":273},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-65":{"id":"2021-65","year":2021,"number":65,"subject":"civil","question":"동시이행관계에 있는 것을 모두 고른 것은?(단, 이에 관한 특약은 없으며, 다툼이 있으면 판례에 따름)\n\nㄱ. 부동산의 매매계약이 체결된 경우 매도인의 소유권이전등기의무와 매수인의 잔대금지급의무\nㄴ. 임대차 종료시 임대인의 임차보증금 반환의무와 임차인의 임차물 반환의무\nㄷ. 매도인의 토지거래허가 신청절차에 협력할 의무와 매수인의 매매대금지급의무","options":["ㄱ","ㄴ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ"],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/65","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-65","score":1.0,"pdfChars":221,"mirrorChars":214},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-66":{"id":"2021-66","year":2021,"number":66,"subject":"civil","question":"제3자를 위한 계약에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["제3자의 권리는 그 제3자가 채무자에 대해 수익의 의사표시를 하면 계약의 성립시에 소급하여 발생한다.","제3자는 채무자의 채무불이행을 이유로 그 계약을 해제할 수 없다.","채무자에게 수익의 의사표시를 한 제3자는 그 채무자에게 그 채무의 이행을 직접 청구할 수 있다.","채무자는 상당한 기간을 정하여 계약이익의 향수 여부의 확답을 제3자에게 최고할 수 있다.","채무자와 인수인의 계약으로 체결되는 병존적 채무인수는 제3자를 위한 계약으로 볼 수 있다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/66","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-66","score":1.0,"pdfChars":307,"mirrorChars":296},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-67":{"id":"2021-67","year":2021,"number":67,"subject":"civil","question":"합의해제에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["부동산매매계약이 합의해제된 경우, 다른 약정이 없는 한 매도인은 수령한 대금에 이자를 붙여 반환할 필요가 없다.","당사자 쌍방은 자기 채무의 이행제공 없이 합의에 의해 계약을 해제할 수 있다.","합의해제의 소급효는 법정해제의 경우와 같이 제3자의 권리를 해하지 못한다.","계약이 합의해제된 경우 다른 사정이 없는 한, 합의해제시에 채무불이행으로 인한 손해배상을 청구할 수 있다.","매도인이 잔금기일 경과 후 해제를 주장하며 수령한 대금을 공탁하고 매수인이 이의 없이 수령한 경우, 특별한 사정이 없는 한 합의해제된 것으로 본다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/67","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-67","score":1.0,"pdfChars":341,"mirrorChars":333},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-68":{"id":"2021-68","year":2021,"number":68,"subject":"civil","question":"청약에 관한 설명으로 옳은 것은?(단, 특별한 사정은 없으며, 다툼이 있으면 판례에 따름)","options":["불특정다수인에 대한 청약은 효력이 없다.","청약이 상대방에게 도달하여 그 효력이 발생하더라도 청약자는 이를 철회할 수 있다.","당사자간에 동일한 내용의 청약이 상호교차된 경우, 양 청약이 상대방에게 발송된 때에 계약이 성립한다.","계약내용이 제시되지 않은 광고는 청약에 해당한다.","하도급계약을 체결하려는 교섭당사자가 견적서를 제출하는 행위는 청약의 유인에 해당한다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/68","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-68","score":1.0,"pdfChars":263,"mirrorChars":257},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-69":{"id":"2021-69","year":2021,"number":69,"subject":"civil","question":"약관에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["고객에게 부당하게 과중한 지연 손해금 등의 손해배상의무를 부담시키는 약관 조항은 무효로 한다.","약관내용이 명백하지 못한 때에는 약관작성자에게 불리하게 제한해석해야 한다.","보통거래약관은 신의성실의 원칙에 따라 그 약관의 목적과 취지를 고려하여 공정하고 합리적으로 해석해야 한다.","고객에게 부당하게 불리한 약관조항은 공정을 잃은 것으로 추정된다.","보통거래약관의 내용은 개개 계약체결자의 의사나 구체적인 사정을 고려하여 구체적·주관적으로 해석해야 한다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/69","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-69","score":0.9978,"pdfChars":300,"mirrorChars":290},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-70":{"id":"2021-70","year":2021,"number":70,"subject":"civil","question":"수량을 지정한 매매의 목적물의 일부가 멸실된 경우 매도인의 담보책임에 관한 설명으로 틀린 것은?(단, 이에 관한 특약은 없으며, 다툼이 있으면 판례에 따름)","options":["수량을 지정한 매매란 특정물이 일정한 수량을 가지고 있다는 데 주안을 두고 대금도 그 수량을 기준으로 정한 경우를 말한다.","악의의 매수인은 대금감액과 손해배상을 청구할 수 있다.","선의의 매수인은 멸실된 부분의 비율로 대금감액을 청구할 수 있다.","잔존한 부분만이면 매수하지 아니하였을 때에는 선의의 매수인은 계약전부를 해제할 수 있다.","선의의 매수인은 일부멸실의 사실을 안 날부터 1년내에 매도인의 담보책임에 따른 매수인의 권리를 행사해야 한다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/70","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-70","score":1.0,"pdfChars":349,"mirrorChars":341},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-71":{"id":"2021-71","year":2021,"number":71,"subject":"civil","question":"甲은 자기 소유 X토지를 3억원에 乙에게 매도하면서 동시에 환매할 권리를 보유하기로 약정하고 乙이 X토지에 대한 소유권 이전등기를 마쳤다. 이에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["특별한 약정이 없는 한, 甲은 환매기간 내에 그가 수령한 3억원과 乙이 부담한 매매비용을 반환하고 X토지를 환매할 수 있다.","甲과 乙이 환매기간을 정하지 아니한 경우 그 기간은 5년으로 한다.","환매등기는 乙 명의의 소유권이전등기에 대한 부기등기의 형식으로 한다.","만일 甲의 환매등기 후 丙이 乙로부터 X토지를 매수하였다면, 乙은 환매등기를 이유로 丙의 X토지에 대한 소유권이전등기청구를 거절할 수 있다.","만일 甲의 환매등기 후 丁이 X토지에 乙에 대한 채권을 담보하기 위하여 저당권을 설정하였다면, 甲이 적법하게 환매권을 행사하여 X토지의 소유권이전등기를 마친 경우 丁의 저당권은 소멸한다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/71","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-71","score":1.0,"pdfChars":461,"mirrorChars":447},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-72":{"id":"2021-72","year":2021,"number":72,"subject":"civil","question":"부동산의 교환계약에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 유상·쌍무계약이다.\nㄴ. 일방이 금전의 보충지급을 약정한 경우 그 금전에 대하여는 매매대금에 관한 규정을 준용한다.\nㄷ. 다른 약정이 없는 한 각 당사자는 목적물의 하자에 대해 담보책임을 부담한다.\nㄹ. 당사자가 자기 소유 목적물의 시가를 묵비하여 상대방에게 고지하지 않은 경우, 특별한 사정이 없는 한 상대방의 의사결정에 불법적인 간섭을 한 것이다.","options":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/72","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-72","score":0.9975,"pdfChars":301,"mirrorChars":293},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-73":{"id":"2021-73","year":2021,"number":73,"subject":"civil","question":"乙이 甲으로부터 건물의 소유를 목적으로 X토지를 10년간 임차하여 그 위에 자신의 건물을 신축한 경우에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["특별한 사정이 없는 한 甲이 X토지의 소유자가 아닌 경우에도 임대차 계약은 유효하게 성립한다.","甲과 乙 사이에 반대약정이 없으면 乙은 甲에 대하여 임대차등기절차에 협력할 것을 청구할 수 있다.","乙이 현존하는 지상건물을 등기해도 임대차를 등기하지 않은 때에는 제3자에 대해 임대차의 효력이 없다.","10년의 임대차 기간이 경과한 때 乙의 지상건물이 현존하는 경우 乙은 임대차 계약의 갱신을 청구할 수 있다.","乙의 차임연체액이 2기의 차임액에 달하는 경우, 특약이 없는 한 甲은 임대차 계약을 해지할 수 있다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공 민등록을 마치고 거주하던 자기 명의의 주택을 매도한 자가 매도와 동시에 이를 다시 임차하기로 약정한 경우, 매수인 명의의 소유권 이전등기 여부와 관계없이 대항력이 인정된다.","임차인이 주택의 인도와 주민등록을 마친 때에는 그 다음 날 오전 영시부터 대항력이 생긴다.","임차인이 가족과 함께 임차주택의 점유를 계속하면서 가족의 주민등록은 그대로 둔 채 임차인의 주민등록만 일시적으로 옮긴 경우 대항력을 상실하지 않는다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/75","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-75","score":1.0,"pdfChars":481,"mirrorChars":472},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-76":{"id":"2021-76","year":2021,"number":76,"subject":"civil","question":"주택임대차보호법상 임차인의 계약갱신요구권에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 임대차기간이 끝나기 6개월 전부터 2개월 전까지의 기간에 행사해야 한다.\nㄴ. 임대차의 조건이 동일한 경우 여러 번 행사할 수 있다.\nㄷ. 임차인이 임대인의 동의 없이 목적 주택을 전대한 경우 임대인은 계약갱신요구를 거절하지 못한다.","options":["ㄱ","ㄴ","ㄷ","ㄱ, ㄷ","ㄴ, ㄷ"],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/76","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-76","score":1.0,"pdfChars":211,"mirrorChars":203},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-77":{"id":"2021-77","year":2021,"number":77,"subject":"civil","question":"甲은 2021년 2월 1일 서울특별시에 위치한 乙 소유 X상가건물에 대하여 보증금 5억원, 월차임 5백만원으로 임대차계약을 체결하였다. 甲은 2021년 2월 15일 건물의 인도를 받아 영업을 개시하고, 사업자등록을 신청하였다. 이에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 위 계약에는 확정일자 부여 등에 대해 규정하고 있는 「상가건물 임대차보호법」 제4조의 규정이 적용된다.\nㄴ. 甲이 임차건물의 일부를 중과실로 파손한 경우 계약갱신을 요구할 수 있다.\nㄷ. 甲이 2개월분의 차임을 연체하던 중 매매로 건물의 소유자가 丙으로 바뀐 경우, 특별한 사정이 없는 한 연체차임은 乙에게 지급해야 한다.","options":["ㄱ","ㄴ","ㄷ","ㄱ, ㄴ","ㄱ, ㄷ"],"correct":[1,2,3,4,5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/77","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-77","score":1.0,"pdfChars":387,"mirrorChars":375},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"all-answers-accepted","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-78":{"id":"2021-78","year":2021,"number":78,"subject":"civil","question":"가등기담보등에 관한 법률에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["담보가등기를 마친 부동산에 대하여 강제경매가 된 경우 담보가등기권리는 그 부동산의 매각에 의해 소멸한다.","가등기의 피담보채권은 당사자의 약정과 관계없이 가등기의 원인증서인 매매예약서상의 매매대금의 한도로 제한된다.","채무자가 청산기간이 지나기 전에 한 청산금에 관한 권리의 양도는 이로써 후순위권리자에게 대항하지 못한다.","가등기가 담보가등기인지 여부는 거래의 실질과 당사자의 의사해석에 따라 결정된다.","가등기담보부동산의 예약 당시 시가가 그 피담보채무액에 미달하는 경우에는 청산금평가액의 통지를 할 필요가 없다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/78","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-78","score":1.0,"pdfChars":344,"mirrorChars":336},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-79":{"id":"2021-79","year":2021,"number":79,"subject":"civil","question":"甲은 법령상의 제한을 피하여 乙 소유의 X부동산을 매수하고자 자신의 친구 丙과 X부동산의 매수에 관한 명의신탁약정을 체결하였다. 그에 따라 2021년 5월 丙은 乙과 X부동산 매매계약을 체결하고, 甲의 자금으로 그 대금을 지급하여 丙 명의로 등기 이전을 마쳤다. 이에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["甲과 丙 사이의 명의신탁약정은 무효이다.","乙이 매매계약 체결 당시 그 명의신탁약정이 있다는 사실을 알았다면 丙은 X부동산의 소유권을 취득할 수 없다.","乙이 매매계약 체결 당시 그 명의신탁약정이 있다는 사실을 몰랐다면, 그 후 명의신탁약정 사실을 알게 되었어도 丙은 X부동산의 소유권을 취득한다.","丙이 X부동산의 소유권을 취득한 경우 甲은 丙에게 제공한 X부동산의 매수자금 상당액을 부당이득으로 반환 청구할 수 있다.","X부동산의 소유권을 유효하게 취득한 丙이 명의신탁약정 외의 적법한 원인에 의하여 甲 앞으로 X부동산에 대한 소유권이전등기를 마친다고 해도 그 소유권이전등기는 무효이다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/79","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-79","score":1.0,"pdfChars":526,"mirrorChars":512},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-80":{"id":"2021-80","year":2021,"number":80,"subject":"civil","question":"집합건물의 소유 및 관리에 관한 법률에 관한 설명으로 틀린 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 구분건물이 객관적·물리적으로 완성되더라도 그 건물이 집합건축물대장에 등록되지 않는 한 구분소유권의 객체가 되지 못한다.\nㄴ. 집합건물구분소유권의 특별승계인이 그 구분소유권을 다시 제3자에게 이전한 경우, 관리규약에 달리 정함이 없는 한, 각 특별승계인들은 자신의 전(前)구분소유자의 공용부분에 대한 체납관리비를 지급할 책임이 있다.\nㄷ. 전유부분은 구분소유권의 목적인 건물부분을 말한다.","options":["ㄱ","ㄴ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ"],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/minbeop/80","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-80","score":0.9977,"pdfChars":311,"mirrorChars":303},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."}};

  {id:'e6',s:'estate',t:'수요 vs 수요량',topic:'수요·공급·탄력성',fact:'자기 가격 변동은 수요곡선 위의 이동(수요량 변화), 소득·선호·대체재 가격 등은 수요곡선 자체의 이동(수요 변화) 요인이다.',recall:'부동산 자체 가격이 내리면 무엇이 변하는가?',answer:'다른 조건 동일 시 수요량(곡선상의 이동)',trap:'‘수요가 증가했다’와 ‘수요량이 증가했다’를 혼동하지 않는다.'},
  {id:'e7',s:'estate',t:'정상재와 소득',topic:'수요·공급·탄력성',fact:'정상재는 소득 증가 시 수요곡선이 오른쪽으로 이동한다. 열등재는 반대의 소득효과가 나타날 수 있다.',recall:'정상재에서 소득 증가 시 수요곡선은?',answer:'우측 이동',trap:'자기 가격 하락의 이동과 구분한다.'},
  {id:'e8',s:'estate',t:'수요의 가격탄력성',topic:'수요·공급·탄력성',fact:'가격탄력성의 크기(절댓값) = 수요량 변화율 ÷ 가격 변화율. 1보다 크면 탄력적, 1보다 작으면 비탄력적이다.',recall:'가격 10% 상승, 수요량 5% 감소 → 탄력성은?',answer:'0.5(비탄력적)',trap:'수요량과 가격 변화 방향이 반대이므로 통상 절댓값을 쓴다.'},

  {id:'e16',s:'estate',t:'현재가치 PV',topic:'정책·투자·금융',fact:'1년 후 금액의 현재가치 = 미래금액 ÷ (1+할인율). 할인율이 높을수록 현재가치는 낮아진다.',recall:'1년 후 110만 원을 할인율 10%로 할인하면 PV는?',answer:'100만 원',trap:'단위와 할인기간을 확인한다.'},
  {id:'e17',s:'estate',t:'순현재가치 NPV',topic:'정책·투자·금융',fact:'NPV = 현금유입 현재가치 합계 − 현금유출 현재가치 합계. 독립 투자안의 NPV가 양수이면 일반적으로 채택 가능하다.',recall:'현금유입 PV 120, 투자비 PV 100 → NPV는?',answer:'+20',trap:'내부수익률(IRR)과 혼동하지 않는다.'},
  {id:'e18',s:'estate',t:'LTV와 DTI',topic:'정책·투자·금융',fact:'LTV는 담보가치 대비 대출 비율, DTI는 소득 대비 연간 원리금 상환부담 비율의 개념이다.',recall:'LTV의 분모는 무엇인가?',answer:'담보가치',trap:'DSR·DTI·LTV는 분모와 포함 채무 범위가 서로 다르다.'},
  {id:'e19',s:'estate',t:'감정평가 3방식',topic:'감정평가',fact:'원가방식의 원가법, 비교방식의 거래사례비교법, 수익방식의 수익환원법을 구분한다.',recall:'수익성을 기준으로 가치를 추정하는 대표 방법은?',answer:'수익환원법',trap:'평가 3방식과 각각의 세부 기법을 혼동하지 않는다.'},
  {id:'e20',s:'estate',t:'환원율과 수익가격',topic:'감정평가',fact:'직접환원법의 단순형: 수익가격 = 순영업소득(NOI) ÷ 환원율.',recall:'NOI 1,000만 원, 환원율 5% → 가치는?',answer:'2억 원',trap:'총임대수입과 순영업소득을 혼동하지 않는다.'},
  {id:'c1',s:'civil',t:'법률행위와 의사표시',topic:'법률행위·의사표시',fact:'법률행위는 일정한 법률효과를 발생시키려는 의사표시를 필수요소로 한다.',recall:'법률행위의 필수 구성요소는?',answer:'의사표시',trap:'사실행위와 법률행위를 구분한다.'},
  {id:'c2',s:'civil',t:'비진의 의사표시',topic:'법률행위·의사표시',fact:'원칙적으로 표시한 대로 효력이 있으나, 상대방이 진의 아님을 알았거나 알 수 있었을 때 무효가 된다(민법 제107조).',recall:'비진의표시가 원칙적으로 유효한가?',answer:'원칙적으로 유효하다',trap:'상대방의 악의·과실과 선의의 제3자 보호를 구분한다.'},
  {id:'c3',s:'civil',t:'통정허위표시',topic:'법률행위·의사표시',fact:'상대방과 통정한 허위 의사표시는 무효. 이 무효로 선의의 제3자에게 대항하지 못한다(민법 제108조).',recall:'통정허위표시의 당사자 사이 효력은?',answer:'무효',trap:'제3자의 보호에서 선의인지가 중요하다.'},
  {id:'c4',s:'civil',t:'착오로 인한 의사표시',topic:'법률행위·의사표시',fact:'법률행위 내용의 중요부분에 착오가 있는 경우 원칙적으로 취소할 수 있다. 표의자에게 중대한 과실이 있으면 제한된다(민법 제109조).',recall:'중요부분의 착오가 있으면 원칙적으로 무효인가 취소인가?',answer:'취소할 수 있다',trap:'동기의 착오·중과실·상대방 사정을 별도로 검토한다.'},

function renderOptionBreakdown(q,firstChoice){const opts=REVERSE_OPTION_EXPLANATIONS[q.id];if(!opts||opts.length!==q.a.length)return '';
 return `<details class="reverse-explain-options"><summary>5개 선지의 판별 근거 전체 보기 · 내가 고른 ${firstChoice}번</summary><div class="stack" style="margin-top:15px">${opts.map((reason,i)=>`<div class="reverse-choice-reason ${i+1===q.ok?'is-correct':''}"><span class="option-index">${i+1}</span><div><strong>${esc(q.a[i])}</strong><p>${esc(reason)}</p></div>${i+1===q.ok?'<span class="pill green">정답</span>':i+1===firstChoice?'<span class="pill orange">내 선택</span>':''}</div>`).join('')}</div></details>`;
}

/* Local import for OCR-extracted TXT. This is deliberately NOT an OCR engine. */
let OCR_PREVIEW=null;
function parseNumberedExamText(text,year,subjectId){
 const [start,end]=subjectId==='estate'?[1,40]:[41,80];
 const cleaned=String(text||'').replace(/\r\n?/g,'\n').replace(/\uFEFF/g,'');
 const re=/^\s*(?:문제\s*)?([1-9]\d?)[.．)]\s*(.*)$/gm;
 const blocks=[...cleaned.matchAll(re)];
 const result=[],seen=new Set();
 for(let i=0;i<blocks.length;i++){
  const m=blocks[i],num=Number(m[1]);if(num<start||num>end||seen.has(num))continue;
  const section=cleaned.slice(m.index+m[0].length,i+1<blocks.length?blocks[i+1].index:cleaned.length).trim();
  const body=[m[2],section].filter(Boolean).join('\n').trim();
  if(body.length<12)continue;
  seen.add(num);result.push({number:num,text:body.slice(0,3500)});
 }
 return {year,subjectId,items:result.sort((a,b)=>a.number-b.number),detected:blocks.filter(m=>Number(m[1])>=start&&Number(m[1])<=end).length};
}
function showOCRPreview(){const target=OCR_PREVIEW;if(!target||target.year!==rs().year||target.subjectId!==state.subject)return '';
 const count=target.items.length;const existing=target.items.filter(x=>!!state.officialLinks[`${target.year}-${x.number}`]?.text).length;

function officialNoteFor(y,n){const custom=state.officialLinks[`${y}-${n}`];if(custom)return custom;const r=window.RECALL_OFFICIAL?.[`${y}-${n}`];return r?{...r,text:r.question+'\n'+r.options.map((a,i)=>String.fromCharCode(0x2460+i)+' '+a).join('\n')}:{};}
function officialNote(){return officialNoteFor(rs().year,rs().number);}
function officialSuggested(text){const input=String(text||'').normalize('NFKC').toLowerCase().replace(/\s+/g,' ');if(input.length<4)return [];
 return allTheory().map(c=>{
  const keys=CONCEPT_KEYWORDS[c.id]||[];
  const matches=[...new Set(keys.filter(k=>input.includes(k.toLowerCase())))];
  const score=matches.reduce((n,k)=>n+(k.length>=4?3:1),0);
  return {id:c.id,t:c.t,score,matches};
 }).filter(x=>x.score>=2).sort((a,b)=>b.score-a.score).slice(0,4);
}
function officialCoverage(){

 const rows=EXAMS.map(e=>{let t=0,l=0,m=0;
  for(let n=start;n<=end;n++){const entry=officialNoteFor(e.year,n);if(entry?.text?.trim())t++;if(entry?.conceptId&&conceptById(entry.conceptId)?.s===state.subject)l++;if([1,2,3,4,5].includes(state.answers[`${e.year}-${n}`]))m++;}
  allText+=t;allLinked+=l;allMarked+=m;return {year:e.year,t,l,m};
 });return {allText,allLinked,allMarked,rows};
}

function renderReverse(){return rs().mode==='official'?officialQuestionHtml():renderPracticeReverse();}
function reverseSetQuestion(id){if(!quizzes().some(q=>q.id===id))return;Object.assign(rs(),{mode:'practice',id,step:0,firstChoice:0,transferChoice:0,retryChoice:0,recallRating:null});state.view='reverse';save();render();}
function reverseRate(rating){const q=reverseQuestion(),p=tracked(q);const intervals=[15*60000,DAY,3*DAY];let due=Date.now()+intervals[rating];
 const examAt=new Date('2026-10-31T08:00:00+09:00').getTime();if(Date.now()<examAt)due=Math.min(due,examAt);
 for(const c of linkedConcepts(q)){state.reviews[c.id]=new Date(due).toISOString();state.flashVisits[c.id]={correct:rating===2,at:Date.now(),via:'reverse',rating};}
 state.reverseProgress[q.id]={...p,recallRating:rating,due,updated:Date.now()};rs().recallRating=rating;rs().step=4;save();render();}
function reverseMarkFirst(choice){const q=reverseQuestion(),p=tracked(q);rs().firstChoice=choice;rs().step=1;
 state.reverseProgress[q.id]={...p,attempts:(Number(p.attempts)||0)+1,firstWrong:choice!==q.ok,lastFirst:choice,updated:Date.now()};
 state.quizAnswers[q.id]=choice;const id='quiz-'+q.id;if(choice!==q.ok)state.mistakes[id]={id,type:'quiz',s:q.s,label:q.q,topic:q.topic,answer:choice,correct:String(q.ok),why:q.why,updated:Date.now(),resolved:false};
 save();render();}
function reverseFinish(){const q=reverseQuestion(),p=tracked(q);const good=rs().retryChoice===q.ok;const id='quiz-'+q.id;
 state.reverseProgress[q.id]={...p,complete:good,lastCorrect:good,retries:(p.retries||0)+1,updated:Date.now(),due:!good?Date.now()+15*60000:p.due};
 if(good){if(state.mistakes[id])state.mistakes[id].resolved=true;}
 else{state.mistakes[id]={id,type:'quiz',s:q.s,label:q.q,topic:q.topic,answer:rs().retryChoice,correct:String(q.ok),why:q.why,updated:Date.now(),resolved:false};}
 rs().step=6;save();render();}
function handleReverseClick(action){const what=action.dataset.action;
 if(what==='r-start-recall'){rs().step=2;save();render();return true;}
 if(what==='r-reveal'){rs().step=3;save();render();return true;}
 if(what==='r-rate'){const n=Number(action.dataset.rRating);if([0,1,2].includes(n))reverseRate(n);return true;}
 if(what==='r-to-retry'){rs().step=5;rs().retryChoice=0;save();render();return true;}
 if(what==='r-finish'){if(rs().retryChoice)reverseFinish();return true;}
 if(what==='r-next'){reverseSetQuestion(nextReverseQuestion(reverseQuestion()).id);return true;}
 if(what==='r-restart'){reverseSetQuestion(reverseQuestion().id);return true;}
 if(what==='r-official-prev'||what==='r-official-next'){const [start,end]=examRange();rs().number=Math.max(start,Math.min(end,rs().number+(what==='r-official-prev'?-1:1)));rs().showOfficialKey=false;save();render();return true;}
 if(what==='r-official-showkey'){const entered=officialSavedText();if(entered!==officialNote().text)state.officialLinks[officialId()]={...officialNote(),text:entered,updated:Date.now()};rs().showOfficialKey=!rs().showOfficialKey;save();render();return true;}
 if(what==='r-official-next-unlinked'){rs().number=nextUnlinkedOfficial();rs().showOfficialKey=false;save();render();return true;}
 if(what==='r-open-omr'){state.year=rs().year;state.examQuestion=rs().number;state.view='exam';save();render();return true;}
 if(what==='r-exam-analyze'){rs().year=state.year;rs().number=state.examQuestion;rs().mode='official';rs().showOfficialKey=false;state.view='reverse';save();render();return true;}
 if(what==='r-ocr-preview'){readOCRInput($('#r-ocr-file')?.files?.[0]);return true;}
 if(what==='r-ocr-save'){saveOCRImport();return true;}
 if(what==='r-official-suggest'){const text=($('#r-official-text')?.value||'').slice(0,3500);state.officialLinks[officialId()]={...officialNote(),text,updated:Date.now()};save();render();toast('지문을 저장하고 개념 후보를 표시했습니다. 정답 해설은 자동 생성하지 않습니다.');return true;}
 if(what==='r-official-manual'){const id=$('#r-official-concept')?.value||'';if(!conceptById(id)||conceptById(id).s!==state.subject){toast('현재 과목의 이론을 먼저 선택하세요.');return true;}state.officialLinks[officialId()]={...officialNote(),text:($('#r-official-text')?.value||'').slice(0,3500),conceptId:id,updated:Date.now(),source:'user-confirmed'};save();render();toast('공식 기출 번호와 이론을 직접 연결했습니다.');return true;}
 return false;
}
function handleReverseDataClick(t){
 const mode=t.closest('[data-r-mode]');if(mode){rs().mode=mode.dataset.rMode;rs().step=0;save();render();return true;}
 const pick=t.closest('[data-r-select], [data-r-from-quiz]');if(pick){reverseSetQuestion(pick.dataset.rSelect||pick.dataset.rFromQuiz);return true;}
 const choice=t.closest('[data-r-choice]');if(choice){const q=reverseQuestion(),val=Number(choice.dataset.rVal),type=choice.dataset.rChoice;
  if(type==='first'&&rs().step===0&&!rs().firstChoice)reverseMarkFirst(val);
  if(type==='transfer'&&rs().step===4&&!rs().transferChoice){rs().transferChoice=val;save();render();}
  if(type==='retry'&&rs().step===5&&!rs().retryChoice){rs().retryChoice=val;save();render();}
  return true;}
 const officialMark=t.closest('[data-r-official-mark]');if(officialMark){const n=Number(officialMark.dataset.rOfficialMark);
  if([1,2,3,4,5].includes(n)){const entered=officialSavedText();if(entered!==officialNote().text)state.officialLinks[officialId()]={...officialNote(),text:entered,updated:Date.now()};state.answers[officialId()]=n;state.graded[`${rs().year}-${state.subject}`]=false;save();render();}return true;}
 const year=t.closest('[data-r-year]');if(year){rs().year=Number(year.dataset.rYear);rs().number=state.subject==='estate'?1:41;rs().showOfficialKey=false;save();render();return true;}
 const man=t.closest('[data-r-manual]');if(man){const id=man.dataset.rManual;if(conceptById(id)?.s===state.subject){state.officialLinks[officialId()]={...officialNote(),text:($('#r-official-text')?.value||'').slice(0,3500),conceptId:id,updated:Date.now(),source:'user-confirmed'};save();render();toast('문제와 이론 연결 완료');}return true;}
 const official=t.closest('[data-r-official-id]');if(official){const [y,n]=official.dataset.rOfficialId.split('-').map(Number);if(EXAMS.some(e=>e.year===y)&&Number.isInteger(n)){const s=n<=40?'estate':'civil';if(s!==state.subject)setSubject(s);rs().year=y;rs().number=n;rs().mode='official';rs().showOfficialKey=false;save();render();}return true;}
 const study=t.closest('[data-r-study]');if(study){const c=conceptById(study.dataset.rStudy);if(c){state.topicFilter='all';state.view='theory';state.theoryIndex=allTheory().findIndex(x=>x.id===c.id);state.flashShown=false;save();render();}return true;}
 const venn=t.closest('[data-r-venn]');if(venn){const v=CONTENT.compares.find(x=>x.id===venn.dataset.rVenn&&x.s===state.subject);if(v){state.compare=v.id;state.view='venn';save();render();}return true;}
 return false;
}

function examScore(y,s){const [a,b]=s==='estate'?[1,40]:[41,80];const keys=state.importedKeys[y]||KEYS[y];let correct=0;for(let i=a;i<=b;i++)if(state.answers[`${y}-${i}`]!=null&&normalKey(keys[i-1]).includes(Number(state.answers[`${y}-${i}`])))correct++;return {correct,score:correct*2.5};}

let calcIndex=0,calcAnswer=0,calcHint=false;
function renderCalc(){const c=CALC_BANK[calcIndex];return `${titleBlock('계산문제만 바로 풀기','숫자키 1~5로 선택 · 공식 보기 → 숫자 대입 → 조건 확인','CALCULATION / STEP 1')}<div class="tag-row" style="margin-bottom:18px">${CALC_BANK.map((x,i)=>`<button class="btn ${i===calcIndex?'':'secondary'}" data-calc-index="${i}">${esc(x.t)}</button>`).join('')}</div><section class="panel"><span class="pill">직접 제작한 연습 · ${calcIndex+1}/${CALC_BANK.length}</span><h2 class="question">${esc(c.q)}</h2><p class="small muted">키보드 위쪽 숫자키와 숫자패드 1~5 모두 사용 가능합니다.</p><div class="choices">${c.a.map((a,i)=>`<button class="choice ${calcAnswer===i+1?(calcAnswer===c.ok?'correct':'wrong'):''}" data-calc-choice="${i+1}" ${calcAnswer?'disabled':''}><span class="option-index">${i+1}</span>${esc(a)}</button>`).join('')}</div><div class="quiz-nav"><button class="btn secondary" data-calc-hint>짧은 공식 ${calcHint?'접기':'보기'}</button><button class="btn" data-calc-next>다음 유형 →</button></div>${calcHint||calcAnswer?`<div class="callout"><strong>한 줄 공식</strong><p>${esc(c.f)}</p></div>`:''}${calcAnswer?`<div class="explanation" role="status"><strong>${calcAnswer===c.ok?'정답':'다시 기억하기'} · ${c.ok}번</strong><p>${esc(c.fast)}</p><p>${esc(c.guard)}</p><button class="btn secondary" data-calc-retry>다시 풀기</button></div>`:''}<p class="small muted">기출 출제개념을 연습하는 창작 문항입니다. 시중 교재 전체의 풀이속도를 비교·검증한 결과는 아닙니다.</p></section>`;}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-calc-index],[data-calc-choice],[data-calc-next],[data-calc-hint],[data-calc-retry]');if(!t)return;
 if(t.hasAttribute('data-calc-index')){calcIndex=Number(t.dataset.calcIndex);calcAnswer=0;calcHint=false;}
 else if(t.hasAttribute('data-calc-choice')){if(calcAnswer)return;calcAnswer=Number(t.dataset.calcChoice);}
 else if(t.hasAttribute('data-calc-next')){calcIndex=(calcIndex+1)%CALC_BANK.length;calcAnswer=0;calcHint=false;}
 else if(t.hasAttribute('data-calc-retry')){calcAnswer=0;calcHint=false;}
 else calcHint=!calcHint;
 render();
});

const CHALK_COLORS=['#fffdf2','#ffe397','#ffb8cc','#b5edca'];
const CHALK_NAMES=['하양','노랑','분홍','연두'];
let typingRecall=false,typingResult=false;
function chalkState(){if(!state.chalk||typeof state.chalk!=='object')state.chalk={};const c=state.chalk;if(!Number.isInteger(c.color)||c.color<0||c.color>3)c.color=0;for(const k of ['notes','practice'])if(!c[k]||typeof c[k]!=='object'||Array.isArray(c[k]))c[k]={};return c;}
function typingItems(){if(state.typingMode==='theory')return theory().map(c=>({...c,label:c.t}));if(state.typingMode==='official'){const [a,b]=examRange(),items=[];for(const y of EXAMS.filter(y=>state.typingYear==='all'||!state.typingYear||y.year===Number(state.typingYear)))for(let n=a;n<=b;n++){try{const q=officialSpeech(y.year,n);items.push({id:`official-${y.year}-${n}`,t:q.label,label:q.label,fact:q.question+'\n\n'+q.answers.join('\n'),year:y.year,number:n});}catch{}}return items;}return quizzes().map((q,i)=>({id:'type-'+q.id,t:`연습 ${i+1} · ${q.topic}`,label:`연습 ${i+1} · ${q.topic}`,fact:q.q+'\n\n'+q.a[q.ok-1]}));}
function typingConcept(){const cs=typingItems();state.typingPick=Math.max(0,Math.min(Number(state.typingPick)||0,cs.length-1));return cs[state.typingPick]||{id:'empty-'+state.subject,t:'등록된 공식 문항 없음',fact:''};}
function chalkRecord(kind,key){const c=chalkState();let r=c[kind][key];if(!r||typeof r!=='object'||typeof r.text!=='string')r=c[kind][key]={text:'',colors:[]};if(!Array.isArray(r.colors))r.colors=[];return r;}
function chalkPalette(){const selected=chalkState().color;return `<div class="chalk-toolbar"><h2>분필 색</h2>${CHALK_NAMES.map((n,i)=>`<button class="chalk-swatch" data-chalk-color="${i}" aria-label="${n} 분필 · Control ${i+1}" aria-pressed="${selected===i}" style="--swatch:${CHALK_COLORS[i]}"><span></span></button>`).join('')}<span class="chalk-shortcut">Ctrl + 1 / 2 / 3 / 4 · 브라우저에서 단축키를 가로채면 색 버튼 사용</span></div>`;}
function chalkEditor(kind,key,label){return `<div class="chalk-editor" data-chalk-kind="${kind}" data-chalk-key="${esc(key)}"><div class="chalk-mirror" aria-hidden="true"></div><textarea aria-label="${label}" spellcheck="false" autocomplete="off" maxlength="12000" placeholder=""></textarea></div>`;}
function chalkFooter(){return `<section class="chalk-zone" aria-label="칠판 자유 필기">${chalkPalette()}<label>칠판 아래 자유롭게 적기 · ${esc(subject().short)} 필기 자동 저장</label>${chalkEditor('notes',state.subject,'칠판 자유 필기')}${inkPad('notes-'+state.subject)}<div class="chalk-feedback" data-note-status role="status">이 브라우저에 저장됩니다.</div></section>`;}
function renderTyping(){const c=typingConcept(),items=typingItems();return `<section class="chalk-practice"><span class="ticket-line">QUESTION → CORRECT ANSWER / TYPE TO REMEMBER</span><h1>문제와 정답을 손끝으로 기억하세요.</h1>${tabs()}<div class="typing-choices">${[['quiz','기출형 연습'],['official','공식 기출 · 최근 5개년'],['theory','핵심 이론']].map(([v,n])=>`<button class="chalk-plain-btn" data-typing-source="${v}" aria-pressed="${state.typingMode===v}">${n}</button>`).join('')}</div>${state.typingMode==='official'?`<div class="typing-years" role="group" aria-label="타이핑 기출 연도">${[['all','최근 5개년'],...[2025,2024,2023,2022,2021].map(y=>[String(y),y+'년'])].map(([v,label])=>`<button data-typing-year="${v}" aria-pressed="${String(state.typingYear||'all')===v}">${label}</button>`).join('')}</div>`:''}<label for="typing-item">연습 문항 · ${items.length}개</label><select class="chalk-select" id="typing-item" ${items.length?'':'disabled'}>${items.map((x,i)=>`<option value="${i}" ${i===state.typingPick?'selected':''}>${esc(x.label)}</option>`).join('')}</select>${state.typingMode==='official'?`<p class="small">최근 5개년(2021~2025) 전체 400문항 등록 완료 · 현재 과목 학습 가능 ${items.length}문항. 전원정답 문항은 이어학습에서 제외합니다. 추가 문항은 <button class="panel-link" data-go="listen">문제·정답 듣기에서 원문 등록</button> 후 연습할 수 있습니다.</p>`:'<p class="small">문제 문장과 정답 선지만 따라 씁니다. 오답 지문은 표시하지 않습니다.</p>'}<div class="memory-tools"><button class="chalk-plain-btn" data-typing-mode>${typingRecall?'원문 보이기':'문장 가리고 능동회상'}</button><button class="chalk-plain-btn" data-typing-reset>처음부터</button><button class="chalk-plain-btn" data-typing-next>다음 문항 →</button></div><div class="chalk-zone typing-board">${chalkPalette()}<div class="typing-live" id="typing-metrics" aria-live="off">타수 0 · 정확도 100% · 0초</div><section class="typing-source-card" aria-label="고정 원문"><h2>문제 · 정답 원문</h2><div class="typing-source-text">${typingRecall?'원문을 가렸습니다. 기억나는 문장을 아래에 입력하세요.':esc(c.fact)}</div></section><label class="typing-input-label">나의 입력</label>${chalkEditor('practice',c.id,'문제와 정답 타이핑')}<div class="chalk-feedback" id="typing-feedback" role="status"></div></div><p class="small">위 고정 원문을 보고 아래 입력란에 입력하세요. 맞은 글자는 분필 색으로, 다른 글자는 분홍색으로 표시합니다. 한글 조합 중에는 기록을 확정하지 않습니다.</p><div id="typing-comparison"></div><section class="typing-history"><h2>나의 타이핑 기록</h2><div id="typing-history-list">${typingHistoryHtml()}</div></section></section>`;}
function typingHistoryHtml(){const rows=(Array.isArray(state.typingHistory)?state.typingHistory:[]).filter(x=>x.subject===state.subject).slice(-20).reverse();return rows.length?`<div class="typing-history-scroll"><table><thead><tr><th>문항</th><th>타수/분</th><th>정확도</th><th>시간</th><th>날짜</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.label)}</td><td>${x.cpm}</td><td>${x.accuracy}%</td><td>${x.seconds}초</td><td>${new Date(x.at).toLocaleString('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td></tr>`).join('')}</tbody></table></div>`:'<p class="small">문장을 끝까지 입력하면 타수·정확도·소요시간이 여기에 저장됩니다.</p>';}
function typingStats(input,target,started){const a=Array.from(input.normalize('NFC')),b=Array.from(target.normalize('NFC'));let hit=0;a.forEach((x,i)=>{if(x===b[i])hit++;});const seconds=started?Math.max(1,Math.round((Date.now()-started)/1000)):0;return {cpm:seconds?Math.round(a.length*60/seconds):0,accuracy:a.length?Math.round(hit/a.length*100):100,seconds,hit};}
function typingGhost(el){const c=typingConcept(),r=chalkRecord('practice',c.id),a=Array.from(r.text.normalize('NFC')),b=Array.from(c.fact.normalize('NFC')),mirror=el.querySelector('.chalk-mirror');if(!c.fact){mirror.innerHTML='<span class="chalk-placeholder">등록된 문항이 없습니다. 원문을 등록한 후 시작하세요.</span>';el.querySelector('textarea').disabled=true;return;}let offset=0;mirror.innerHTML=(a.length?a.map((ch,i)=>{const col=CHALK_COLORS[r.colors[offset]]||CHALK_COLORS[0];offset+=ch.length;const wrong=ch!==b[i];return `<span class="ghost-letter ${wrong?'type-wrong':'type-correct'}" style="${wrong?'':'color:'+col}">${esc(ch)}</span>`;}).join(''):'<span class="chalk-placeholder">위 원문을 보고 여기에 입력하세요…</span>')+'\n';const area=el.querySelector('textarea');const h=Math.max(250,mirror.scrollHeight);el.style.minHeight=h+'px';area.style.height=h+'px';}

function chalkReconcile(oldText,newText,oldColors,color){let a=0;while(a<oldText.length&&a<newText.length&&oldText[a]===newText[a])a++;let b=0;while(b<oldText.length-a&&b<newText.length-a&&oldText[oldText.length-1-b]===newText[newText.length-1-b])b++;return [...oldColors.slice(0,a),...Array(newText.length-a-b).fill(color),...(b?oldColors.slice(oldText.length-b):[])];}
function chalkPaint(el,fresh=false){if(el.dataset.chalkKind==='practice'&&state.view==='typing'&&!typingRecall){typingGhost(el);return;}const r=chalkRecord(el.dataset.chalkKind,el.dataset.chalkKey),mirror=el.querySelector('.chalk-mirror');mirror.innerHTML=r.text?(()=>{let pos=0;return Array.from(r.text).map(ch=>{const offset=pos;pos+=ch.length;const col=CHALK_COLORS[r.colors[offset]]||CHALK_COLORS[0];return `<span class="chalk-letter ${fresh&&offset>=r.text.length-2?'fresh':''}" style="color:${col}">${esc(ch)}</span>`;}).join('');})()+'\n':'<span class="chalk-placeholder">여기에 분필로 적어 보세요…</span>';const area=el.querySelector('textarea');el.style.minHeight=Math.max(210,mirror.scrollHeight)+'px';area.style.height=Math.max(210,mirror.scrollHeight)+'px';}
function chalkMount(){document.querySelectorAll('.chalk-editor').forEach(el=>{el.querySelector('textarea').value=chalkRecord(el.dataset.chalkKind,el.dataset.chalkKey).text;chalkPaint(el);});typingFeedback();}
const typingNormalize=t=>t.normalize('NFC').replace(/[\s\p{P}]/gu,'');
function typingFeedback(){const el=document.getElementById('typing-feedback');if(!el)return;const c=typingConcept(),r=chalkRecord('practice',c.id);if(!c.fact){el.textContent='원문과 정답이 등록된 문항을 선택하세요.';return;}const previous=r.committed||'';if(previous!==r.text){let prefix=0;while(prefix<previous.length&&prefix<r.text.length&&previous[prefix]===r.text[prefix])prefix++;let suffix=0;while(suffix<previous.length-prefix&&suffix<r.text.length-prefix&&previous[previous.length-1-suffix]===r.text[r.text.length-1-suffix])suffix++;const fresh=r.text.slice(prefix,r.text.length-suffix);r.entered=(r.entered||0)+fresh.length;r.errors=(r.errors||0)+Array.from(fresh).filter((ch,i)=>ch!==c.fact[prefix+i]).length;r.committed=r.text;}const stats=r.recorded&&r.finalStats?{...r.finalStats}:typingStats(r.text,c.fact,r.started);if(r.entered)stats.accuracy=Math.max(0,Math.round((r.entered-(r.errors||0))/r.entered*100));const metrics=document.getElementById('typing-metrics');if(metrics)metrics.textContent=`타수 ${stats.cpm} /분 · 정확도 ${stats.accuracy}% · ${stats.seconds}초`;const done=r.text.normalize('NFC').trim()===c.fact.normalize('NFC').trim();el.textContent=done?'✓ 입력 완료 · 학습 기록을 저장했습니다.':typingRecall?'기억나는 문제와 정답을 입력하세요.':'위 원문을 보고 아래 입력란에 입력하세요.';if(done&&!r.recorded){r.recorded=true;r.finalStats={...stats};if(!Array.isArray(state.typingHistory))state.typingHistory=[];state.typingHistory.push({id:c.id,label:c.t,subject:state.subject,at:Date.now(),...stats});state.typingHistory=state.typingHistory.slice(-200);save();const list=document.getElementById('typing-history-list');if(list)list.innerHTML=typingHistoryHtml();}}

document.addEventListener('input',e=>{const el=e.target.closest('.chalk-editor');if(!el||e.target.tagName!=='TEXTAREA')return;const r=chalkRecord(el.dataset.chalkKind,el.dataset.chalkKey),text=e.target.value;if(el.dataset.chalkKind==='practice'&&text&&!r.started)r.started=Date.now();if(el.dataset.chalkKind==='practice'&&!text){r.started=0;r.recorded=false;r.entered=0;r.errors=0;r.committed='';r.finalStats=null;}r.colors=chalkReconcile(r.text,text,r.colors,chalkState().color);r.text=text;chalkPaint(el,!e.isComposing);if(!e.isComposing){typingFeedback();save();}});
document.addEventListener('compositionend',e=>{if(e.target.closest('.chalk-editor')){typingFeedback();save();}});

function inkMount(){inkResizeObserver?.disconnect();inkResizeObserver=new ResizeObserver(entries=>entries.forEach(({target})=>target.__inkResize?.()));document.querySelectorAll('.ink-pad').forEach(pad=>{

let ttsToken=0,ttsUtterance=null,ttsQueue=[],ttsPosition=0,ttsVoices=[],installPrompt=null;
function ttsSettings(){if(!state.tts||typeof state.tts!=='object')state.tts={};const t=state.tts;t.rate=Math.min(2,Math.max(.75,Number(t.rate)||1.5));if(typeof t.voice!=='string')t.voice='';return t;}

function officialSpeech(y,n){const r=officialEntry(y,n),ks=state.importedKeys[y]||KEYS[y],correct=ks&&normalKey(ks[n-1]);if(!r?.verified||!r.question?.trim()||!Array.isArray(r.options)||r.options.length!==5||r.options.some(a=>!a?.trim()))throw Error('문제와 5개 지문을 등록하고 원문 대조 확인을 해주세요.');if(!correct?.length||correct.some(x=>x<1||x>5))throw Error('해당 연도의 최종정답을 먼저 등록하세요.');if(correct.length===5)throw Error('모두 정답 처리된 문항은 특정 정답 지문을 읽지 않습니다.');return {label:`${y}년도 ${subject().label} ${n}번`,question:r.question.trim(),answers:correct.map(i=>r.options[i-1].trim())};}

function speechSegments(items){return items.flatMap(q=>[`${q.label}. ${q.question}`,...q.answers.map(a=>'정답 지문. '+a)]);}

function ttsChosenVoice(){const settings=ttsSettings(),ko=ttsVoices.filter(v=>/^ko(?:-|_)/i.test(v.lang)||v.lang==='ko');return ko.find(v=>v.voiceURI===settings.voice)||ko.find(v=>/sunhi|heami|yuna|sora|서연|유나|소라|여성/i.test(v.name))||ko[0];}
function ttsPlay(items){if(ttsSettings().engine==='neural'){neuralSpeak(items);return;}ttsStop(false);if(!('speechSynthesis' in window)||!window.SpeechSynthesisUtterance){toast('이 브라우저는 음성 읽기를 지원하지 않습니다.');return;}ttsVoices=window.speechSynthesis.getVoices();const voice=ttsChosenVoice();if(!voice){toast('한국어 TTS 음성을 기기 설정에서 설치한 후 다시 열어주세요.');return;}ttsQueue=speechSegments(items);const token=ttsToken;ttsPosition=0;
 const next=()=>{if(token!==ttsToken)return;if(ttsPosition>=ttsQueue.length){ttsStop(false);const el=document.getElementById('listen-status');if(el)el.textContent='재생 완료';return;}const text=ttsQueue[ttsPosition++],u=new SpeechSynthesisUtterance(text);ttsUtterance=u;u.voice=voice;u.lang='ko-KR';u.rate=ttsSettings().rate;u.pitch=1;u.onend=next;u.onerror=e=>{if(token!==ttsToken)return;ttsStop(false);toast('음성 재생 실패: '+e.error);};const bar=document.getElementById('listen-bar');bar.hidden=false;document.getElementById('listen-now').textContent=`${ttsPosition}/${ttsQueue.length} · ${text.slice(0,55)}`;bar.querySelector('[data-tts-pause]').textContent='일시정지';window.speechSynthesis.speak(u);};next();}

function renderListen(){const r=spokenRecord(),t=ttsSettings();return `${titleBlock('문제를 듣고, 정답 문장만 기억하기','오답 지문과 해설은 읽지 않습니다. 기본 1.5배속 · 음색은 미리 듣고 선택하세요.','LISTEN / QUESTION + CORRECT ANSWER')}${tabs()}<div class="registration-summary">최근 5개년 400문항 등록 · 395문항 타이핑/TTS · 전원정답 5문항 제외</div><div class="listen-grid"><section class="panel listen-form"><h2>목소리와 속도</h2>${neuralPanel()}<label for="tts-voice">한국어 음성</label><select class="field" id="tts-voice">${ttsVoiceOptions()}</select><p class="small muted">제공되는 음성은 기기마다 다릅니다. 원하는 여성 음색을 미리듣기로 골라주세요.</p><label for="tts-rate">읽기 속도 <output id="tts-rate-label">${t.rate}배</output></label>${ttsRateButtons()}<input id="tts-rate" type="range" min="0.75" max="2" step="0.05" value="${t.rate}" style="width:100%"><div class="listen-controls"><button class="btn secondary" data-tts-preview>목소리 미리듣기</button><button class="btn secondary" data-tts-stop>정지</button></div><hr class="rule"><h3>바로 듣는 창작 연습</h3><p class="small muted">현재 과목의 문제 → 정답 지문 순서로 재생합니다.</p><div class="listen-controls"><button class="btn" data-tts-practice>현재 연습문제 듣기</button><button class="btn secondary" data-tts-practice-all>과목 연습 전체 듣기</button></div><div class="listen-status" id="listen-status" role="status"></div><div class="callout">모바일에서 첫 재생은 버튼을 눌러 시작하세요. 화면 잠금·백그라운드에서는 기기 정책에 따라 멈출 수 있습니다.</div></section><section class="panel listen-form"><h2>10개년 공식 기출 듣기</h2><div class="flex"><select class="field" id="tts-year" style="width:auto" aria-label="기출 연도">${EXAMS.map(y=>`<option value="${y.year}" ${y.year===state.year?'selected':''}>${y.year}년</option>`).join('')}</select><select class="field" id="tts-number" style="width:auto" aria-label="문제 번호">${Array.from({length:40},(_,i)=>examRange()[0]+i).map(n=>`<option value="${n}" ${n===state.examQuestion?'selected':''}>${n}번</option>`).join('')}</select></div><p class="small muted">PDF의 실제 문장과 ①~⑤ 지문을 등록하세요. 정답은 해당 연도의 최종답안표로 선택합니다. 2021~2025년 400문항은 이미 등록되어 있습니다. 연도·번호를 선택하면 문장이 자동으로 채워집니다.</p><label for="tts-source">①~⑤       return {key:'theory:'+c.id,label:c.label||c.t,kind:'theory'};
    }
    if (s === 'quiz') {
      const q=quizzes()[state.quizIndex];
      return {key:'practice:'+(q?.id||'first'),label:'연습 '+(state.quizIndex+1)+'번',kind:'quiz'};
    }

    const idx=availablePractice().findIndex(item=>item.id===q?.id);

  }
  function questionNavigation(ctx) {

    }).join('');

    return `<div class="ck-rail-workspace" aria-label="문항별 학습 작업 공간">
      <section class="ck-memo-card">
        <div class="ck-memo-head"><div><span class="ck-kicker">MY STUDY NOTES / LOCAL JSON</span><h3>${esc(ctx.label)} · 학습 메모</h3></div></div>

  function updateStats(){
