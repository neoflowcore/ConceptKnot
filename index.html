":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-35":{"id":"2022-35","year":2022,"number":35,"subject":"estate","question":"감가수정에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 감가수정과 관련된 내용연수는 경제적 내용연수가 아닌 물리적 내용연수를 의미한다.\nㄴ. 대상물건에 대한 재조달원가를 감액할 요인이 있는 경우에는 물리적 감가, 기능적 감가, 경제적 감가 등을 고려한다.\nㄷ. 감가수정방법에는 내용연수법, 관찰감가법, 분해법 등이 있다.\nㄹ. 내용연수법으로는 정액법, 정률법, 상환기금법이 있다.\nㅁ. 정률법은 매년 일정한 감가율을 곱하여 감가액을 구하는 방법으로 매년 감가액이 일정하다.","options":["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄷ, ㄹ, ㅁ"],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/budongsan/35","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-35","score":1.0,"pdfChars":310,"mirrorChars":303},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-36":{"id":"2022-36","year":2022,"number":36,"subject":"estate","question":"감정평가에 관한 규칙상 시장가치기준에 관한 설명으로 틀린 것은?","options":["대상물건에 대한 감정평가액은 원칙적으로 시장가치를 기준으로 결정한다.","감정평가법인등은 법령에 다른 규정이 있는 경우에는 대상물건의 감정평가액을 시장가치 외의 가치를 기준으로 결정할 수 있다.","감정평가법인등은 대상물건의 특성에 비추어 사회통념상 필요하다고 인정되는 경우에는 대상물건의 감정평가액을 시장가치 외의 가치를 기준으로 결정할 수 있다.","감정평가법인등은 감정평가 의뢰인이 요청하여 시장가치 외의 가치를 기준으로 감정평가할 때에는 해당 시장가치 외의 가치의 성격과 특징을 검토하지 않는다.","감정평가법인등은 시장가치 외의 가치를 기준으로 하는 감정평가의 합리성 및 적법성이 결여(缺如)되었다고 판단할 때에는 의뢰를 거부하거나 수임(受任)을 철회할 수 있다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/budongsan/36","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5, ,"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/42","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-42","score":1.0,"pdfChars":324,"mirrorChars":315},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-43":{"id":"2022-43","year":2022,"number":43,"subject":"civil","question":"통정허위표시(민법 제108조)에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["통정허위표시는 표의자가 의식적으로 진의와 다른 표시를 한다는 것을 상대방이 알았다면 성립한다.","가장행위가 무효이면 당연히 은닉행위도 무효이다.","대리인이 본인 몰래 대리권의 범위 안에서 상대방과 통정허위표시를 한 경우, 본인은 선의의 제3자로서 그 유효를 주장할 수 있다.","민법 제108조제2항에 따라 보호받는 선의의 제3자에 대해서는 그 누구도 통정허위표시의 무효로써 대항할 수 없다.","가장소비대차에 따른 대여금채권의 선의의 양수인은 민법 제108조제2항에 따라 보호받는 제3자가 아니다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/43","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-43","score":1.0,"pdfChars":337,"mirrorChars":327},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-44":{"id":"2022-44","year":2022,"number":44,"subject":"civil","question":"토지거래허가구역 내의 토지에 대한 매매계약이 체결된 경우(유동적 무효)에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 해약금으로서 계약금만 지급된 상태에서 당사자가 관할관청에 허가를 신청하였다면 이는 이행의 착수이므로 더 이상 계약금에 기한 해제는 허용되지 않는다.\nㄴ. 당사자 일방이 토지거래허가 신청절차에 협력할 의무를 이행하지 않는다면 다른 일방은 그 이행을 소구할 수 있다.\nㄷ. 매도인의 채무가 이행불능임이 명백하고 매수인도 거래의 존속을 바라지 않는 경우, 위 매매계약은 확정적 무효로 된다.\nㄹ. 위 매매계약 후 토지거래허가구역 지정이 해제되었다고 해도 그 계약은 여전히 유동적 무효이다.","options":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/44","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-44","score":1.0,"pdfChars":400,"mirrorChars":388},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-45":{"id":"2022-45","year":2022,"number":45,"subject":"civil","question":"법률행위의 취소에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["제한능력자가 제한능력을 이유로 자신의 법률행위를 취소하기 위해서는 법정대리인의 동의를 받아야 한다.","취소권은 추인할 수 있는 날로부터 3년 내에, 법률행위를 한 날로부터 10년 내에 행사하여야 한다.","취소된 법률행위는 특별한 사정이 없는 한 처음부터 무효인 것으로 본다.","제한능력을 이유로 법률행위가 취소된 경우, 제한능력자는 그 법률행위에 의해 받은 급부를 이익이 현존하는 한도에서 상환할 책임이 있다.","취소할 수 있는 법률행위에 대해 취소권자가 적법하게 추인하면 그의 취소권은 소멸한다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/45","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-45","score":1.0,"pdfChars":328,"mirrorChars":320},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-46":{"id":"2022-46","year":2022,"number":46,"subject":"civil","question":"조건에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["조건성취의 효력은 특별한 사정이 없는 한 소급하지 않는다.","해제조건이 선량한 풍속 기타 사회질서에 위반한 것인 때에는 특별한 사정이 없는 한 조건 없는 법률행위로 된다.","정지조건과 이행기로서의 불확정기한은 표시된 사실이 발생하지 않는 것으로 확정된 때에 채무를 이행하여야 하는지 여부로 구별될 수 있다.","이행지체의 경우 채권자는 상당한 기간을 정한 최고와 함께 그 기간 내에 이행이 없을 것을 정지조건으로 하여 계약을 해제할 수 있다.","신의성실에 반하는 방해로 말미암아 조건이 성취된 것으로 의제되는 경우, 성취의 의제시점은 그 방해가 없었더라면 조건이 성취되었으리라고 추산되는 시점이다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/46","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-46","score":1.0,"pdfChars":379,"mirrorChars":369},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-47":{"id":"2022-47","year":2022,"number":47,"subject":"civil","question":"甲은 그 소유의 X건물을 매도하기 위하여 乙에게 대리권을 수여하였다. 이에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["乙이 사망하면 특별한 사정이 없는 한 乙의 상속인에게 그 대리권이 승계된다.","乙은 특별한 사정이 없는 한 X건물의 매매계약에서 약정한 중도금이나 잔금을 수령할 수 있다.","甲의 수권행위는 묵시적인 의사표시에 의하여도 할 수 있다.","乙이 대리행위를 하기 전에 甲이 그 수권행위를 철회한 경우, 특별한 사정이 없는 한 乙의 대리권은 소멸한다.","乙은 甲의 허락이 있으면 甲을 대리하여 자신을 X건물의 매수인으로 하는 계약을 체결할 수 있다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/47","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-47","score":1.0,"pdfChars":329,"mirrorChars":320},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-48":{"id":"2022-48","year":2022,"number":48,"subject":"civil","question":"민법상 대리에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["임의대리인이 수인(數人)인 경우, 대리인은 원칙적으로 공동으로 대리해야 한다.","대리행위의 하자로 인한 취소권은 원칙적으로 대리인에게 귀속된다.","대리인을 통한 부동산거래에서 상대방 앞으로 소유권이전등기가 마쳐진 경우, 대리권 유무에 대한 증명책임은 대리행위의 유효를 주장하는 상대방에게 있다.","복대리인은 대리인이 자신의 이름으로 선임한 대리인의 대리인이다.","법정대리인은 특별한 사정이 없는 한 그 책임으로 복대리인을 선임할 수 있다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/48","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-48","score":1.0,"pdfChars":294,"mirrorChars":285},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-49":{"id":"2022-49","year":2022,"number":49,"subject":"civil","question":"권한을 넘은 표현대리에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["기본대리권이 처음부터 존재하지 않는 경우에도 표현대리는 성립할 수 있다.","복임권이 없는 대리인이 선임한 복대리인의 권한은 기본대리권이 될 수 없다.","대리행위가 강행규정을 위반하여 무효인 경우에도 표현대리는 성립할 수 있다.","법정대리권을 기본대리권으로 하는 표현대리는 성립할 수 없다.","상대방이 대리인에게 대리권이 있다고 믿을 만한 정당한 이유가 있는지의 여부는 대리행위 당시를 기준으로 판정한다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/49","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-49","score":1.0,"pdfChars":280,"mirrorChars":270},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-50":{"id":"2022-50","year":2022,"number":50,"subject":"civil","question":"대리권 없는 甲은 乙 소유의 X부동산에 관하여 乙을 대리하여 丙과 매매계약을 체결하였고, 丙은 甲이 무권대리인이라는 사실에 대하여 선의·무과실이었다. 이에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["丙이 乙에 대하여 상당한 기간을 정하여 추인여부를 최고하였으나 그 기간 내에 乙이 확답을 발하지 않은 때에는 乙이 추인한 것으로 본다.","乙이 甲에 대해서만 추인의 의사표시를 하였더라도 丙은 乙의 甲에 대한 추인이 있었음을 주장할 수 있다.","乙이 甲에게 매매계약을 추인하더라도 그 사실을 알지 못하고 있는 丙은 매매계약을 철회할 수 있다.","乙이 丙에 대하여 추인하면 특별한 사정이 없는 한, 추인은 매매계약 체결 시에 소급하여 그 효력이 생긴다.","乙이 丙에게 추인을 거절한 경우, 甲이 제한능력자가 아니라면 甲은 丙의 선택에 따라 계약을 이행할 책임 또는 손해를 배상할 책임이 있다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/50","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-50","score":0.9985,"pdfChars":459,"mirrorChars":448},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-51":{"id":"2022-51","year":2022,"number":51,"subject":"civil","question":"토지를 점유할 수 있는 물권을 모두 고른 것은?\n\nㄱ. 전세권\nㄴ. 지상권\nㄷ. 저당권\nㄹ. 임차권","options":["ㄱ","ㄱ, ㄴ","ㄱ, ㄹ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/51","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-51","score":1.0,"pdfChars":89,"mirrorChars":85},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-52":{"id":"2022-52","year":2022,"number":52,"subject":"civil","question":"점유에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["제3자가 직접점유자의 점유를 방해한 경우, 특별한 사정이 없는 한 간접점유자에게는 점유권에 기한 방해배제청구권이 인정되지 않는다.","취득시효의 요건인 점유에는 간접점유가 포함되지 않는다.","소유권의 시효취득을 주장하는 점유자는 특별한 사정이 없는 한 자신의 점유가 자주점유에 해당함을 증명하여야 한다.","선의의 점유자가 본권에 관한 소에 패소한 경우, 그 자는 패소가 확정된 때부터 악의의 점유자로 본다.","양도인이 등기부상의 명의인과 동일인이며 그 명의를 의심할 만한 특별한 사정이 없는 경우, 그 부동산을 양수하여 인도받은 자는 과실(過失) 없는 점유자에 해당한다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/52","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-52","score":1.0,"pdfChars":365,"mirrorChars":354},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-53":{"id":"2022-53","year":2022,"number":53,"subject":"civil","question":"물권적 청구권에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 지상권을 설정한 토지의 소유자는 그 토지 일부의 불법점유자에 대하여 소유권에 기한 방해배제를 청구할 수 없다.\nㄴ. 토지의 소유권을 양도하여 소유권을 상실한 전(前)소유자도 그 토지 일부의 불법점유자에 대하여 소유권에 기한 방해배제를 청구할 수 있다.\nㄷ. 소유자는 자신의 소유권을 방해할 염려있는 행위를 하는 자에 대하여 그 예방이나 손해배상의 담보를 청구할 수 있다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/53","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-53","score":1.0,"pdfChars":298,"mirrorChars":287},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-54":{"id":"2022-54","year":2022,"number":54,"subject":"civil","question":"점유자와 회복자의 관계에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["악의의 점유자가 점유물의 과실을 수취하여 소비한 경우, 특별한 사정이 없는 한 그 점유자는 그 과실의 대가를 보상하여야 한다.","은비(隱秘)에 의한 점유자는 점유물의 과실을 수취할 권리가 있다.","점유물의 전부가 점유자의 책임있는 사유로 멸실된 경우, 선의의 자주점유자는 특별한 사정이 없는 한 그 멸실로 인한 손해의 전부를 배상해야 한다.","점유자는 특별한 사정이 없는 한 회복자가 점유물의 반환을 청구하기 전에도 그 점유물의 반환 없이 그 회복자에게 유익비상환청구권을 행사할 수 있다.","악의의 점유자는 특별한 사정이 없는 한 점유물에 지출한 통상의 필요비의 상환을 청구할 수 없다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/54","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-54","score":1.0,"pdfChars":387,"mirrorChars":374},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-55":{"id":"2022-55","year":2022,"number":55,"subject":"civil","question":"민법상 상린관계에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 토지 주변의 소음이 사회통념상 수인한도를 넘지 않은 경우에도 그 토지소유자는 소유권에 기하여 소음피해의 제거를 청구할 수 있다.\nㄴ. 우물을 파는 경우에 경계로부터 2미터 이상의 거리를 두어야 하지만, 당사자 사이에 이와 다른 특약이 있으면 그 특약이 우선한다.\nㄷ. 토지소유자가 부담하는 자연유수의 승수의무(承水義務)에는 적극적으로 그 자연유수의 소통을 유지할 의무가 포함된다.","options":["ㄱ","ㄴ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/55","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-55","score":1.0,"pdfChars":295,"mirrorChars":287},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-56":{"id":"2022-56","year":2022,"number":56,"subject":"civil","question":"소유권의 취득에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["저당권 실행을 위한 경매절차에서 매수인이 된 자가 매각부동산의 소유권을 취득하기 위해서는 소유권이전등기를 완료하여야 한다.","무주(無主)의 부동산을 점유한 자연인은 그 부동산의 소유권을 즉시 취득한다.","점유취득시효에 따른 부동산소유권 취득의 효력은 시효취득자가 이전등기를 한 이후부터 발생한다.","타인의 토지에서 발견된 매장물은 특별한 사정이 없는 한 발견자가 단독으로 그 소유권을 취득한다.","타주점유자는 자신이 점유하는 부동산에 대한 소유권을 시효취득할 수 없다."],"correct":[3,5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/56","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-56","score":1.0,"pdfChars":311,"mirrorChars":303},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-57":{"id":"2022-57","year":2022,"number":57,"subject":"civil","question":"민법상 공동소유에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["공유자끼리 그 지분을 교환하는 것은 지분권의 처분이므로 이를 위해서는 교환당사자가 아닌 다른 공유자의 동의가 필요하다.","부동산 공유자 중 일부가 자신의 공유지분을 포기한 경우, 등기를 하지 않아도 공유지분 포기에 따른 물권변동의 효력이 발생한다.","합유자 중 1인은 다른 합유자의 동의 없이 자신의 지분을 단독으로 제3자에게 유효하게 매도할 수 있다.","합유물에 관하여 경료된 원인 무효의 소유권이전등기의 말소를 구하는 소는 합유자 각자가 제기할 수 있다.","법인 아닌 종중이 그 소유 토지의 매매를 중개한 중개업자에게 중개수수료를 지급하기로 하는 약정을 체결하는 것은 총유물의 관리·처분행위에 해당한다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/57","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-57","score":0.9982,"pdfChars":393,"mirrorChars":381},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-58":{"id":"2022-58","year":2022,"number":58,"subject":"civil","question":"1필의 토지의 일부를 객체로 할 수 없는 권리는?(다툼이 있으면 판례에 따름)","options":["저당권","전세권","지상권","임차권","점유권"],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/58","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-58","score":1.0,"pdfChars":74,"mirrorChars":68},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-59":{"id":"2022-59","year":2022,"number":59,"subject":"civil","question":"2019. 8. 1. 甲은 乙에게 2억 원(대여기간 1년, 이자 월 1.5%)을 대여하면서 乙 소유 X토지(가액 3억 원)에 근저당권(채권최고액 2억 5천만 원)을 취득하였고, 2020. 7. 1. 丙은 乙에게 1억 원(대여기간 1년, 이자 월 1%)을 대여하면서 X토지에 2번 근저당권(채권최고액 1억 5천만 원)을 취득하였다. 甲과 丙이 변제를 받지 못한 상황에서 丙이 2022. 6. 1. X토지에 관해 근저당권 실행을 위한 경매를 신청하면서 배당을 요구한 경우, 이에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 2022. 6. 1. 甲의 근저당권의 피담보채권액은 확정되지 않는다.\nㄴ. 甲에게 2022. 6. 1. 이후에 발생한 지연이자는 채권최고액의 범위 내라도 근저당권에 의해 담보되지 않는다.\nㄷ. 甲이 한 번도 이자를 받은 바 없고 X토지가 3억 원에 경매되었다면 甲은 경매대가에서 3억 원을 변제받는다.","options":["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/59","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-59","score":1.0,"pdfChars":507,"mirrorChars":496},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-60":{"id":"2022-60","year":2022,"number":60,"subject":"civil","question":"법률에 특별한 규정 또는 설정행위에 다른 약정이 없는 경우, 저당권의 우선변제적 효력이 미치는 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 토지에 저당권이 설정된 후 그 토지 위에 완공된 건물\nㄴ. 토지에 저당권이 설정된 후 토지소유자가 그 토지에 매설한 유류저장탱크\nㄷ. 저당토지가 저당권 실행으로 압류된 후 그 토지에 관하여 발생한 저당권설정자의 차임채권\nㄹ. 토지에 저당권이 설정된 후 토지의 전세권자가 그 토지에 식재하고 등기한 입목","options":["ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/60","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-60","score":1.0,"pdfChars":294,"mirrorChars":287},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-61":{"id":"2022-61","year":2022,"number":61,"subject":"civil","question":"민법상 유치권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["유치권자는 유치물에 대한 경매신청권이 없다.","유치권자는 유치물의 과실인 금전을 수취하여 다른 채권보다 먼저 피담보채권의 변제에 충당할 수 있다.","유치권자는 채무자의 승낙 없이 유치물을 담보로 제공할 수 있다.","채권자가 채무자를 직접점유자로 하여 간접점유하는 경우에도 유치권은 성립한다.","유치권자는 유치물에 관해 지출한 필요비를 소유자에게 상환 청구할 수 없다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/61","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-61","score":1.0,"pdfChars":254,"mirrorChars":246},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-62":{"id":"2022-62","year":2022,"number":62,"subject":"civil","question":"甲에게 법정지상권 또는 관습법상 법정지상권이 인정되는 경우를 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 乙 소유의 토지 위에 乙의 승낙을 얻어 신축한 丙 소유의 건물을 甲이 매수한 경우\nㄴ. 乙 소유의 토지 위에 甲과 乙이 건물을 공유하면서 토지에만 저당권을 설정하였다가, 그 실행을 위한 경매로 丙이 토지소유권을 취득한 경우\nㄷ. 甲이 乙로부터 乙 소유의 미등기건물과 그 대지를 함께 매수하고 대지에 관해서만 소유권이전등기를 한 후, 건물에 대한 등기 전 설정된 저당권에 의해 대지가 경매되어 丙이 토지소유권을 취득한 경우","options":["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/62","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-62","score":1.0,"pdfChars":335,"mirrorChars":326},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-63":{"id":"2022-63","year":2022,"number":63,"subject":"civil","question":"지역권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["요역지는 1필의 토지 일부라도 무방하다.","요역지의 소유권이 이전되어도 특별한 사정이 없는 한 지역권은 이전되지 않는다.","지역권의 존속기간을 영구무한으로 약정할 수는 없다.","지역권자는 승역지를 권원 없이 점유한 자에게 그 반환을 청구할 수 있다.","요역지공유자의 1인은 지분에 관하여 그 토지를 위한 지역권을 소멸하게 하지 못한다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/63","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-63","score":1.0,"pdfChars":230,"mirrorChars":224},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gI 9975,"pdfChars":277,"mirrorChars":270},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-68":{"id":"2022-68","year":2022,"number":68,"subject":"civil","question":"甲은 자신의 X토지를 乙에게 매도하고 소유권이전등기를 마쳐주었으나, 乙은 변제기가 지났음에도 매매대금을 지급하지 않고 있다. 이에 관한 설명으로 틀린 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 甲은 특별한 사정이 없는 한 별도의 최고 없이 매매계약을 해제할 수 있다.\nㄴ. 甲이 적법하게 매매계약을 해제한 경우, X토지의 소유권은 등기와 무관하게 계약이 없었던 상태로 복귀한다.\nㄷ. 乙이 X토지를 丙에게 매도하고 그 소유권이전등기를 마친 후 甲이 乙을 상대로 적법하게 매매계약을 해제하였다면, 丙은 X토지의 소유권을 상실한다.","options":["ㄱ","ㄴ","ㄷ","ㄱ, ㄷ","ㄴ, ㄷ"],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/68","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-68","score":1.0,"pdfChars":335,"mirrorChars":325},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-69":{"id":"2022-69","year":2022,"number":69,"subject":"civil","question":"계약의 유형에 관한 설명으로 옳은 것은?","options":["매매계약은 요물계약이다.","교환계약은 무상계약이다.","증여계약은 낙성계약이다.","도급계약은 요물계약이다.","임대차계약은 편무계약이다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/69","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-69","score":1.0,"pdfChars":103,"mirrorChars":98},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-70":{"id":"2022-70","year":2022,"number":70,"subject":"civil","question":"甲은 그 소유의 X부동산에 관하여 乙과 매매의 일방예약을 체결하면서 예약완결권은 乙이 가지고 20년 내에 행사하기로 약정하였다. 이에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["乙이 예약체결시로부터 1년 뒤에 예약완결권을 행사한 경우, 매매는 예약체결시로 소급하여 그 효력이 발생한다.","乙의 예약완결권은 형성권에 속하므로 甲과의 약정에도 불구하고 그 행사기간은 10년으로 단축된다.","乙이 가진 예약완결권은 재산권이므로 특별한 사정이 없는 한 타인에게 양도할 수 있다.","乙이 예약완결권을 행사기간 내에 행사하였는지에 관해 甲의 주장이 없다면 법원은 이를 고려할 수 없다.","乙이 예약완결권을 행사하더라도 甲의 승낙이 있어야 비로소 매매계약은 그 효력이 발생한다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/70","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-70","score":1.0,"pdfChars":388,"mirrorChars":380},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-71":{"id":"2022-71","year":2022,"number":71,"subject":"civil","question":"권리의 하자에 대한 매도인의 담보책임과 관련하여 '악의의 매수인에게 인정되는 권리'로 옳은 것을 모두 고른 것은?\n\nㄱ. 권리의 전부가 타인에게 속하여 매수인에게 이전할 수 없는 경우 - 계약해제권\nㄴ. 권리의 일부가 타인에게 속하여 그 권리의 일부를 매수인에게 이전할 수 없는 경우 - 대금감액청구권\nㄷ. 목적물에 설정된 저당권의 실행으로 인하여 매수인이 소유권을 취득할 수 없는 경우 - 계약해제권\nㄹ. 목적물에 설정된 지상권에 의해 매수인의 권리행사가 제한되어 계약의 목적을 달성할 수 없는 경우 - 계약해제권","options":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ"],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/71","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-71","score":1.0,"pdfChars":327,"mirrorChars":321},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-72":{"id":"2022-72","year":2022,"number":72,"subject":"civil","question":"부동산의 환매에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["환매특약은 매매계약과 동시에 이루어져야 한다.","매매계약이 취소되어 효력을 상실하면 그에 부수하는 환매특약도 효력을 상실한다.","환매 시 목적물의 과실과 대금의 이자는 특별한 약정이 없으면 이를 상계한 것으로 본다.","환매기간을 정하지 않은 경우, 그 기간은 5년으로 한다.","환매기간을 정한 경우, 환매권의 행사로 발생한 소유권이전등기청구권은 특별한 사정이 없는 한 그 환매기간 내에 행사하지 않으면 소멸한다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/72","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-72","score":1.0,"pdfChars":277,"mirrorChars":271},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-73":{"id":"2022-73","year":2022,"number":73,"subject":"civil","question":"토지임차인에게 인정될 수 있는 권리가 아닌 것은?","options":["부속물매수청구권","유익비상환청구권","지상물매수청구권","필요비상환청구권","차임감액청구권"],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/73","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-73","score":1.0,"pdfChars":81,"mirrorChars":76},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-74":{"id":"2022-74","year":2022,"number":74,"subject":"civil","question":"건물임대차계약상 보증금에 관한 설명으로 틀린 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 임대차계약에서 보증금을 지급하였다는 사실에 대한 증명책임은 임차인이 부담한다.\nㄴ. 임대차계약이 종료하지 않은 경우, 특별한 사정이 없는 한 임차인은 보증금의 존재를 이유로 차임의 지급을 거절할 수 없다.\nㄷ. 임대차 종료 후 보증금이 반환되지 않고 있는 한, 임차인의 목적물에 대한 점유는 적법점유이므로 임차인이 목적물을 계속하여 사용·수익하더라도 부당이득 반환의무는 발생하지 않는다.","options":["ㄱ","ㄴ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/74","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-74","score":0.9977,"pdfChars":305,"mirrorChars":295},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-75":{"id":"2022-75","year":2022,"number":75,"subject":"civil","question":"주택임대차보호법에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 다가구용 단독주택 일부의 임차인이 대항력을 취득하였다면, 후에 건축물 대장상으로 다가구용 단독주택이 다세대 주택으로 변경되었다는 사정만으로는 이미 취득한 대항력을 상실하지 않는다.\nㄴ. 우선변제권 있는 임차인은 임차주택과 별도로 그 대지만이 경매될 경우, 특별한 사정이 없는 한 그 대지의 환가대금에 대하여 우선변제권을 행사할 수 있다.\nㄷ. 임차인이 대항력을 가진 후 그 임차주택의 소유권이 양도되어 양수인이 임차보증금반환채무를 부담하게 되었더라도, 임차인이 주민등록을 이전하면 양수인이 부담하는 임차보증금반환채무는 소멸한다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/75","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-75","score":1.0,"pdfChars":388,"mirrorChars":376},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-76":{"id":"2022-76","year":2022,"number":76,"subject":"civil","question":"세종특별자치시에 소재하는 甲 소유의 X상가건물의 1층 점포를 乙이 분식점을 하려고 甲으로부터 2022. 2. 16. 보증금 6억 원, 차임 월 100만 원에 임차하였고 임차권 등기는 되지 않았다. 이에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 乙이 점포를 인도받은 날에 사업자등록을 신청한 경우, 그 다음 날부터 임차권의 대항력이 생긴다.\nㄴ. 乙이 대항요건을 갖춘 후 임대차계약서에 확정일자를 받은 경우, 「민사집행법」상 경매 시 乙은 임차건물의 환가대금에서 후순위권리자보다 우선하여 보증금을 변제받을 권리가 있다.\nㄷ. 乙은 「감염병의 예방 및 관리에 관한 법률」 제49조제1항제2호에 따른 집합 제한 또는 금지 조치를 총 3개월 이상 받음으로써 발생한 경제사정의 중대한 변동으로 폐업한 경우에는 임대차계약을 해지할 수 있다.","options":["ㄴ","ㄷ","ㄱ, ㄴ","ㄱ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/76","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-76","score":1.0,"pdfChars":448,"mirrorChars":440},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-77":{"id":"2022-77","year":2022,"number":77,"subject":"civil","question":"집합건물의 소유 및 관리에 관한 법률상 공용부분에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 관리단집회 결의나 다른 구분소유자의 동의 없이 구분소유자 1인이 공용부분을 독점적으로 점유·사용하는 경우, 다른 구분소유자는 공용부분의 보존행위로서 그 인도를 청구할 수 있다.\nㄴ. 구분소유자 중 일부가 정당한 권원 없이 구조상 공용부분인 복도를 배타적으로 점유·사용하여 다른 구분소유자가 사용하지 못하였다면, 특별한 사정이 없는 한 이로 인하여 얻은 이익을 다른 구분소유자에게 부당이득으로 반환하여야 한다.\nㄷ. 관리단은 관리비 징수에 관한 유효한 규약이 없더라도 공용부분에 대한 관리비를 그 부담의무자인 구분소유자에게 청구할 수 있다.","options":["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/77","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-77","score":0.9966,"pdfChars":411,"mirrorChars":400},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-78":{"id":"2022-78","year":2022,"number":78,"subject":"civil","question":"가등기담보 등에 관한 법률이 적용되는 가등기담보에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["채무자가 아닌 제3자는 가등기담보권의 설정자가 될 수 없다.","귀속청산에서 변제기 후 청산금의 평가액을 채무자에게 통지한 경우, 채권자는 그가 통지한 청산금의 금액에 관하여 다툴 수 있다.","공사대금채권을 담보하기 위하여 담보가등기를 한 경우, 「가등기담보 등에 관한 법률」이 적용된다.","가등기담보권자는 특별한 사정이 없는 한 가등기담보권을 그 피담보채권과 함께 제3자에게 양도할 수 있다.","가등기담보권자는 담보목적물에 대한 경매를 청구할 수 없다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/78","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-78","score":1.0,"pdfChars":321,"mirrorChars":313},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-79":{"id":"2022-79","year":2022,"number":79,"subject":"civil","question":"2022. 8. 16. 甲은 조세포탈의 목적으로 친구인 乙과 명의신탁약정을 맺고 乙은 이에 따라 甲으로부터 매수자금을 받아 丙 소유의 X토지를 자신의 명의로 매수하여 등기를 이전받았다. 이에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["甲과 乙의 명의신탁약정은 무효이다.","甲과 乙의 명의신탁약정이 있었다는 사실을 丙이 몰랐다면, 乙은 丙으로부터 X토지의 소유권을 승계취득한다.","乙이 X토지의 소유권을 취득하더라도, 甲은 乙에 대하여 부당이득을 원인으로 X토지의 소유권이전등기를 청구할 수 없다.","甲은 乙에 대해 가지는 매수자금 상당의 부당이득반환청구권에 기하여 X토지에 유치권을 행사할 수 없다.","만일 乙이 丁에게 X토지를 양도한 경우, 丁이 명의신탁약정에 대하여 단순히 알고 있었다면 丁은 X토지의 소유권을 취득하지 못한다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/79","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-79","score":1.0,"pdfChars":431,"mirrorChars":417},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2022-80":{"id":"2022-80","year":2022,"number":80,"subject":"civil","question":"집합건물의 소유 및 관리에 관한 법령상 관리인 및 관리위원회 등에 관한 설명으로 옳은 것은?","options":["구분소유자가 아닌 자는 관리인이 될 수 없다.","구분소유자가 10인 이상일 때에는 관리단을 대표하고 관리단의 사무를 집행할 관리인을 선임하여야 한다.","관리위원회를 둔 경우에도 규약에서 달리 정한 바가 없으면, 관리인은 공용부분의 보존행위를 함에 있어 관리위원회의 결의를 요하지 않는다.","규약에서 달리 정한 바가 없으면, 관리인은 관리위원회의 위원이 될 수 있다.","규약에서 달리 정한 바가 없으면, 관리위원회 위원은 부득이한 사유가 없더라도 서면이나 대리인을 통하여 의결권을 행사할 수 있다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2022/minbeop/80","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2022-exam-2996-3e75d06e4d31.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2022-80","score":1.0,"pdfChars":338,"mirrorChars":330},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5211107&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":33,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-1":{"id":"2021-1","year":2021,"number":1,"subject":"estate","question":"토지관련 용어의 설명으로 틀린 것은?","options":["택지지역 내에서 주거지역이 상업지역으로 용도변경이 진행되고 있는 토지를 이행지라 한다.","필지는 하나의 지번이 부여된 토지의 등록단위이다.","획지는 인위적·자연적·행정적 조건에 따라 다른 토지와 구별되는 가격수준이 비슷한 일단의 토지를 말한다.","나지는 건부지 중 건폐율·용적률의 제한으로 건물을 짓지 않고 남겨둔 토지를 말한다.","맹지는 도로에 직접 연결되지 않은 토지이다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/1","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-1","score":1.0,"pdfChars":237,"mirrorChars":232},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-2":{"id":"2021-2","year":2021,"number":2,"subject":"estate","question":"다중주택의 요건이 아닌 것은?(단, 건축법령상 단서조항은 고려하지 않음)","options":["1개 동의 주택으로 쓰이는 바닥면적(부설 주차장 면적은 제외한다)의 합계가 660제곱미터 이하이고 주택으로 쓰는 층수(지하층은 제외한다)가 3개 층 이하일 것","독립된 주거의 형태를 갖추지 않은 것(각 실별로 욕실은 설치할 수 있으나, 취사시설은 설치하지 않은 것을 말한다)","학교 또는 공장 등의 학생 또는 종업원 등을 위하여 쓰는 것으로서 1개 동의 공동취사시설 이용 세대 수가 전체의 50퍼센트 이상인 것","적정한 주거환경을 조성하기 위하여 건축조례로 정하는 실별 최소 면적, 창문의 설치 및 크기 등의 기준에 적합할 것","학생 또는 직장인 등 여러 사람이 장기간 거주할 수 있는 구조로 되어 있는 것"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/2","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-2","score":1.0,"pdfChars":390,"mirrorChars":381},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-3":{"id":"2021-3","year":2021,"number":3,"subject":"estate","question":"토지의 자연적 특성에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 부증성으로 인해 동산과 부동산이 구분되고, 일반재화와 부동산재화의 특성이 다르게 나타난다.\nㄴ. 부동성으로 인해 임장활동과 지역분석을 필요로 한다.\nㄷ. 인접성으로 인해 부동산의 수급이 불균형하여 균형가격의 형성이 어렵다.\nㄹ. 개별성으로 인해 일물일가 법칙의 적용이 배제되어 토지시장에서 물건 간 완전한 대체관계가 제약된다." 소폭이 같다면 균형가격은 불변이고 균형량은 증가한다.","수요는 증가하고 공급이 감소하는 경우, 수요의 증가폭이 공급의 감소폭보다 작다면 균형가격은 상승하고 균형량은 증가한다.","수요는 감소하고 공급이 증가하는 경우, 수요의 감소폭이 공급의 증가폭보다 작다면 균형가격은 하락하고 균형량은 증가한다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/5","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-5","score":1.0,"pdfChars":420,"mirrorChars":406},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-6":{"id":"2021-6","year":2021,"number":6,"subject":"estate","question":"A주택시장과 B주택시장의 함수조건이 다음과 같다. 거미집이론에 의한 두 시장의 모형형태는?(단, x축은 수량, y축은 가격, 각각의 시장에 대한 P는 가격, Qd는 수요량, Qs는 공급량, 다른 조건은 동일함)\n\n○ A주택시장: Qd = 200 - P, Qs = 100 + 4P\n○ B주택시장: Qd = 500 - 2P, Qs = 200 + (1/2)P","options":["A: 수렴형, B: 수렴형","A: 수렴형, B: 발산형","A: 수렴형, B: 순환형","A: 발산형, B: 수렴형","A: 발산형, B: 발산형"],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/6","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-6","score":0.8814,"pdfChars":285,"mirrorChars":277},"visualReview":true},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-7":{"id":"2021-7","year":2021,"number":7,"subject":"estate","question":"수요와 공급의 가격탄력성에 관한 설명으로 옳은 것은?(단, x축은 수량, y축은 가격, 수요의 가격탄력성은 절댓값이며, 다른 조건은 동일함)","options":["수요의 가격탄력성은 수요량의 변화율에 대한 가격의 변화비율을 측정한 것이다.","수요의 가격탄력성이 완전비탄력적이면 가격이 변화할 때 수요량이 무한대로 변화한다.","수요의 가격탄력성이 비탄력적이면 수요량의 변화율이 가격의 변화율보다 더 크다.","공급의 가격탄력성이 탄력적이면 가격의 변화율보다 공급량의 변화율이 더 크다.","공급곡선이 수직선이면 공급의 가격탄력성은 완전탄력적이다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/7","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-7","score":0.9955,"pdfChars":300,"mirrorChars":291},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-8":{"id":"2021-8","year":2021,"number":8,"subject":"estate","question":"A부동산에 대한 기존 시장의 균형상태에서 수요함수는 P = 200 - 2Qd, 공급함수는 2P = 40 + Qs이다. 시장의 수요자수가 2배로 증가되는 경우, 새로운 시장의 균형가격과 기존 시장의 균형가격 간의 차액은?(단, P는 가격(단위: 만원), Qd는 수요량(단위: m²), Qs는 공급량(단위: m²)이며, A부동산은 민간재(private goods)로 시장의 수요자는 모두 동일한 개별수요함수를 가지며, 다른 조건은 동일함)","options":["24만원","48만원","56만원","72만원","80만원"],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/8","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-8","score":0.9537,"pdfChars":291,"mirrorChars":273},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-9":{"id":"2021-9","year":2021,"number":9,"subject":"estate","question":"아파트시장에서 균형가격을 하락시키는 요인은 모두 몇 개인가?(단, 아파트는 정상재이며, 다른 조건은 동일함)\n\n○ 건설노동자 임금 상승\n○ 대체주택에 대한 수요 감소\n○ 가구의 실질소득 증가\n○ 아파트건설업체수 증가\n○ 아파트건설용 토지가격의 누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/19","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-19","score":0.8819,"pdfChars":287,"mirrorChars":322},"visualReview":true},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-20":{"id":"2021-20","year":2021,"number":20,"subject":"estate","question":"화폐의 시간가치 계산에 관한 설명으로 옳은 것은?","options":["현재 10억 원인 아파트가 매년 2%씩 가격이 상승한다고 가정할 때, 5년 후의 아파트가격을 산정하는 경우 연금의 미래가치계수를 사용한다.","원리금균등상환방식으로 담보대출 받은 가구가 매월 상환할 금액을 산정하는 경우, 일시불의 현재가치계수를 사용한다.","연금의 현재가치계수에 감채기금계수를 곱하면 일시불의 현재가치계수이다.","임대기간 동안 월임대료를 모두 적립할 경우, 이 금액의 현재시점 가치를 산정한다면 감채기금계수를 사용한다.","나대지에 투자하여 5년 후 8억 원에 매각하고 싶은 투자자는 현재 이 나대지의 구입금액을 산정하는 경우, 저당상수를 사용한다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/20","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-20","score":1.0,"pdfChars":351,"mirrorChars":343},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-21":{"id":"2021-21","year":2021,"number":21,"subject":"estate","question":"부동산 투자수익률에 관한 설명으로 옳은 것은?(단, 위험회피형 투자자를 가정함)","options":["기대수익률이 요구수익률보다 높을 경우 투자자는 투자가치가 있는 것으로 판단한다.","기대수익률은 투자에 대한 위험이 주어졌을 때, 투자자가 투자부동산에 대하여 자금을 투자하기 위해 충족되어야 할 최소한의 수익률을 말한다.","요구수익률은 투자가 이루어진 후 현실적으로 달성된 수익률을 말한다.","요구수익률은 투자에 수반되는 위험이 클수록 작아진다.","실현수익률은 다른 투자의 기회를 포기한다는 점에서 기회비용이라고도 한다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/21","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-21","score":1.0,"pdfChars":286,"mirrorChars":280},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-22":{"id":"2021-22","year":2021,"number":22,"subject":"estate","question":"포트폴리오이론에 관한 설명으로 옳은 것은?(단, 위험회피형 투자자를 가정함)","options":["포트폴리오 분산투자를 통해 체계적 위험뿐만 아니라 비체계적 위험도 감소시킬 수 있다.","효율적 프론티어(efficient frontier)는 평균-분산 지배원리에 의해 동일한 기대수익률을 얻을 수 있는 상황에서 위험을 최소화할 수 있는 포트폴리오의 집합을 말한다.","분산투자효과는 포트폴리오를 구성하는 투자자산 비중을 늘릴수록 체계적 위험이 감소되어 포트폴리오 전체의 위험이 감소되는 것이다.","최적의 포트폴리오는 투자자의 무차별곡선과 효율적 프론티어의 접점에서 선택된다.","두 자산으로 포트폴리오를 구성할 경우, 포트폴리오에 포함된 개별자산의 수익률 간 상관계수에 상관없이 분산투자효과가 있다."],"correct":[2,4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/22","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-22","score":1.0,"pdfChars":386,"mirrorChars":377},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-23":{"id":"2021-23","year":2021,"number":23,"subject":"estate","question":"부동산 투자분석기법에 관한 설명으로 옳은 것은?","options":["부동산 투자분석기법 중 화폐의 시간가치를 고려한 방법에는 순현재가치법, 내부수익률법, 회계적이익률법이 있다.","내부수익률이란 순현가를 '1'로 만드는 할인율이고, 기대수익률은 순현가를 '0'으로 만드는 할인율이다.","어림셈법 중 순소득승수법의 경우 승수값이 작을수록 자본회수기간이 길어진다.","순현가법에서는 재투자율로 시장수익률을 사용하고, 내부수익률법에서는 요구수익률을 사용한다.","내부수익률법에서는 내부수익률이 요구수익률보다 작은 경우 해당 투자안을 선택하지 않는다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/23","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-23","score":1.0,"pdfChars":298,"mirrorChars":291},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-24":{"id":"2021-24","year":2021,"number":24,"subject":"estate","question":"다음 표와 같은 투자사업(A~C)이 있다. 모두 사업기간이 1년이며, 사업 초기(1월 1일)에 현금지출만 발생하고 사업 말기(12월 31일)에는 현금유입만 발생한다고 한다. 할인율이 연 5%라고 할 때 다음 중 옳은 것은?\n\n○ 투자사업 A: 초기 현금지출 3,800만원, 말기 현금유입 6,825만원\n○ 투자사업 B: 초기 현금지출 1,250만원, 말기 현금유입 2,940만원\n○ 투자사업 C: 초기 현금지출 1,800만원, 말기 현금유입 4,725만원","options":["수익성지수(PI)가 가장 큰 사업은 A이다.","순현재가치(NPV)가 가장 큰 사업은 B이다.","수익성지수가 가장 작은 사업은 C이다.","A의 순현재가치는 B의 순현재가치의 2.5배이다.","A와 C의 순현재가치는 같다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/24","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-24","score":0.9061,"pdfChars":337,"mirrorChars":377},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-25":{"id":"2021-25","year":2021,"number":25,"subject":"estate","question":"부채금융(debt financing)에 해당하는 것을 모두 고른 것은?\n\nㄱ. 주택저당대출\nㄴ. 조인트 벤처(joint venture)\nㄷ. 신탁 을 조달하여 시설을 건설하고 일정기간 동안 타인에게 임대하고, 임대기간 종료 후 국가 또는 지방자치단체 등에게 시설의 소유권을 이전하는 방식\nㄷ. 민간사업자가 자금을 조달하여 시설을 건설하고, 준공과 함께 민간사업자가 당해 시설의 소유권과 운영권을 갖는 방식\n\n<보기>\na. BTO(build-transfer-operate) 방식\nb. BOT(build-operate-transfer) 방식\nc. BTL(build-transfer-lease) 방식\nd. BLT(build-lease-transfer) 방식\ne. BOO(build-own-operate) 방식\nf. ROT(rehabilitate-operate-transfer) 방식","options":["ㄱ - a, ㄴ - c, ㄷ - e","ㄱ - a, ㄴ - d, ㄷ - e","ㄱ - b, ㄴ - c, ㄷ - f","ㄱ - b, ㄴ - d, ㄷ - e","ㄱ - b, ㄴ - d, ㄷ - f"],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/31","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-31","score":1.0,"pdfChars":592,"mirrorChars":583},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-32":{"id":"2021-32","year":2021,"number":32,"subject":"estate","question":"부동산마케팅에 관한 설명으로 틀린 것은?","options":["부동산시장이 공급자 우위에서 수요자 우위의 시장으로 전환되면 마케팅의 중요성이 더욱 증대된다.","STP전략이란 고객집단을 세분화(Segmentation)하고 표적시장을 선정(Targeting)하여 효과적으로 판매촉진(Promotion)을 하는 전략이다.","경쟁사의 가격을 추종해야 할 경우 4P Mix의 가격전략으로 시가전략을 이용한다.","관계 마케팅전략이란 고객과 공급자 간의 지속적인 관계를 유지하여 마케팅효과를 도모하는 전략이다.","시장점유 마케팅전략이란 부동산시장을 점유하기 위한 전략으로 4P Mix전략, STP전략이 있다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/32","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-32","score":1.0,"pdfChars":331,"mirrorChars":322},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-33":{"id":"2021-33","year":2021,"number":33,"subject":"estate","question":"부동산개발에 관한 설명으로 틀린 것은?","options":["부동산개발사업 진행시 행정의 변화에 따른 사업의 인·허가 지연위험은 사업시행자가 스스로 관리할 수 없는 위험이다.","공영(공공)개발은 공공성과 공익성을 위해 택지를 조성한 후 분양 또는 임대하는 토지개발방식을 말한다.","환지방식은 택지가 개발되기 전 토지의 위치·지목·면적 등을 고려하여 택지개발 후 개발된 토지를 토지소유자에게 재분배하는 방식을 말한다.","부동산개발은 미래의 불확실한 수익을 근거로 개발을 진행하기 때문에 위험성이 수반된다.","흡수율분석은 재무적 사업타당성분석에서 사용했던 주요 변수들의 투입 값을 낙관적, 비관적 상황으로 적용하여 수익성을 예측하는 것을 말한다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/33","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-33","score":0.9962,"pdfChars":356,"mirrorChars":348},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-34":{"id":"2021-34","year":2021,"number":34,"subject":"estate","question":"부동산마케팅 전략에 관한 설명으로 옳은 것은?","options":["바이럴 마케팅(viral marketing)전략은 SNS, 블로그 등 다양한 매체를 통해 해당 브랜드나 제품에 대해 입소문을 내게 하여 마케팅효과를 극대화시키는 것이다.","분양성공을 위해 아파트 브랜드를 고급스러운 이미지로 고객의 인식에 각인시키도록 하는 노력은 STP전략 중 시장세분화(Segmentation) 전략에 해당한다.","아파트 분양 모델하우스 방문고객 대상으로 추첨을 통해 자동차를 경품으로 제공하는 것은 4P Mix 전략 중 유통경로(Place)전략에 해당한다.","아파트의 차별화를 위해 커뮤니티 시설에 헬스장, 골프연습장을 설치하는 방안은 4P Mix 전략 중 가격(Price)전략에 해당한다.","고객점유 마케팅전략에서 AIDA의 원리는 주의(Attention) - 관심(Interest) - 결정(Decision) - 행동(Action)의 과정을 말한다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/34","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-34","score":1.0,"pdfChars":470,"mirrorChars":459},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-35":{"id":"2021-35","year":2021,"number":35,"subject":"estate","question":"다음은 감정평가 과정상 지역분석 및 개별분석과 관련된 내용이다. (  )에 들어갈 용어는?\n\n지역분석은 해당 지역의 ( ㄱ ) 및 그 지역 내 부동산의 가격수준을 판정하는 것이며, 개별분석은 대상부동산의 ( ㄴ )을 판정하는 것이다. 지역분석의 분석 대상지역 중 ( ㄷ )은 대상부동산이 속한 지역으로서 부동산의 이용이 동질적이고 가치형성요인 중 지역요인을 공유하는 지역이다.","options":["ㄱ: 표준적이용, ㄴ: 최유효이용, ㄷ: 유사지역","ㄱ: 표준적이용, ㄴ: 최유효이용, ㄷ: 인근지역","ㄱ: 최유효이용, ㄴ: 표준적이용, ㄷ: 유사지역","ㄱ: 최유효이용, ㄴ: 표준적이용, ㄷ: 인근지역","ㄱ: 최유효이용, ㄴ: 최유효이용, ㄷ: 유사지역"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/35","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-35","score":1.0,"pdfChars":362,"mirrorChars":355},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-36":{"id":"2021-36","year":2021,"number":36,"subject":"estate","question":"원가법에서 사용하는 감가수정 방법에 관한 설명으로 틀린 것은?","options":["정률법에서는 매년 감가율이 감소함에 따라 감가액이 감소한다.","정액법에서는 감가누계액이 경과연수에 정비례하여 증가한다.","정액법을 직선법 또는 균등상각법이라고도 한다.","상환기금법은 건물 등의 내용연수가 만료될 때 감가누계상당액과 그에 대한 복리계산의 이자상당액분을 포함하여 당해 내용연수로 상환하는 방법이다.","정액법, 정률법, 상환기금법은 모두 내용연수에 의한 감가수정 방법이다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/36","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-36","score":1.0,"pdfChars":257,"mirrorChars":250},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-37":{"id":"2021-37","year":2021,"number":37,"subject":"estate","question":"감정평가에 관한 규칙상 용어의 정의로 틀린 것은?","options":["기준가치란 감정평가의 기준이 되는 가치를 말한다.","가치형성요인이란 대상물건의 경제적 가치에 영향을 미치는 일반요인, 지역요인 및 개별요인 등을 말한다.","원가법이란 대상물건의 재조달원가에 감가수정을 하여 대상물건의 가액을 산정하는 감정평가방법을 말한다.","거래사례비교법이란 대상물건과 가치형성요인이 같거나 비슷한 물건의 거래사례와 비교하여 대상물건의 현황에 맞게 사정보정, 시점수정, 가치형성요인 비교 등의 과정을 거쳐 대상물건의 가액을 산정하는 감정평가방법을 말한다.","수익분석법이란 대상물건이 장래 산출할 것으로 기대되는 순수익이나 미래의 현금흐름을 환원하거나 할인하여 대상물건의 가액을 산정하는 감정평가방법을 말한다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/37","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2021-exam-2996-817ab1c7e992.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2021-37","score":1.0,"pdfChars":384,"mirrorChars":378},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5209170&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":32,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2021-38":{"id":"2021-38","year":2021,"number":38,"subject":"estate","question":"다음 자료를 활용하여 직접환원법으로 산정한 대상부동산의 수익가액은?(단, 연간 기준이며, 주어진 조건에 한함)\n\n○ 가능총소득(PGI): 70,000,000원\n○ 공실상당액 및 대손충당금: 가능총소득의 5%\n○ 영업경비(OE): 유효총소득(EGI)의 40%\n○ 환원율: 10%","options":["245,000,000원","266,000,000원","385,000,000원","399,000,000원","420,000,000원"],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2021/budongsan/38","p
