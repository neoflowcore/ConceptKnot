격탄력성이 수요의 가격탄력성보다 작은 경우 공급자가 수요자보다 조세부담이 더 크다.\nㅁ. 헨리 조지(H. George)는 토지세가 임차인에게 모두 전가되는 것을 근거로 토지단일세 도입을 주장하였다.","options":["ㄱ, ㄴ","ㄱ, ㄹ","ㄴ, ㄷ, ㅁ","ㄴ, ㄹ, ㅁ","ㄱ, ㄷ, ㄹ, ㅁ"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/budongsan/20","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-20","ocrScore":0.8732},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-21":{"id":"2025-21","year":2025,"number":21,"subject":"estate","question":"A도시의 임대주택시장에서 수요함수는 Qd = 1,000 - 2P, 공급함수는 Qs = 100 + 4P이고, 정부는 A도시의 임대료상한(최고가격)을 호당 120만원으로 규제하였다. 임대주택 수요량과 공급량이 호당 120만원의 임대료에서 결정되는 경우 발생하는 초과수요량은?[단, 임대주택의 규모와 품질은 모두 동일하고, Qd는 임대주택의 수요량(단위: 호), Qs는 임대주택의 공급량(단위: 호), P는 호당 임대료(단위: 만원)이며, 다른 조건은 동일함]","options":["100호","120호","150호","180호","200호"],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/budongsan/21","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-21","ocrScore":0.92},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-22":{"id":"2025-22","year":2025,"number":22,"subject":"estate","question":"부동산정책을 직접개입방식과 간접개입방식으로 구분할 때, 간접개입방식에 해당하는 것을 모두 고른 것은?(단, 다른 조건은 동일함)\n\nㄱ. 임대료 보조\nㄴ. 재산세 부과\nㄷ. 공공임대주택 공급\nㄹ. 공공토지비축제도\nㅁ. 토지거래허가제도\nㅂ. 개발부담금제도","options":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㅂ"," :"통정허위표시를 기초로 새로운 법률상 이해관계를 맺은 제3자에 해당하는 자를 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 가장채권을 가압류한 자\nㄴ. 파산선고를 받은 가장채권자의 파산관재인\nㄷ. 가장소비대차의 계약상 지위를 이전받은 자","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/42","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-42","ocrScore":0.8978},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-43":{"id":"2025-43","year":2025,"number":43,"subject":"civil","question":"무권대리인 乙이 甲을 대리하여 매수인 丙과 매매계약을 체결하였고, 당시 丙은 乙이 무권대리인이라는 사실에 대해 선의·무과실이었다. 이에 관한 설명으로 틀린 것은?(표현대리는 고려하지 않고, 다툼이 있으면 판례에 따름)","options":["甲이 무권대리행위의 일부를 추인한 경우, 丙의 동의가 없더라도 추인의 효력이 있다.","甲이 乙로부터 丙이 지급한 매매대금을 수령한 경우, 특별한 사정이 없는 한 甲은 매매계약을 추인한 것으로 본다.","甲을 단독상속한 乙이 본인 甲의 지위에서 무권대리행위의 추인을 거절하는 것은 신의칙에 반한다.","丙이 상당한 기간을 정하여 甲에게 추인 여부의 확답을 최고한 경우, 甲이 그 기간 내에 확답을 발하지 않은 때에는 추인을 거절한 것으로 본다.","甲이 乙에게 무권대리행위를 추인한 경우, 이를 알지 못한 丙은 매매계약을 철회할 수 있다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/43","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-43","ocrScore":0.9029},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-44":{"id":"2025-44","year":2025,"number":44,"subject":"civil","question":"민법상 복대리에 관한 설명으로 옳은 것은?","options":["복대리인은 대리인이 자신의 이름으로 선임한 대리인의 대리인이다.","대리인이 복대리인을 선임한 때에는 대리인의 대리권은 소멸한다.","임의대리인이 본인의 승낙을 얻어서 복대리인을 선임한 경우, 본인에 대하여 그 선임감독에 관한 책임이 없다.","법정대리인은 본인의 승낙이나 부득이한 사유가 없으면 복대리인을 선임할 수 없다.","법정대리인이 부득이한 사유로 복대리인을 선임한 경우, 본인에 대하여 그 선임감독에 관해서만 책임이 있다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/44","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-44","ocrScore":0.9797},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-45":{"id":"2025-45","year":2025,"number":45,"subject":"civil","question":"의사표시에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["의사표시의 상대방이 의사표시를 받은 때에 제한능력자인 경우, 표의자는 원칙적으로 그 의사표시로써 대항할 수 없다.","비진의표시에서 진의란 특정한 내용의 의사표시를 하고자 하는 표의자의 생각을 말한다.","경과실로 착오에 빠진 표의자가 착오를 이유로 의사표시를 취소한 경우, 표의자는 그로 인해 손해를 입은 상대방에 대하여 불법행위로 인한 손해배상책임을 진다.","통정허위표시로서 무효인 법률행위도 채권자취소권의 대상이 될 수 있다.","공무원의 사직 의사표시와 같은 사인의 공법행위에는 비진의표시에 관한 민법 규정이 준용되지 않는다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/45","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-45","ocrScore":0.982},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-46":{"id":"2025-46","year":2025,"number":46,"subject":"civil","question":"착오로 인한 의사표시에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["착오로 인한 의사표시의 취소권은 당사자들이 합의에 의하여 배제할 수 없다.","착오로 인하여 표의자가 경제적 불이익을 입은 것이 아니라면 이를 법률행위 내용의 중요부분의 착오라고 할 수 없다.","표의자의 중대한 과실에 관한 증명책임은 의사표시를 취소하게 하지 않으려는 상대방에게 있다.","착오로 인한 취소권은 추인할 수 있는 날로부터 3년 내에, 법률행위를 한 날로부터 10년 내에 행사하여야 한다.","매도인이 매수인의 채무불이행을 이유로 매매계약을 적법하게 해제한 후에도 매수인은 착오를 이유로 그 계약을 취소할 수 있다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/46","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-46","ocrScore":0.9507},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-47":{"id":"2025-47","year":2025,"number":47,"subject":"civil","question":"불공정한 법률행위에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["궁박에는 경제적인 궁박뿐만 아니라 정신적·심리적 궁박도 포함된다.","무경험은 거래일반에 대한 경험부족이 아니라 해당 법률행위가 속한 특정영역에서의 경험부족을 뜻한다.","급부와 반대급부 사이의 현저한 불균형은 구체적·개별적 사안에서 일반인의 사회통념에 따라 결정된다.","불공정한 법률행위에도 무효행위의 전환에 관한 법리가 적용될 수 있다.","대리인에 의해 법률행위가 이루어진 경우, 궁박은 본인을 기준으로 판단한다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/47","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-47","ocrScore":0.9806},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-48":{"id":"2025-48","year":2025,"number":48,"subject":"civil","question":"법률행위의 부관에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["불법조건이 붙은 법률행위는 법률행위 전부가 무효로 된다.","법률행위에 조건이 붙어 있는지에 대한 증명책임은 그 조건의 존재를 주장하는 자에게 있다.","기한의 이익은 채무자를 위한 것으로 추정되므로 기한이익 상실에 관한 당사자 간의 특약은 효력이 없다.","불확정한 사실이 발생한 때를 이행기로 정한 경우, 그 사실의 발생이 불가능한 것으로 확정된 때에도 이행기는 도래한 것으로 본다.","조건부 권리는 조건 성취가 미정인 동안에도 일반규정에 의해 담보로 할 수 있다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/48","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-48","ocrScore":0.9817},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-49":{"id":"2025-49","year":2025,"number":49,"subject":"civil","question":"법률행위의 무효에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["무효행위의 추인은 묵시적인 방법으로도 할 수 있다.","무효행위의 추인은 그 무효 원인이 소멸한 후에 하여야 한다.","무효인 법률행위는 그에 따른 법률효과를 침해하는 것처럼 보이는 위법행위가 있더라도 법률효과의 침해에 따른 손해배상을 청구할 수 없다.","무권리자의 처분이 계약으로 이루어진 경우, 권리자가 이를 추인하면 계약의 효과는 원칙적으로 추인한 때부터 권리자에게 귀속한다.","토지거래허가구역 안의 토지거래계약이 허가를 받지 못해 유동적 무효인 상태에서 허가구역 지정이 해제되면 그 계약은 확정적 유효가 된다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/49","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-49","ocrScore":0.9423},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-50":{"id":"2025-50","year":2025,"number":50,"subject":"civil","question":"법률행위의 취소에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 취소권자에 대한 상대방의 이행청구는 법정추인사유가 아니다.\nㄴ. 제한능력을 이유로 법률행위가 취소된 경우, 악의의 제한능력자는 그 행위로 인하여 받은 이익이 현존하는 한도에서 상환할 책임이 있다.\nㄷ. 표의자의 착오를 상대방이 알고 이를 이용한 경우라도 그 착오가 표의자의 중대한 과실로 인한 것이면 표의자는 의사표시를 취소할 수 없다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/50","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-50","ocrScore":0.9491},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-51":{"id":"2025-51","year":2025,"number":51,"subject":"civil","question":"등기청구권의 법적 성질에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 매매계약에 기한 매수인의 소유권이전등기청구권은 물권적 청구권이다.\nㄴ. 무효인 등기의 말소등기에 갈음하는 진정명의회복을 원인으로 한 소유권이전등기청구권은 물권적 청구권이다.\nㄷ. 점유취득시효 완성을 원인으로 한 소유권이전등기청구권은 채권적 청구권이다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/51","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-51","ocrScore":0.9426},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-52":{"id":"2025-52","year":2025,"number":52,"subject":"civil","question":"민법상 물권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["온천권은 관습법상의 물권이라고 볼 수 없다.","유치물과 견련관계가 인정되지 않는 채권을 피담보채권으로 하는 유치권을 인정하는 것은 물권법정주의에 반하지 않는다.","저당권은 당사자 약정뿐만 아니라 법률의 규정에 의해서도 성립될 수 있다.","전세권자가 사용·수익의 권능을 완전히 배제하고 채권담보만을 위하여 전세권을 설정받는 것은 물권법정주의에 반한다.","근린공원을 자유롭게 이용한 사정만으로 그 공원 인근 주민들이 공원이용권이라는 배타적 권리를 취득하였다고 볼 수 없다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/52","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-52","ocrScore":0.9736},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-53":{"id":"2025-53","year":2025,"number":53,"subject":"civil","question":"권리의 객체가 토지인 경우, 그 토지를 점유할 권리가 인정되지 않는 물권을 모두 고른 것은?\n\nㄱ. 저당권\nㄴ. 전세권\nㄷ. 지상권","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/53","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-53","ocrScore":0.8062},"visualReview":true},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-54":{"id":"2025-54","year":2025,"number":54,"subject":"civil","question":"민법상 합유에 관한 설명으로 틀린 것은?(특별한 사정이 없으며, 다툼이 있으면 판례에 따름)","options":["합유자의 권리는 합유물 전부에 미친다.","합유는 조합체의 해산으로 인하여 종료한다.","합유자는 조합체가 존속하는 한 합유물의 분할을 청구하지 못한다.","합유자는 합유자 전원의 동의 없이 합유지분을 처분할 수 없다.","부동산에 관한 합유지분의 포기는 등기 없이도 물권변동의 효력이 생긴다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/54","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-54","ocrScore":0.9804},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-55":{"id":"2025-55","year":2025,"number":55,"subject":"civil","question":"甲 소유의 X토지를 乙이 20년 이상 소유의 의사로 평온, 공연하게 현재까지 점유하고 있다. 乙은 甲에게 취득시효 완성을 이유로 X토지의 소유권이전등기를 청구하였지만, 아직 등기는 이전받지 못하였다. 이후 발생한 아래 각 상황에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["甲이 X토지 위에 비닐하우스를 설치한 경우, 乙은 甲에게 점유권에 기한 방해배제를 청구할 수 있다.","甲은 乙에게 X토지의 점유로 인한 손해의 배상을 청구할 수 없다.","甲은 乙에게 X토지의 점유로 인한 부당이득의 반환을 청구할 수 없다.","X토지가 수용되어 甲이 보상금을 수령한 경우, 乙은 甲에게 보상금의 반환을 청구할 수 없다.","甲이 乙의 시효완성 사실을 알면서도 丙에게 X토지를 처분하여 취득시효완성에 따른 소유권이전등기의무가 이행불능이 된 경우, 乙은 甲에게 불법행위로 인한 손해배상을 청구할 수 있다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/55","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-55","ocrScore":0.9248},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-56":{"id":"2025-56","year":2025,"number":56,"subject":"civil","question":"甲, 乙, 丙이 각각 4/7, 2/7, 1/7의 지분비율로 X토지를 공유하는 경우에 관한 설명으로 틀린 것은?(별도의 특약은 없고, 다툼이 있으면 판례에 따름)","options":["甲은 乙, 丙과의 협의 없이 X토지의 관리에 관한 사항을 정할 수 있다.","甲은 乙, 丙의 동의 없이 X토지를 처분하지 못한다.","丙은 甲, 乙의 동의 없이 자신의 지분을 제3자에게 담보로 제공할 수 있다.","乙이 甲, 丙과의 협의 없이 X토지의 전부를 독점적으로 점유·사용하고 있는 경우, 丙은 공유물의 보존행위로 자신에게 X토지를 인도할 것을 청구할 수 있다.","甲이 자신의 지분을 포기한 경우, 그 지분은 乙과 丙에게 각 지분의 비율로 귀속한다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/56","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-56","ocrScore":0.8943},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-57":{"id":"2025-57","year":2025,"number":57,"subject":"civil","question":"등기 없이도 물권변동의 효력이 생기는 사유가 아닌 것은?(다툼이 있으면 판례에 따름)","options":["상속","재결수용","이행판결","건물의 신축","국세징수법상 공매"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/57","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-57","ocrScore":0.8421},"visualReview":true},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-58":{"id":"2025-58","year":2025,"number":58,"subject":"civil","question":"甲이 乙로부터 乙 소유의 X건물에 대하여 전세권을 설정받은 경우에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["甲이 X건물을 전세권설정계약으로 정한 용법에 따라 사용하지 않더라도 이를 이유로 乙은 전세권소멸을 청구할 수 없다.","X건물의 소유를 목적으로 지상권을 취득한 乙은 특별한 사정이 없는 한 甲의 동의 없이 그 지상권을 소멸시킬 수 없다.","甲은 전세권이 존속하는 동안에는 특별한 사정이 없는 한 전세권을 존속시키면서 전세금반환채권만을 확정적으로 양도할 수 없다.","乙이 전세권 존속 중에 丙에게 X건물을 양도한 경우, 丙은 전세권의 존속기간 만료 시 甲에게 전세금반환의무를 진다.","전세권이 소멸한 경우, 乙은 甲으로부터 X건물의 인도 및 전세권 말소등기에 필요한 서류의 교부를 받는 동시에 전세금을 반환하여야 한다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/58","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-58","ocrScore":0.9414},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-59":{"id":"2025-59","year":2025,"number":59,"subject":"civil","question":"지상권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["지상권자의 지상권갱신청구권은 형성권이다.","담보목적의 지상권이 설정된 경우, 피담보채권이 변제로 소멸하면 그 지상권도 소멸한다.","타인 소유의 기존 연와조 건물을 사용하기 위하여 설정하는 지상권의 최단존속기간은 30년이다.","기존 건물의 소유를 목적으로 설정된 지상권은 그 건물이 멸실되면 소멸한다.","지상권이 저당권의 목적인 경우, 지료연체에 따른 지상권소멸청구는 저당권자에게 통지하는 즉시 그 효력이 생긴다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/59","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-59","ocrScore":0.9825},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-60":{"id":"2025-60","year":2025,"number":60,"subject":"civil","question":"지역권에 관한 설명으로 틀린 것은?","options":["민법은 지역권의 존속기간을 규정하고 있지 않다.","요역지에 설정된 저당권에 기하여 경매가 된 경우, 다른 특약이 없는 한 경매매수인은 요역지의 소유권과 함께 지역권을 취득한다.","점유로 인한 지역권 취득기간의 중단은 지역권을 행사하는 모든 공유자에 대한 사유가 아니면 그 효력이 없다.","지역권자는 지역권을 방해할 염려있는 행위를 하는 자에 대하여 그 예방이나 손해배상의 담보를 청구할 수 있다.","승역지 소유자는 지역권의 행사를 방해하지 않는 범위 내에서 지역권자가 지역권의 행사를 위하여 승역지에 설치한 공작물을 수익 정도의 비율에 따른 비용 분담 없이 사용할 수 있다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/60","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-60","ocrScore":0.9725},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-61":{"id":"2025-61","year":2025,"number":61,"subject":"civil","question":"관습법상 법정지상권에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["무허가건물에 대해서는 법정지상권이 인정될 수 없다.","가설건축물에 대해서는 원칙적으로 법정지상권이 인정될 수 있다.","법정지상권을 포기하기로 하는 특약은 효력이 없다.","법정지상권자는 그 지상권등기 없이도 지상권을 취득할 당시의 토지소유자로부터 그 토지를 양수한 제3자에게 대항할 수 있다.","법정지상권이 성립한 건물을 매매계약에 기해 양수한 자는 등기 없이도 법정지상권을 취득한다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/61","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-61","ocrScore":0.9744},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-62":{"id":"2025-62","year":2025,"number":62,"subject":"civil","question":"저당권에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["저당권은 저당권의 실행비용을 담보한다.","피담보채권은 금전채권이 아니어도 된다.","저당물의 소유권을 취득한 제3자는 그 저당물의 경매에서 경매인이 될 수 있다.","저당권은 특별한 사정이 없는 한 저당권설정 후에 저당목적물에 부합된 물건에는 그 효력이 미치지 않는다.","저당권설정자와 채무자는 반드시 동일인이어야 하는 것은 아니다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/62","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"ans lUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-65":{"id":"2025-65","year":2025,"number":65,"subject":"civil","question":"甲은 자신의 토지를 乙에게 매도하고 중도금까지 수령하였으나 그 토지가 재결수용되어 乙에게 소유권을 이전할 수 없게 되었다. 이에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 甲과 乙은 특약으로 乙이 대가위험을 부담하는 것으로 정할 수 있다.\nㄴ. 乙은 이행불능을 이유로 매매계약을 해제할 수 있다.\nㄷ. 甲이 수용보상금청구권을 취득한 경우, 乙이 매매대금 전부를 지급하면 그 수용보상금청구권 자체가 乙에게 귀속한다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/65","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-65","ocrScore":0.8953},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-66":{"id":"2025-66","year":2025,"number":66,"subject":"civil","question":"계약의 성립에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["청약의 유인을 받은 자가 청약의 유인에 대응하는 의사표시를 하면 계약은 즉시 성립한다.","당사자 간에 동일한 내용의 청약이 상호 교차된 경우, 계약은 두 청약이 상대방에게 발송된 때에 성립한다.","합의해제를 청약한 경우, 그 청약에 대해 조건을 붙여 승낙한 때에는 그 청약은 실효된다.","명예퇴직의 합의가 있더라도 명예퇴직 예정일 전이라면 원칙적으로 명예퇴직 청약을 철회할 수 있다.","매매의 일방예약이 성립하기 위하여 본계약의 요소가 되는 내용들이 확정되어 있거나 확정할 수 있어야 하는 것은 아니다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/66","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-66","ocrScore":0.97},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-67":{"id":"2025-67","year":2025,"number":67,"subject":"civil","question":"동시이행관계가 인정되지 않는 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 담보 목적으로 마쳐진 채권자 명의의 소유권이전등기 말소의무와 피담보채무의 변제의무\nㄴ. 임차인의 임차목적물 반환의무와 임대인의 권리금 회수 방해로 인한 상가건물 임대차보호법에 따른 손해배상의무\nㄷ. 저당권 실행에 따른 경매가 무효로 된 경우, 저당채권자의 경매매수인에 대한 배당금 반환의무와 경매매수인의 채무자에 대한 소유권이전등기 말소의무","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/67","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-67","ocrScore":0.9227},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-68":{"id":"2025-68","year":2025,"number":68,"subject":"civil","question":"부동산 매매계약이 합의해제된 경우에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["매매계약에 기해 이전된 소유권은 등기 없이도 당연히 복귀한다.","당사자는 특별한 사정이 없는 한 채무불이행으로 인한 손해배상을 청구할 수 없다.","계약의 해제로 제3자의 권리를 해할 수 없다고 규정한 민법 제548조 제1항은 합의해제에 유추적용된다.","합의해제를 무효화시키고 해제된 매매계약을 부활시키는 약정은 원칙적으로 당사자 사이에서도 그 효력이 없다.","합의해제를 위한 묵시적 의사표시는 당사자 쌍방에게 계약실현의 의사가 없거나 계약포기의 의사가 있다고 볼 수 있을 정도에 이르러야 한다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/68","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-68","ocrScore":0.9817},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-69":{"id":"2025-69","year":2025,"number":69,"subject":"civil","question":"甲과 乙은 X토지에 관한 매매의 예약에서 매수인 乙이 예약완결권을 갖기로 하였다. 이에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 甲과 乙은 예약완결권의 행사기간에 대하여 특별한 제한 없이 약정할 수 있다.\nㄴ. 예약완결권의 행사기간을 약정한 경우, 그 기간이 지났더라도 乙이 X토지를 인도받아 점유하고 있다면 예약완결권은 소멸하지 않는다.\nㄷ. 乙의 예약완결권이 행사기간을 경과하였는지에 관해서는 법원이 직권으로 조사하여 재판에 고려할 수 없다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/69","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-69","ocrScore":0.91},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-70":{"id":"2025-70","year":2025,"number":70,"subject":"civil","question":"민법상 매도인의 담보책임에 관한 설명으로 옳은 것은?","options":["특정물 하자로 인한 담보책임은 경매의 경우에도 적용된다.","종류물매매에서는 목적물이 특정된 후에 그 물건의 하자로 인한 매도인의 담보책임규정이 적용되지 않는다.","매매의 목적물에 하자가 있는 경우, 매수인은 그 사실을 안 날로부터 1년 내에 손해배상청구권을 행사하여야 한다.","매매계약 당시에 그 목적물의 일부가 멸실된 경우, 선의의 매수인은 대금의 감액을 청구할 수 있다.","변제기에 도달하지 않은 채권의 매도인이 채무자의 자력을 담보한 때에는 매매계약 당시의 자력을 담보한 것으로 추정한다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/70","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-70","ocrScore":0.9802},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-71":{"id":"2025-71","year":2025,"number":71,"subject":"civil","question":"甲은 자기 소유의 X토지와 乙 소유의 Y건물을 교환하자고 청약하였고, 乙이 승낙하였다. 이에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 乙의 승낙은 특별한 사정이 없는 한 그 방식에 제한이 없고 명시적으로 할 필요도 없다.\nㄴ. X토지와 Y건물의 각 소유권이전 및 인도의무는 특별한 약정이나 관습이 없으면 동시에 이행하여야 한다.\nㄷ. 계약 당시 甲이 허위로 X토지의 시가보다 다소 높은 가액을 시가로 고지하더라도 특별한 사정이 없는 한 불법행위가 성립하지 않는다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/71","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-71","ocrScore":0.8858},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-72":{"id":"2025-72","year":2025,"number":72,"subject":"civil","question":"甲으로부터 X건물을 2년간 임차한 乙이 이를 丙에게 전대한 경우에 관한 설명으로 틀린 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 甲이 전대를 동의한 경우, 甲이 乙과 임대차계약을 합의해지하면 丙의 전차권도 소멸한다.\nㄴ. 甲이 전대를 동의하지 않은 경우, 甲은 乙과의 임대차계약이 존속하는 동안 X건물의 불법점유를 이유로 丙에게 차임 상당의 손해배상을 청구할 수 있다.\nㄷ. 甲이 전대를 동의한 경우, 丙이 X건물 사용의 편익을 위하여 甲으로부터 매수한 물건을 X건물에 부속시킨 때에는 丙은 기간만료로 전대차가 종료되면 甲을 상대로 그 물건의 매수를 청구할 수 있다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/72","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-72","ocrScore":0.8971},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-73":{"id":"2025-73","year":2025,"number":73,"subject":"civil","question":"甲이 건물소유를 목적으로 乙로부터 乙 소유의 X토지를 기간의 정함 없이 임차하는 계약을 체결하고 그 지상에 Y건물을 신축한 후, 그 임대차계약이 乙의 해지통고로 종료되었다. 이에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. Y건물이 무허가건물이라면 원칙적으로 지상물매수청구의 대상이 될 수 없다.\nㄴ. 甲은 계약갱신청구를 하지 않으면 지상물매수청구권을 행사할 수 없다.\nㄷ. 甲과 乙이 임대차 종료 전에 지상물매수청구의 대상인 Y건물을 철거하기로 한 약정은 특별한 사정이 없는 한 무효이다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/73","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-73","ocrScore":0.9234},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-74":{"id":"2025-74","year":2025,"number":74,"subject":"civil","question":"민법상 계약의 유형과 성질에 관한 설명으로 옳은 것은?(특약은 고려하지 않음)","options":["매매계약은 요물계약이다.","매매계약은 낙성계약이다.","교환계약은 요식계약이다.","임대차계약은 무상계약이다.","임대차계약은 편무계약이다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/74","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-74","ocrScore":0.8912},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-75":{"id":"2025-75","year":2025,"number":75,"subject":"civil","question":"甲이 2023. 6. 1. 乙로부터 乙 소유의 X주택을 보증금 2억 원, 기간은 1년으로 정하여 임차하는 계약을 체결한 경우, 주택임대차보호법에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 1년의 임대차기간이 만료된 경우, 甲은 乙에게 보증금 2억 원의 반환을 청구할 수 있다.\nㄴ. 임대차계약이 적법하게 묵시적 갱신이 된 경우, 그 존속기간은 2년으로 보지만 甲은 언제든지 乙에게 계약해지를 통지할 수 있다.\nㄷ. 甲의 적법한 계약갱신요구가 乙에게 2025. 2. 15. 도달한 경우, 갱신거절사유가 없는 한 그 도달 시점에 계약갱신의 효력이 발생한다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/75","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-75","ocrScore":0.9244},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-76":{"id":"2025-76","year":2025,"number":76,"subject":"civil","question":"집합건물의 소유 및 관리에 관한 법률에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["구조상 공용부분은 취득시효에 의한 소유권 취득의 대상이 될 수 없다.","전유부분에 관한 담보책임의 존속기간은 특별한 사정이 없는 한 사용검사일부터 기산한다.","관리단은 관리비 징수에 관한 유효한 규약이 없더라도 지분비율에 따라 공용부분의 관리비를 그 부담의무자인 구분소유자에게 청구할 수 있다.","구분소유자가 10인 이상일 때에는 관리단을 대표하고 관리단의 사무를 집행할 관리인을 선임하여야 한다.","구분소유자는 규약 또는 공정증서로써 달리 정하지 않는 한 전유부분과 분리하여 대지사용권을 처분할 수 없다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/76","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-76","ocrScore":0.9861},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-77":{"id":"2025-77","year":2025,"number":77,"subject":"civil","question":"甲은 2024. 5. 1. 乙에게 1억 원을 변제기는 1년 후, 이자는 연 5%로 정하여 대여하면서 그 대여금채권과 乙에 대한 물품대금채권 1억 원을 담보하기 위해 가등기담보계약을 체결하고, 이를 위해 乙 소유의 X토지(계약 당시 시가 2억 원)에 甲 명의로 가등기를 마쳤다. 그 후 乙은 변제기가 지난 2025. 5. 7. 양 채권 중 물품대금채무만 甲에게 전액 변제하였다. 이에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 甲과 乙의 가등기담보계약에는 가등기담보 등에 관한 법률이 적용된다.\nㄴ. 甲이 청산절차를 거쳐 X토지에 관하여 소유권이전의 본등기를 마친 경우, 본등기를 위해 지출한 절차비용은 청산금에서 공제할 수 없다.\nㄷ. 甲이 청산절차를 거치지 않고 X토지에 관하여 2025. 6. 15. 본등기를 마친 다음, 선의의 丙에게 2025. 8. 1. 소유권이전등기를 마친 경우, 2025. 8. 1.부터 甲 명의의 본등기도 확정적으로 유효해진다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/77","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-77","ocrScore":0.9246},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-78":{"id":"2025-78","year":2025,"number":78,"subject":"civil","question":"甲은 2022. 7. 1. 자신의 X토지에 관하여 乙과 유효한 명의신탁약정을 체결하고, 乙 명의로 소유권이전등기를 마쳤다. 이에 관한 설명으로 틀린 것은?(다툼이 있으면 판례에 따름)","options":["甲과 乙이 부부인 경우, 甲이 사망하더라도 그 명의신탁약정은 甲의 상속인 丙과 乙 사이에 유효하게 존속한다.","甲이 丙에게 X토지를 매도한 경우, 그 매매계약은 민법 제569조의 타인 권리의 매매라고 할 수 없다.","丙이 X토지를 무단점유하여 사용·수익할 경우, 甲은 丙에게 직접 그 소유권을 주장할 수 없다.","甲은 乙에게 명의신탁의 해지를 원인으로 소유권에 기한 이전등기를 청구할 수 있다.","丙이 X토지에 대해 점유취득시효를 완성한 후 소유권이전등기를 마치기 전에 甲이 명의신탁의 해지를 원인으로 소유권이전등기를 마친 경우, 丙은 특별한 사정이 없는 한 甲에게 취득시효를 주장할 수 있다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/78","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-78","ocrScore":0.9196},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-79":{"id":"2025-79","year":2025,"number":79,"subject":"civil","question":"甲이 그 소유의 X토지에 관하여 2025. 5. 3. 친구 乙과의 명의신탁약정에 따라 乙 명의로 소유권이전등기를 마쳤다. 이에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["甲은 乙에게 X토지에 관하여 부당이득을 원인으로 한 소유권이전등기를 청구할 수 없다.","乙이 丙에게 X토지를 적법하게 양도하였다가 다시 X토지의 소유권을 취득한 경우, 甲은 乙에게 소유물반환청구권을 행사할 수 있다.","丙이 친구 乙과의 명의신탁약정에 따라 X토지에 관하여 소유권이전등기를 마친 후 명의신탁사실을 알지 못하는 丁에게 X토지를 매도하고 소유권이전등기를 마친 경우, 甲은 丁에게 소유물반환청구권을 행사할 수 있다.","乙이 丙에게 X토지를 처분하여 丙이 유효하게 소유권을 취득한 경우, 乙의 처분행위는 甲에 대한 불법행위에 해당하지 않는다.","만약 甲이 乙과 사이에 乙 명의의 X토지를 매수하면서 대외관계에서 甲을 위해 그 등기명의를 乙이 보유하기로 약정한 경우, 甲과 乙 사이에 명의신탁관계가 성립할 수 없다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2025/minbeop/79","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2025-exam-2996-78fb20b4cdfb.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2025-79","ocrScore":0.9237},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5247125&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":36,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2025-80":{"id":"2025-80","year":2025,"number":80,"subject":"civil","question":"甲은 상품판매를 위해 2025. 5. 1. 乙로부터 부산광역시 소재 乙 소유의 X상가를 보증금 6억 원, 월 차임 100만 원에 임차하는 계약을 체결하였다. 계약 당일 甲은 乙에게 보증금을 지급하고 X상가를 인도받아 사업자등록과 확정일자까지 마쳤다. 위 계약에 적용되는 상가건물 임대차보호법상의 규정에 해당하는 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 임차인의 보증금에 대한 우선변제권에 관한 규정\nㄴ. 임차인의 임차권등기명령에 관한 규정\nㄷ. 차임연체에 따른 임대인의 해지권에 관한 규정","opt /budongsan/16","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-16","score":1.0,"pdfChars":318,"mirrorChars":311},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-17":{"id":"2024-17","year":2024,"number":17,"subject":"estate","question":"지하철 역사가 개발된다는 다음과 같은 정보가 있을 때, 합리적인 투자자가 최대한 지불할 수 있는 이 정보의 현재가치는?(단, 주어진 조건에 한함)\n\n○ 지하철 역사 개발예정지 인근에 A토지가 있다.\n○ 1년 후 지하철 역사가 개발될 가능성은 60%로 알려져 있다.\n○ 1년 후 지하철 역사가 개발되면 A토지의 가격은 14억 3천만원, 개발되지 않으면 8억 8천만원으로 예상된다.\n○ 투자자의 요구수익률(할인율)은 연 10%다.","options":["1억 6천만원","1억 8천만원","2억원","2억 2천만원","2억 4천만원"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/17","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-17","score":1.0,"pdfChars":289,"mirrorChars":279},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-18":{"id":"2024-18","year":2024,"number":18,"subject":"estate","question":"부동산정책에 관한 내용으로 틀린 것은?","options":["국토의 계획 및 이용에 관한 법령상 지구단위계획은 도시·군계획 수립 대상지역의 일부에 대하여 토지 이용을 합리화하고 그 기능을 증진시키며 미관을 개선하고 양호한 환경을 확보하며, 그 지역을 체계적·계획적으로 관리하기 위하여 수립하는 도시·군기본계획을 말한다.","지역지구제는 토지이용에 수반되는 부(-)의 외부효과를 제거하거나 완화시킬 목적으로 활용된다.","개발권양도제(TDR)는 토지이용규제로 인해 개발행위의 제약을 받는 토지소유자의 재산적 손실을 보전해 주는 수단으로 활용될 수 있으며, 법령상 우리나라에서는 시행되고 있지 않다.","부동산 가격공시제도에 따라 국토교통부장관은 일단의 토지 중에서 선정한 표준지에 대하여 매년 공시기준일 현재의 단위면적당 적정가격을 조사·평가하여 공시하여야 한다.","토지비축제는 정부가 토지를 매입한 후 보유하고 있다가 적절한 때에 이를 매각하거나 공공용으로 사용하는 제도를 말한다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/18","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-18","score":0.9946,"pdfChars":489,"mirrorChars":479},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-19":{"id":"2024-19","year":2024,"number":19,"subject":"estate","question":"공공주택 특별법령상 공공임대주택에 관한 내용으로 옳은 것은 모두 몇 개인가?(단, 주택도시기금은 「주택도시기금법」에 따른 주택도시기금을 말함)\n\n○ 통합공공임대주택: 국가나 지방자치단체의 재정이나 주택도시기금의 자금을 지원받아 최저소득 계층, 저소득 서민, 젊은 층 및 장애인·국가유공자 등 사회 취약계층 등의 주거안정을 목적으로 공급하는 공공임대주택\n○ 행복주택: 국가나 지방자치단체의 재정이나 주택도시기금의 자금을 지원받아 대학생, 사회초년생, 신혼부부 등 젊은 층의 주거안정을 목적으로 공급하는 공공임대주택\n○ 장기전세주택: 국가나 지방자치단체의 재정이나 주택도시기금의 자금을 지원받아 전세계약의 방식으로 공급하는 공공임대주택\n○ 분양전환공공임대주택: 일정 기간 임대 후 분양전환할 목적으로 공급하는 공공임대주택","options":["0개","1개","2개","3개","4개"],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/19","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-19","score":0.9984,"pdfChars":436,"mirrorChars":421},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-20":{"id":"2024-20","year":2024,"number":20,"subject":"estate","question":"부동산정책 중 금융규제에 해당하는 것은?","options":["택지개발지구 지정","토지거래허가제 시행","개발부담금의 부담률 인상","분양가상한제의 적용 지역 확대","총부채원리금상환비율(DSR) 강화"],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/20","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-20","score":1.0,"pdfChars":103,"mirrorChars":98},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-21":{"id":"2024-21","year":2024,"number":21,"subject":"estate","question":"주택법령상 주택의 유형과 내용에 관한 설명으로 틀린 것은?","options":["도시형 생활주택은 「국토의 계획 및 이용에 관한 법률」에 따른 도시지역에 건설하여야 한다.","도시형 생활주택은 300세대 미만의 국민주택규모로 구성된다.","토지임대부 분양주택의 경우, 토지의 소유권은 분양주택 건설사업을 시행하는 자가 가지고, 건축물 및 복리시설 등에 대한 소유권은 주택을 분양받은 자가 가진다.","세대구분형 공동주택은 주택 내부 공간의 일부를 세대별로 구분하여 생활이 가능한 구조이어야 하며, 그 구분된 공간의 일부를 구분소유 할 수 있다.","장수명 주택은 구조적으로 오랫동안 유지·관리될 수 있는 내구성을 갖추고, 입주자의 필요에 따라 내부 구조를 쉽게 변경할 수 있는 가변성과 수리 용이성 등이 우수한 주택을 말한다."],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/21","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-21","score":0.9983,"pdfChars":399,"mirrorChars":391},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-22":{"id":"2024-22","year":2024,"number":22,"subject":"estate","question":"부동산조세에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 양도소득세의 중과는 부동산 보유자로 하여금 매각을 앞당기게 하는 동결효과(lock-in effect)를 발생시킬 수 있다.\nㄴ. 재산세와 종합부동산세의 과세기준일은 매년 6월 1일  25%, 정상적 50%, 비관적 25%\n○ 자산별 예상수익률 (낙관적 / 정상적 / 비관적 순)\n  - 자산 A: 6% / 4% / 2%\n  - 자산 B: 10% / 4% / -2%\n  - 자산 C: 9% / 8% / 7%\n  - 자산 D: 14% / 8% / 2%\n○ 자산별 평균(기댓값)과 표준편차\n  - 자산 A: 평균 4.0%, 표준편차 1.41%\n  - 자산 B: 평균 4.0%, 표준편차 4.24%\n  - 자산 C: 평균 8.0%, 표준편차 0.71%\n  - 자산 D: 평균 8.0%, 표준편차 4.24%","options":["자산 A와 자산 B는 동일한 기대수익률을 가진다.","낙관적 시장전망에서는 자산 D의 수익률이 가장 높다.","자산 C와 자산 D는 동일한 투자위험을 가진다.","평균-분산 지배원리에 따르면 자산 C는 자산 A보다 선호된다.","자산 A, B, C, D로 구성한 포트폴리오의 수익과 위험은 각 자산의 투자비중에 따라 달라진다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/24","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-24","score":0.8,"pdfChars":440,"mirrorChars":560},"visualReview":true},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-25":{"id":"2024-25","year":2024,"number":25,"subject":"estate","question":"부동산투자분석 기법에 관한 설명으로 틀린 것은?","options":["순현재가치법과 내부수익률법은 화폐의 시간가치를 반영한 투자분석방법이다.","복수의 투자안을 비교할 때 투자금액의 차이가 큰 경우, 순현재가치법과 내부수익률법은 분석결과가 서로 다를 수 있다.","하나의 투자안에 있어 수익성지수가 1보다 크면 순현재가치는 0보다 크다.","투자자산의 현금흐름에 따라 복수의 내부수익률이 존재할 수 있다.","내부수익률법에서는 현금흐름의 재투자율로 투자자의 요구수익률을 가정한다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/25","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-25","score":1.0,"pdfChars":261,"mirrorChars":253},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","r "question":"A임차인은 비율임대차(percentage lease)방식의 임대차계약을 체결하였다. 이 계약에서는 매장의 월 매출액이 손익분기점 매출액 이하이면 기본임대료만 지급하고, 손익분기점 매출액 초과이면 초과매출액에 대해 일정 임대료율을 적용한 추가임대료를 기본임대료에 가산하여 임대료를 지급한다고 약정하였다. 구체적인 계약조건과 예상매출액은 다음과 같다. 해당 계약내용에 따라 A임차인이 지급할 것으로 예상되는 임대료의 합계는?(단, 주어진 조건에 한함)\n\n○ 계약기간: 1년(1월~12월)\n○ 매장 임대면적: 300m²\n○ 임대면적당 기본임대료: 매월 5만원/m²\n○ 손익분기점 매출액: 매월 3,500만원\n○ 월별 임대면적당 예상매출액\n  - 1월~6월: 매월 10만원/m²\n  - 7월~12월: 매월 19만원/m²\n○ 손익분기점 매출액 초과시 초과매출액에 대한 추가임대료율: 10%","options":["18,000만원","19,320만원","28,320만원","31,320만원","53,520만원"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/28","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-28","score":1.0,"pdfChars":499,"mirrorChars":486},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-29":{"id":"2024-29","year":2024,"number":29,"subject":"estate","question":"현재 5천만원의 기존 주택담보대출이 있는 A씨가 동일한 은행에서 동일한 주택을 담보로 추가대출을 받으려고 한다. 이 은행의 대출승인기준이 다음과 같을 때, A씨가 추가로 대출받을 수 있는 최대금액은 얼마인가?(단, 제시된 두 가지 대출승인기준을 모두 충족시켜야 하며, 주어진 조건에 한함)\n\n○ A씨 담보주택의 담보가치평가액: 5억원\n○ A씨의 연간 소득: 6천만원\n○ 연간 저당상수: 0.1\n○ 대출승인기준\n  - 담보인정비율(LTV): 70% 이하\n  - 총부채상환비율(DTI): 60% 이하","options":["2억원","2억 5천만원","3억원","3억 2천만원","3억 5천만원"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/29","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-29","score":1.0,"pdfChars":320,"mirrorChars":314},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-30":{"id":"2024-30","year":2024,"number":30,"subject":"estate","question":"부동산관리방식을 관리주체에 따라 분류할 때, 다음 설명에 모두 해당하는 방식은?\n\n○ 소유와 경영의 분리가 가능하다.\n○ 대형건물의 관리에 더 유용하다.\n○ 관리에 따른 용역비의 부담이 있다.\n○ 전문적이고 체계적인 관리가 가능하다.","options":["직접관리","위탁관리","자치관리","유지관리","법정관리"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/30","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-30","score":1.0,"pdfChars":164,"mirrorChars":160},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-31":{"id":"2024-31","year":2024,"number":31,"subject":"estate","question":"고정금리대출의 상환방식에 관한 설명으로 옳은 것을 모두 고른 것은?(단, 주어진 조건에 한하며, 다른 조건은 동일함)\n\nㄱ. 만기일시상환대출은 대출기간 동안 차입자가 원금만 상환하기 때문에 원리금상환구조가 간단하다.\nㄴ. 체증식분할상환대출은 대출기간 초기에는 원리금상환액을 적게 하고 시간의 경과에 따라 늘려가는 방식이다.\nㄷ. 원리금균등분할상환대출이나 원금균등분할상환대출에서 거치기간이 있을 경우, 이자지급총액이 증가하므로 원리금지급총액도 증가하게 된다.\nㄹ. 대출채권의 가중평균상환기간(duration)은 원금균등분할상환대출에 비해 원리금균등분할상환대출이 더 길다.","options":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"correct":[4],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/31","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-31","score":1.0,"pdfChars":369,"mirrorChars":357},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-32":{"id":"2024-32","year":2024,"number":32,"subject":"estate","question":"한국주택금융공사의 주택담보노후연금(주택연금)에 관한 설명으로 옳은 것은?","options":["주택소유자와 그 배우자의 연령이 보증을 위한 등기시점 현재 55세 이상인 자로서 소유하는 주택의 기준가격이 15억원 이하인 경우 가입할 수 있다.","주택소유자가 담보를 제공하는 방식에는 저당권 설정 등기 방식과 신탁 등기 방식이 있다.","주택소유자가 생존해 있는 동안에만 노후생활자금을 매월 연금 방식으로 받을 수 있고, 배우자에게는 승계되지 않는다.","「주택법」에 따른 준주택 중 주거목적으로 사용되는 오피스텔의 소유자는 가입할 수 없다.","주택담보노후연금(주택연금)을 받을 권리는 양도·압류할 수 있다."],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/32","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-32","score":0.9979,"pdfChars":332,"mirrorChars":325},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-33":{"id":"2024-33","year":2024,"number":33,"subject":"estate","question":"부동산투자회사법령상 자기관리 부동산투자회사가 상근으로 두어야 하는 자산운용 전문인력의 요건에 해당하는 사람을 모두 고른 것은?\n\nㄱ. 감정평가사로서 해당 분야에 3년을 종사한 사람\nㄴ. 공인중개사로서 해당 분야에 5년을 종사한 사람\nㄷ. 부동산투자회사에서 3년을 근무한 사람\nㄹ. 부동산학 석사학위 소지자로서 부동산의 투자·운용과 관련된 업무에 3년을 종사한 사람","options":["ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/33","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-33","score":0.9971,"pdfChars":247,"mirrorChars":242},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-34":{"id":"2024-34","year":2024,"number":34,"subject":"estate","question":"주택저당담보부채권(MBB)에 관한 설명으로 옳은 것은?","options":["유동화기관이 모기지 풀(mortgage pool)을 담보로 발행하는 지분성격의 증권이다.","차입자가 상환한 원리금은 유동화기관이 아닌 MBB 투자자에게 직접 전달된다.","MBB 발행자는 초과담보를 제공하지 않는 것이 일반적이다.","MBB 투자자 입장에서 MPTS(mortgage pass-through securities)에 비해 현금흐름이 안정적이지 못해 불확실성이 크다는 단점이 있다.","MBB 투자자는 주택저당대출의 채무불이행위험과 조기상환위험을 부담하지 않는다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/34","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-34","score":1.0,"pdfChars":303,"mirrorChars":294},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-35":{"id":"2024-35","year":2024,"number":35,"subject":"estate","question":"감정평가에 관한 규칙에 규정된 내용으로 틀린 것은?","options":["기준시점은 대상물건의 가격조사를 완료한 날짜로 한다. 다만, 기준시점을 미리 정하였을 때에는 그 날짜로 하여야 한다.","감정평가법인등은 법령에 다른 규정이 있는 경우에는 기준시점의 가치형성요인 등을 실제와 다르게 가정하거나 특수한 경우로 한정하는 조건을 붙여 감정평가할 수 있다.","둘 이상의 대상물건이 일체로 거래되거나 대상물건 상호 간에 용도상 불가분의 관계가 있는 경우에는 일괄하여 감정평가할 수 있다.","하나의 대상물건이라도 가치를 달리하는 부분은 이를 구분하여 감정평가할 수 있다.","일체로 이용되고 있는 대상물건의 일부분에 대하여 감정평가하여야 할 특수한 목적이나 합리적인 이유가 있는 경우에는 그 부분에 대하여 감정평가할 수 있다."],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/35","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-35","score":1.0,"pdfChars":397,"mirrorChars":390},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-36":{"id":"2024-36","year":2024,"number":36,"subject":"estate","question":"다음 자료에서 수익방식에 의한 대상부동산의 시산가액 산정시 적용된 환원율은?(단, 연간 기준이며, 주어진 조건에 한함)\n\n○ 가능총수익(PGI): 50,000,000원\n○ 공실손실상당액 및 대손충당금: 가능총수익(PGI)의 10%\n○ 운영경비(OE): 가능총수익(PGI)의 20%\n○ 환원방법: 직접환원법\n○ 수익방식에 의한 대상부동산의 시산가액: 500,000,000원","options":["7.0%","7.2%","8.0%","8.1%","9.0%"],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/36","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-36","score":1.0,"pdfChars":244,"mirrorChars":237},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-37":{"id":"2024-37","year":2024,"number":37,"subject":"estate","question":"다음 자료를 활용하여 거래사례비교법으로 산정한 대상토지의 시산가액은?(단, 주어진 조건에 한함)\n\n○ 대상토지\n  - 소재지: A시 B구 C동 150번지\n  - 용도지역: 제3종일반주거지역\n  - 이용상황, 지목, 면적: 상업용, 대, 100m²\n○ 기준시점: 2024.10.26.\n○ 거래사례\n  - 소재지: A시 B구 C동 120번지\n  - 용도지역: 제3종일반주거지역\n  - 이용상황, 지목, 면적: 상업용, 대, 200m²\n  - 거래가격: 625,000,000원(가격구성비율은 토지 80%, 건물 20%임)\n  - 사정 개입이 없는 정상적인 거래사례임\n  - 거래시점: 2024.05.01.\n○ 지가변동률(A시 B구, 2024.05.01.~2024.10.26.): 주거지역 4% 상승, 상업지역 5% 상승\n○ 지역요인: 대상토지와 거래사례 토지는 인근지역에 위치함\n○ 개별요인: 대상토지는 거래사례 토지에 비해 10% 우세함\n○ 상승식으로 계산","options":["234,000,000원","286,000,000원","288,750,000원","572,000,000원","577,500,000원"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/37","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-37","score":1.0,"pdfChars":543,"mirrorChars":547},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-38":{"id":"2024-38","year":2024,"number":38,"subject":"estate","question":"원가법에서의 재조달원가에 관한 설명으로 틀린 것은?","options":["재조달원가란 대상물건을 기준시점에 재생산하거나 재취득하는 데 필요한 적정원가의 총액을 말한다.","총량조사법, 구성단위법, 비용지수법은 재조달원가의 산정방법에 해당한다.","재조달원가는 대상물건을 일반적인 방법으로 생산하거나 취득하는 데 드는 비용으로 하되, 제세공과금은 제외한다.","재조달원가를 구성하는 표준적 건설비에는 수급인의 적정이윤이 포함된다.","재조달원가를 구할 때 직접법과 간접법을 병용할 수 있다."],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/38","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-38","score":1.0,"pdfChars":265,"mirrorChars":258},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-39":{"id":"2024-39","year":2024,"number":39,"subject":"estate","question":"부동산 가격공시에 관한 법령상 부동산 가격공시제도에 관한 내용으로 틀린 것은?","options":["표준주택으로 선정된 단독주택, 국세 또는 지방세 부과대상이 아닌 단독주택에 대하여는 개별주택가격을 결정·공시하지 아니할 수 있다.","표준주택가격은 국가·지방자치단체 등이 그 업무와 관련하여 개별주택가격을 산정하는 경우에 그 기준이 된다.","개별주택가격 및 공동주택가격은 주택시장의 가격정보를 제공하고, 국가·지방자치단체 등이 과세 등의 업무와 관련하여 주택의 가격을 산정하는 경우에 그 기준으로 활용될 수 있다.","개별주택가격에 이의가 있는 자는 그 결정·공시일부터 30일 이내에 서면(전자문서를 포함한다)으로 시장·군수 또는 구청장에게 이의를 신청할 수 있다.","시장·군수 또는 구청장은 공시기준일 이후에 토지의 분할·합병이나 건축물의 신축 등이 발생한 경우에는 대통령령으로 정하는 날을 기준으로 하여 공동주택가격을 결정·공시하여야 한다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/39","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-39","score":0.9886,"pdfChars":473,"mirrorChars":459},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-40":{"id":"2024-40","year":2024,"number":40,"subject":"estate","question":"감정평가에 관한 규칙상 대상물건별로 정한 감정평가방법(주된 감정평가방법)에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 건물의 주된 감정평가방법은 원가법이다.\nㄴ. 「집합건물의 소유 및 관리에 관한 법률」에 따른 구분소유권의 대상이 되는 건물부분과 그 대지사용권을 일괄하여 감정평가하는 경우의 주된 감정평가방법은 거래사례비교법이다.\nㄷ. 자동차와 선박의 주된 감정평가방법은 거래사례비교법이다. 다만, 본래 용도의 효용가치가 없는 물건은 해체처분가액으로 감정평가할 수 있다.\nㄹ. 영업권과 특허권의 주된 감정평가방법은 수익분석법이다.","options":["ㄱ, ㄴ","ㄴ, ㄹ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ"],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/budongsan/40","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-40","score":0.9509,"pdfChars":385,"mirrorChars":339},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-41":{"id":"2024-41","year":2024,"number":41,"subject":"civil","question":"반사회질서의 법률행위에 해당하는 것은?(다툼이 있으면 판례에 따름)","options":["법령에서 정한 한도를 초과하는 부동산 중개수수료 약정","강제집행을 면할 목적으로 허위의 근저당권을 설정하는 행위","다수의 보험계약을 통해 보험금을 부정취득할 목적으로 체결한 보험계약","반사회적 행위에 의하여 조성된 비자금을 소극적으로 은닉하기 위한 임치계약","양도소득세를 회피할 목적으로 실제 거래가액보다 낮은 금액을 대금으로 기재한 매매계약"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/41","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-41","score":1.0,"pdfChars":235,"mirrorChars":230},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-42":{"id":"2024-42","year":2024,"number":42,"subject":"civil","question":"甲은 강제집행을 피하기 위해 자신의 X부동산을 乙에게 가장매도하여 소유권이전등기를 해 주었는데, 乙이 이를 丙에게 매도하고 소유권이전등기를 해 주었다. 다음 설명 중 틀린 것은?(다툼이 있으면 판례에 따름)","options":["甲과 乙사이의 계약은 무효이다.","甲과 乙사이의 계약은 채권자취소권의 대상이 될 수 있다.","丙이 선의인 경우, 선의에 대한 과실의 유무를 묻지 않고 丙이 소유권을 취득한다.","丙이 악의라는 사실에 관한 증명책임은 허위표시의 무효를 주장하는 자에게 있다.","만약 악의의 丙이 선의의 丁에게 X부동산을 매도하고 소유권이전등기를 해 주더라도 丁은 소유권을 취득하지 못한다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/42","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-42","score":1.0,"pdfChars":330,"mirrorChars":323},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-43":{"id":"2024-43","year":2024,"number":43,"subject":"civil","question":"착오로 인한 의사표시에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 착오로 인한 의사표시의 취소는 선의의 제3자에게 대항하지 못한다.\nㄴ. 의사표시의 상대방이 의사표시자의 착오를 알고 이용한 경우, 착오가 중대한 과실로 인한 것이라도 의사표시자는 의사표시를 취소할 수 있다.\nㄷ. X토지를 계약의 목적물로 삼은 당사자가 모두 지번에 착오를 일으켜 계약서에 목적물을 Y토지로 표시한 경우, 착오를 이유로 의사표시를 취소할 수 있다.","options":["ㄱ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/43","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-43","score":1.0,"pdfChars":293,"mirrorChars":286},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-44":{"id":"2024-44","year":2024,"number":44,"subject":"civil","question":"사기·강박에 의한 의사표시에 관한 설명으로 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 아파트 분양자가 아파트단지 인근에 대규모 공동묘지가 조성된 사실을 알면서 수분양자에게 고지하지 않은 경우, 이는 기망행위에 해당한다.\nㄴ. 교환계약의 당사자가 목적물의 시가를 묵비한 것은 원칙적으로 기망행위에 해당한다.\nㄷ. '제3자의 강박'에 의한 의사표시에서 상대방의 대리인은 제3자에 포함되지 않는다.","options":["ㄱ","ㄴ","ㄱ, ㄷ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],"correct":[3],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/44","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-44","score":0.9973,"pdfChars":264,"mirrorChars":258},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-45":{"id":"2024-45","year":2024,"number":45,"subject":"civil","question":"의사표시의 취소에 관한 설명으로 옳은 것을 모두 고른 것은?\n\nㄱ. 취소권은 추인할 수 있는 날로부터 10년이 경과하더라도 행사할 수 있다.\nㄴ. 강박에 의한 의사표시를 한 자는 강박상태를 벗어나기 전에도 이를 취소할 수 있다.\nㄷ. 취소할 수 있는 법률행위의 상대방이 확정되었더라도 상대방이 그 법률행위로부터 취득한 권리를 제3자에게 양도하였다면 취소의 의사표시는 그 제3자에게 해야 한다.","options":["ㄱ","ㄴ","ㄷ","ㄱ, ㄴ","ㄴ, ㄷ"],"correct":[2],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/45","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-45","score":1.0,"pdfChars":247,"mirrorChars":240},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-46":{"id":"2024-46","year":2024,"number":46,"subject":"civil","question":"甲의 乙에 대한 의사표시에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["甲이 부동산 매수청약의 의사표시를 발송한 후 사망하였다면 그 효력은 발생하지 않는다.","乙이 의사표시를 받은 때에 제한능력자이더라도 甲은 원칙적으로 그 의사표시의 효력을 주장할 수 있다.","甲의 의사표시가 乙에게 도달되었다고 보기 위해서는 乙이 그 내용을 알았을 것을 요한다.","甲의 의사표시가 등기우편의 방법으로 발송된 경우, 상당한 기간 내에 도달되었다고 추정할 수 없다.","乙이 정당한 사유 없이 계약해지 통지의 수령을 거절한 경우, 乙이 그 통지의 내용을 알 수 있는 객관적 상태에 놓여 있는 때에 의사표시의 효력이 생긴다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/46","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-46","score":1.0,"pdfChars":352,"mirrorChars":344},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-47":{"id":"2024-47","year":2024,"number":47,"subject":"civil","question":"계약의 무권대리에 관한 설명으로 옳은 것은?(다툼이 있으면 판례에 따름)","options":["본인이 추인하면 특별한 사정이 없는 한 그때부터 계약의 효력이 생긴다.","본인의 추인의 의사표시는 무권대리행위로 인한 권리의 승계인에 대하여는 할 수 없다.","계약 당시 무권대리행위임을 알았던 상대방은 본인의 추인이 있을 때까지 의사표시를 철회할 수 있다.","무권대리의 상대방은 상당한 기간을 정하여 본인에게 추인여부의 확답을 최고할 수 있고, 본인이 그 기간 내에 확답을 발하지 않으면 추인한 것으로 본다.","본인이 무권대리행위를 안 후 그것이 자기에게 효력이 없다고 이의를 제기하지 않고 이를 장시간 방치한 사실만으로는 추인하였다고 볼 수 없다."],"correct":[5],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/47","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-47","score":1.0,"pdfChars":357,"mirrorChars":349},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-48":{"id":"2024-48","year":2024,"number":48,"subject":"civil","question":"甲은 자신의 토지에 관한 매매계약 체결을 위해 乙에게 대리권을 수여하였고, 乙은 甲의 대리인으로서 丙과 매매계약을 체결하였다. 다음 설명 중 옳은 것을 모두 고른 것은?(다툼이 있으면 판례에 따름)\n\nㄱ. 乙은 원칙적으로 복대리인을 선임할 수 있다.\nㄴ. 乙은 특별한 사정이 없는 한 계약을 해제할 권한이 없다.\nㄷ. 乙이 丙에게 甲의 위임장을 제시하고 계약을 체결하면서 계약서상 매도인을 乙로 기재한 경우, 특별한 사정이 없는 한 甲에게 그 계약의 효력이 미치지 않는다.","options":["ㄴ","ㄷ","ㄱ, ㄴ","ㄱ, ㄷ","ㄴ, ㄷ"],"correct":[1],"verified":true,"source":"한국산업인력공단 Q-Net · 공공누리 제1유형","transcriptionUrl":"https://gonginpass.kr/exam/2024/minbeop/48","paperUrl":"https://gosi24.com/wp-content/uploads/2026/10/2024-exam-2996-90d1f2f12239.pdf","diagrams":[],"checks":{"options":5,"mirrorKeyMatch":true,"answerPdfChecked":true,"primaryText":{"id":"2024-48","score":1.0,"pdfChars":295,"mirrorChars":288},"visualReview":false},"originalUrl":"https://www.q-net.or.kr/cst003.do?artlSeq=5214724&boardId=Q004&gId=08&gSite=L&id=cst00302&menuType=cst00309","round":35,"format":"A","status":"ready","note":"표·수식은 원문 의미를 유지한 텍스트 표현. 기준은 해당 연도 시험."},"2024-49":{"id":"2024-49","year":2024,"number":49,"subject":"civil","question":"취소할 수 있는 법률행위의 법정추인 사유가 아닌 것은?","options":["혼동","경개","취소권자의 이행청구","취소권자의 강제집행","취소권자인 채무자의 담보제공"],
